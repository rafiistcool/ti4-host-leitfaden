name: Hub-API

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/hub-api.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/hub-api.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests
        run: mvn -B verify
