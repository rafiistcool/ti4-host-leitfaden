name: Docker-Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  # In Pull Requests nur bauen (prüft Dockerfiles und nginx-Konfiguration), nicht veröffentlichen
  pull_request:
    paths: ["Dockerfile", "docker/**", "server/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      # Ein fehlgeschlagenes API-Image soll das Seiten-Image nicht abbrechen
      fail-fast: false
      matrix:
        include:
          - name: Seite (nginx)
            context: .
            image: ghcr.io/${{ github.repository }}
          - name: Hub-API (Rust)
            context: ./server
            image: ghcr.io/${{ github.repository }}-api
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
