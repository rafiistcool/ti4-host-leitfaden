name: Release

# Erzeugt das GitHub-Release zu einem Tag wie v1.0.0. Die Notizen stehen in docs/releases/<tag>.md,
# fehlt die Datei, schreibt GitHub sie aus den Commits.
# Zwei Wege: Tag pushen, oder hier „Run workflow“ mit der Version (legt den Tag auf main selbst an
# und stößt danach die Docker-Images zum Tag an).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version, z. B. v1.0.0"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - id: notes
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Tag muss wie v1.0.0 aussehen: $TAG"; exit 1 ;; esac
          f="docs/releases/${TAG}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
      # Ein vom Workflow angelegter Tag löst docker.yml nicht von selbst aus, darum hier anstoßen.
      - if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
