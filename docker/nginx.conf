# Läuft die Seite hinter einem weiteren Proxy mit HTTPS (eigene Domain), dessen Angabe durchreichen,
# damit die API das Login-Cookie als Secure setzt.
map $http_x_forwarded_proto $hub_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Grobe Bremse gegen Skripte, die die API fluten. Für die Spielrunde (alle 20 s ein Abgleich) reicht das locker.
limit_req_zone $binary_remote_addr zone=hub_api:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Hub-API (Rust, Dienst "ti4-hub-api" aus docker-compose.yml).
    # Über eine Variable aufgelöst, damit nginx auch ohne API-Container startet. Ist sie nicht erreichbar,
    # zeigt der Hub einen Fehler statt lokal weiterzuspeichern (sonst laufen die Daten auseinander).
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 2s;
    location /api/ {
        proxy_connect_timeout 3s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @hub_down;
        set $hub_api http://ti4-hub-api:8080;
        proxy_pass $hub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $hub_proto;
        limit_req zone=hub_api burst=40 nodelay;
        limit_req_status 429;
        add_header Cache-Control "no-store" always;
        client_max_body_size 64k;
    }

    location @hub_down {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 503 '{"status":503,"title":"Service Unavailable","detail":"Hub-Server gerade nicht erreichbar. Neuer Versuch in ein paar Sekunden."}';
    }

    # Seite und Service Worker immer frisch prüfen, damit Updates ankommen
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache" always;
    }

    # Schriften und Icons ändern sich selten
    location ~* ^/(fonts|icons)/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
