server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Hub-API (Spring Boot, Dienst "ti4-hub-api" aus docker-compose.yml).
    # Über eine Variable aufgelöst, damit nginx auch ohne API-Container startet; die Seite speichert dann nur lokal.
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /api/ {
        set $hub_api http://ti4-hub-api:8080;
        proxy_pass $hub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        client_max_body_size 64k;
    }

    # Seite und Service Worker immer frisch prüfen, damit Updates ankommen
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache" always;
    }

    # Schriften und Icons ändern sich selten
    location ~* ^/(fonts|icons)/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
