window.TI4 = window.TI4 || {};
TI4.rules = (TI4.rules || []).concat([
{ id: "agendakarte", nr: 1, t: "Agendakarte", en: "Agenda Card", k: "Gesetz Verordnung Law Directive",
  x: ["Agendakarten sind die Beschlüsse, über die in der Agendaphase abgestimmt wird. Es gibt zwei Arten.",
    ["**Gesetze** ändern die Regeln dauerhaft. Gewinnt „Dafür“ oder wird jemand bzw. etwas gewählt, bleibt die Karte im Spiel, im gemeinsamen Bereich oder beim Spieler, je nach Kartentext.",
     "Gewinnt bei einem Gesetz „Dagegen“, wird nur dieser Effekt ausgeführt und die Karte abgelegt.",
     "**Verordnungen** wirken einmal und werden danach abgelegt.",
     "Wer ein Gesetz in seinem Spielbereich liegen hat, besitzt es. Wird ein Gesetz abgelegt, endet seine Wirkung."]],
  see: ["agendaphase", "einfluss"] },

{ id: "agendaphase", nr: 2, t: "Agendaphase und Abstimmen", en: "Agenda Phase, Voting", k: "Abstimmen Stimmen Prognose Enthaltung Gleichstand",
  x: ["Gibt es erst, sobald jemand den Hütermarker von Mecatol Rex entfernt hat. Ab dann folgt sie in jeder Runde auf die Statusphase, schon in der Runde, in der der Marker entfernt wurde.",
    ["Erste Agenda: Der Sprecher zieht die oberste Agendakarte und liest sie mit allen Alternativen vor. Dann wird abgestimmt und die Alternative mit den meisten Stimmen abgehandelt.",
     "Zweite Agenda: genauso.",
     "Zum Schluss macht jeder seine erschöpften Planeten spielbereit. Nur Planeten, keine anderen Karten."],
    "**Abstimmen:**",
    ["Reihum ab links vom Sprecher, der Sprecher stimmt zuletzt.",
     "Stimmen entstehen durch Erschöpfen eigener Planeten. Jeder Planet gibt seinen vollen Einflusswert.",
     "Alle eigenen Stimmen gehen an dieselbe Alternative. Die Wahl wird laut angesagt.",
     "Bei „Wählt …“-Agenden darf man für sich selbst stimmen. Planeten muss bereits jemand kontrollieren.",
     "Handelswaren sind keine Stimmen. Zusätzliche Stimmen aus Effekten gehen an dieselbe Alternative.",
     "Enthaltung ist erlaubt. Null Stimmen gelten als Enthaltung.",
     "Wer wegen eines Effekts nicht abstimmen darf, gibt auch über andere Effekte keine Stimmen ab.",
     "Gleichstand oder gar keine Stimmen: Der Sprecher entscheidet. Das zählt nicht als Abstimmung."],
    "**Prognosen** (z. B. für Nachtrag-Aktionskarten) werden nach dem Aufdecken und vor der ersten Stimme angesagt. Sie werden ausgewertet, nachdem die Alternative abgehandelt ist.",
    "Während jeder Agenda darf jedes Spielerpaar eine Transaktion machen, auch ohne Nachbarn zu sein."],
  see: ["agendakarte", "einfluss", "huetermarker", "sprecher", "transaktionen"] },

{ id: "aktionskarten", nr: 3, t: "Aktionskarten", en: "Action Cards", k: "Handlimit Sabotage negieren",
  x: ["Verdeckte Handkarten mit einmaligen Effekten. Zu Spielbeginn hat niemand Aktionskarten.",
    ["Ziehen: 1 Karte in jeder Statusphase, 2 Karten über Politik (Primär- und Sekundärfähigkeit) und durch einzelne Effekte.",
     "Handlimit 7. Wer mehr hat, wählt sofort 7 aus und legt den Rest ab.",
     "Der fett gedruckte erste Absatz nennt den Zeitpunkt.",
     "Steht dort „Aktion“, kostet die Karte eine Materialaktion im eigenen Zug der Aktionsphase. Sie ist nur erlaubt, wenn sie vollständig abgehandelt werden kann.",
     "Alle anderen Karten spielt man, sobald ihr Zeitpunkt eintritt, auch im Zug anderer Spieler und nach dem Passen.",
     "Im selben Zeitfenster dürfen keine zwei gleichnamigen Karten auf dieselben Einheiten oder denselben Effekt gespielt werden. Negierte Karten gelten als nicht gespielt.",
     "Gespielte und negierte Karten kommen auf den Ablagestapel. Ist der Stapel leer, wird der Ablagestapel gemischt."],
    "Man darf anderen seine Karten freiwillig zeigen. Getauscht werden sie nicht (Ausnahme: Emirate der Hacan)."],
  see: ["materialaktion", "faehigkeiten", "politik", "statusphase"], topic: "timing" },

{ id: "aktionsphase", nr: 4, t: "Aktionsphase", en: "Action Phase", k: "Zug passen",
  x: ["In Initiativreihenfolge führt jeder Spieler in seinem Zug genau eine Aktion durch. Das geht reihum, bis alle gepasst haben.",
    ["**Strategieaktion**: Primärfähigkeit der eigenen Strategiekarte.",
     "**Taktikaktion**: System aktivieren, bewegen, kämpfen, landen, produzieren.",
     "**Materialaktion**: eine Fähigkeit mit dem Stichwort „Aktion“.",
     "**Passen**: erst erlaubt, wenn die Strategieaktion gemacht wurde. Bei 3 oder 4 Spielern müssen beide Strategiekarten erschöpft sein. Wer keine Aktion durchführen kann, muss passen."],
    "Wer gepasst hat, bekommt keine Züge mehr. Im Zug des Passens darf er noch Transaktionen und „zu Beginn deines Zuges“-Effekte abhandeln. Sekundärfähigkeiten anderer darf er weiter nutzen. Haben alle anderen gepasst, macht der letzte Spieler seine Aktionen einfach hintereinander."],
  see: ["strategieaktion", "taktikaktion", "materialaktion", "initiativreihenfolge"] },

{ id: "aktiver-spieler", nr: 5, t: "Aktiver Spieler", en: "Active Player",
  x: ["Der Spieler, der in der Aktionsphase gerade am Zug ist. Nach seinem Zug wird der Nächste in Initiativreihenfolge aktiv. Wer gepasst hat, wird übersprungen.",
    "Im Kampf ist der aktive Spieler immer der Angreifer. Wollen mehrere Spieler gleichzeitig Fähigkeiten nutzen, beginnt der aktive Spieler."],
  see: ["aktionsphase", "angreifer", "faehigkeiten"] },

{ id: "aktives-system", nr: 6, t: "Aktives System", en: "Active System", k: "aktivieren",
  x: ["Das System, das bei einer Taktikaktion mit einem Kommandomarker aus dem Taktikpool aktiviert wurde. Es bleibt für die ganze Taktikaktion aktiv.",
    ["Ein System mit eigenem Kommandomarker kann man nicht aktivieren.", "Kommandomarker anderer Spieler stören nicht."]],
  see: ["taktikaktion", "kommandomarker"] },

{ id: "anfuehrer", nr: 7, t: "Anführer: Agent, Commander, Held", en: "Leaders: Agent, Commander, Hero", pok: true, k: "Agent Commander Held freischalten Allianz Nomade",
  x: ["Jede Fraktion hat drei Anführer. Der Nomade hat zwei zusätzliche Agenten, also fünf.",
    "**Agent**",
    ["Ist von Spielbeginn an spielbereit, muss nicht freigeschaltet werden.",
     "Wird zum Nutzen meist erschöpft und im Schritt „Spielbereit machen“ der Statusphase wieder bereit.",
     "Viele Agenten wirken auch zugunsten anderer Spieler. Gut für Verhandlungen."],
    "**Commander**",
    ["Muss freigeschaltet werden. Die Bedingung steht hinter „Freischalten“ auf der Karte.",
     "Geprüft wird erst, wenn eine laufende Fähigkeit vollständig abgehandelt ist.",
     "Einmal freigeschaltet, bleibt er frei. Er wird nie erschöpft.",
     "Mit der Vertragskarte „Allianz“ darf ein anderer Spieler die Fähigkeit mitnutzen. Der Besitzer behält sie trotzdem."],
    "**Held**",
    ["Wird freigeschaltet, sobald der Spieler 3 gewertete Aufträge hat (öffentliche und geheime gemischt). Andere Siegpunkte zählen nicht.",
     "Wird nie erschöpft. Nach der Nutzung wird er vernichtet (Ausnahme: Titanen des Ul, deren Held an Elysium angelegt wird)."]],
  see: ["anfuehrerbogen", "vertragskarten", "vernichten", "auftragskarten"] },

{ id: "anfuehrerbogen", nr: 8, t: "Anführerbogen", en: "Leader Sheet", pok: true,
  x: ["Jeder Spieler hat einen Anführerbogen mit Plätzen für Agent, Commander und Held sowie für die Mech-Einheitenkarte.",
    ["Beim Aufbau liegt jede Karte mit der Seite nach oben, deren Streifen zum Platz passen: ein Streifen Agent, zwei Commander, drei Held.",
     "Die Kurzübersicht des Bogens darf man unter den Fraktionsbogen schieben."]],
  see: ["anfuehrer", "mechs"] },

{ id: "angreifer", nr: 9, t: "Angreifer", en: "Attacker",
  x: ["Im Raum- und Bodenkampf ist der aktive Spieler der Angreifer, der andere Spieler der Verteidiger.",
    ["Der Angreifer würfelt im Raumkampf zuerst.", "Den Rückzug kündigt zuerst der Verteidiger an."]],
  see: ["verteidiger", "raumkampf", "bodenkampf"] },

{ id: "angrenzend", nr: 10, t: "Angrenzend", en: "Adjacency", k: "benachbart Nachbarsystem",
  x: ["Zwei Systemtafeln grenzen aneinander, wenn sie sich an einer Kante berühren.",
    ["Systeme mit gleichartigen Wurmlöchern grenzen aneinander.",
     "Systeme, die über eine Linie auf Hyperrouten-Tafeln verbunden sind, grenzen in jeder Hinsicht aneinander.",
     "Eine Einheit oder ein Planet grenzt an alle Systeme, die an ihr System grenzen.",
     "Ein Planet grenzt an das System, in dem er liegt. Ein System grenzt nicht an sich selbst."]],
  see: ["wurmloecher", "hyperrouten", "nachbarn", "bewegung"] },

{ id: "anlegen", nr: 11, t: "Anlegen", en: "Attach", pok: true, k: "Verstärkung Verstärkungsmarker",
  x: ["Manche Karten (vor allem Erkundungskarten mit dem Stichwort „Verstärkung“) werden an eine Planetenkarte angelegt und verändern den Planeten, z. B. höhere Werte oder eine Technologie-Spezialisierung.",
    ["Man schiebt die Karte halb unter die Planetenkarte und legt den passenden Verstärkungsmarker auf den Planeten.",
     "Wechselt die Kontrolle über den Planeten, bleibt die angelegte Karte beim Planeten und behält ihren Zustand (erschöpft oder spielbereit).",
     "Wird die Planetenkarte vernichtet, werden auch angelegte Karten vernichtet und ihre Marker entfernt."]],
  see: ["erkundung", "planeten", "kontrolle"] },

{ id: "anomalien", nr: 12, t: "Anomalien", en: "Anomalies",
  x: ["Systeme mit besonderen Regeln, erkennbar an den roten Ecken der Tafel. Es gibt vier Arten: Asteroidenfeld, Nebel, Supernova, Gravitationsstrudel.",
    ["Auch Systeme mit Planeten können Anomalien sein.",
     "Effekte können ein System zur Anomalie machen. Ein System kann auch zwei Anomalien gleichzeitig sein und hat dann beide Eigenschaften.",
     "Beim Aufbau dürfen Anomalien nur nebeneinander liegen, wenn es nicht anders geht."]],
  see: ["asteroidenfeld", "nebel", "supernova", "gravitationsstrudel"], topic: "takt" },

{ id: "asteroidenfeld", nr: 13, t: "Asteroidenfeld", en: "Asteroid Field",
  x: ["Anomalie. Schiffe dürfen sich weder hinein- noch hindurchbewegen.",
    "Die Technologie Antimassen-Deflektoren (Antimass Deflectors) hebt das auf und erlaubt auch den Rückzug ins Asteroidenfeld."],
  see: ["anomalien", "bewegung"] },

{ id: "auftragskarten", nr: 14, t: "Auftragskarten (Ziele)", en: "Objective Cards", k: "Ziel Ziele werten öffentlich geheim Stufe Siegpunkte",
  x: ["Aufträge bringen Siegpunkte. Es gibt öffentliche (Stufe I und II) und geheime Aufträge.",
    "**Allgemein**",
    ["Jede Karte nennt Bedingung, Siegpunkte und die Phase, in der sie gewertet wird (Status-, Aktions- oder Agendaphase).",
     "In der Statusphase muss die Bedingung im Schritt „Aufträge werten“ erfüllt sein. Pro Statusphase höchstens 1 öffentlicher und 1 geheimer Auftrag.",
     "In der Aktions- und Agendaphase jederzeit, sobald die Bedingung erfüllt ist, auch im Zug anderer. Beliebig viele, aber pro Kampf höchstens 1 Auftrag. In einer Taktikaktion also einer im Raumkampf und einer im Bodenkampf.",
     "Jeden Auftrag kann jeder Spieler nur einmal pro Partie werten.",
     "Kosten auf einer Karte (Ressourcen, Einfluss, Marker) bezahlt man beim Werten.",
     "„Zerstören“ in einer Bedingung umfasst Treffer, Aktionskarten, Technologien und alles mit dem Wort „zerstören“."],
    "**Öffentliche Aufträge**",
    ["Beim Aufbau liegen 5 Stufe-I- und 5 Stufe-II-Karten verdeckt aus, die ersten 2 Stufe-I-Karten werden aufgedeckt.",
     "In jeder Statusphase deckt der Sprecher eine weitere auf. Stufe II erst, wenn alle Stufe-I-Karten offen sind.",
     "Kann keine mehr aufgedeckt werden, endet die Partie sofort.",
     "**Wer nicht alle Planeten seines Heimat-Systems kontrolliert, darf keine öffentlichen Aufträge werten.**"],
    "**Geheime Aufträge**",
    ["Zu Beginn hat jeder 1 geheimen Auftrag (2 ziehen, 1 behalten). Weitere über Imperium.",
     "Höchstens 3 geheime Aufträge, gewertete und ungewertete zusammen. Wer einen vierten zieht, mischt einen ungewerteten zurück.",
     "Man wertet nur eigene geheime Aufträge und deckt sie dabei auf."]],
  see: ["siegpunkte", "statusphase", "imperium"] },

{ id: "aufwertungen", nr: 15, t: "Aufwertungen für Einheiten", en: "Unit Upgrades", k: "Träger II Infanterie II Upgrade",
  x: ["Technologiekarten mit dem Namen einer Einheit und einer höheren römischen Ziffer, z. B. „Träger II“.",
    ["Sie werden offen auf das Feld der Einheit auf dem Fraktionsbogen gelegt und ersetzen dessen Werte und Fähigkeiten für alle Einheiten dieses Typs.",
     "Ein weißer Pfeil auf dem Fraktionsbogen zeigt, welche Werte sich durch die Aufwertung verbessern würden.",
     "Aufwertungen haben keine Farbe und erfüllen keine Voraussetzungen.",
     "Die Mech-Einheitenkarte ist keine Technologie."]],
  see: ["technologie", "einheiten"] },

{ id: "ausgeschieden", nr: 16, t: "Ausgeschiedene Spieler", en: "Elimination",
  x: ["Ein Spieler scheidet aus, wenn er gleichzeitig keine Bodentruppen auf dem Spielplan, keine Einheit mit „Produktion“ und keine Planeten mehr hat.",
    ["Sein Material (Einheiten, Marker, Bögen, Technologien, Vertragskarten seiner Farbe) kommt in die Schachtel, auch Vertragskarten seiner Farbe bei anderen Spielern.",
     "Vertragskarten anderer Spieler in seinem Besitz gehen an ihre Besitzer zurück.",
     "Seine Agenden werden abgelegt, Aktionskarten abgeworfen, geheime Aufträge in den Stapel gemischt, Strategiekarten in die Mitte gelegt.",
     "Von ihm gekaperte Einheiten gehen an ihre Besitzer zurück.",
     "War er Sprecher, geht der Sprechermarker an den Spieler zu seiner Linken.",
     "Begann die Partie mit 5 oder mehr Spielern, wählt man auch mit nur noch 3 oder 4 Spielern weiter nur 1 Strategiekarte."]],
  see: ["vertragskarten", "sprecher"] },

{ id: "bewegung", nr: 17, t: "Bewegung", en: "Movement", k: "fliegen Schiffe bewegen",
  x: ["Schiffe bewegen sich im Schritt „Bewegung“ einer Taktikaktion ins aktive System.",
    ["Zuerst ansagen, welche Schiffe fliegen. Sie kommen gleichzeitig an.",
     "Das Schiff muss im aktiven System enden und darf höchstens so viele Systeme betreten, wie sein Bewegungswert erlaubt.",
     "Es darf nicht aus einem anderen System starten, das einen eigenen Kommandomarker enthält. Durchfliegen eigener markierter Systeme ist erlaubt.",
     "Durch Systeme mit Schiffen anderer Spieler darf man nicht hindurchfliegen. Auch Jäger allein blockieren.",
     "Ein Schiff darf das aktive System verlassen und wieder hineinfliegen, wenn der Bewegungswert reicht.",
     "Schiffe mit Kapazität dürfen dabei Jäger und Bodentruppen transportieren.",
     "Nach dem Bewegen folgt das Offensivfeuer der Weltraumkanone."],
    "Bewegt eine Fähigkeit ein Schiff außerhalb dieses Schritts, gelten nur die Regeln der Fähigkeit, nicht der Bewegungswert."],
  see: ["transportieren", "anomalien", "aktives-system", "weltraumkanone"], topic: "takt" },

{ id: "bewegungswert", nr: 18, t: "Bewegungswert", en: "Move (Attribute)",
  x: ["Gibt an, wie viele Systeme ein Schiff im Schritt „Bewegung“ betreten darf. Steht auf Fraktionsbogen oder Aufwertung.",
    "Effekte, die eine Einheit „in ein angrenzendes System“ bewegen, werden durch Änderungen am Bewegungswert nicht beeinflusst."],
  see: ["bewegung"] },

{ id: "blockiert", nr: 19, t: "Blockiert", en: "Blockaded", k: "Blockade",
  x: ["Eine Einheit mit „Produktion“ ist blockiert, wenn in ihrem System Schiffe eines anderen Spielers und keine eigenen Schiffe stehen.",
    ["Blockierte Einheiten produzieren keine Schiffe, Bodentruppen aber schon.",
     "Blockierst du eine Raumwerft eines Spielers, der Einheiten von dir gekapert hat, bekommst du diese Nicht-Jäger-Schiffe und Mechs sofort zurück.",
     "Solange eine Raumwerft eines Spielers blockiert ist, kann er keine Einheiten des Blockierers kapern."]],
  see: ["produktion", "kapern", "raumwerft"] },

{ id: "bodenkampf", nr: 20, t: "Bodenkampf", en: "Ground Combat",
  x: ["Findet im Einmarsch statt, wenn der aktive Spieler Bodentruppen auf einem Planeten mit Bodentruppen eines anderen Spielers hat.",
    ["„Zu Beginn eines Kampfes“-Effekte (in Runde 1 im selben Zeitfenster wie „zu Beginn einer Kampfrunde“).",
     "Kampfwürfe ausführen: 1 Würfel pro Bodentrupp, mehr bei Explosionssymbolen. Treffer bei Ergebnis ≥ Kampfwert.",
     "Treffer zuweisen: Jeder zerstört für jeden gegnerischen Treffer einen eigenen Bodentrupp auf dem Planeten. Mechs können Schadensresistenz nutzen.",
     "Haben beide noch Bodentruppen: neue Runde."],
    "Der Kampf endet, wenn eine oder keine Seite übrig ist. Bleibt niemand übrig, ist es ein Unentschieden und der Verteidiger behält den Planeten. Rückzug gibt es im Bodenkampf nicht. Kämpfe auf mehreren Planeten handelt man nacheinander ab, die Reihenfolge wählt der aktive Spieler."],
  see: ["einmarsch", "bodentruppen", "schadensresistenz", "kampf"], topic: "kampf" },

{ id: "bodentruppen", nr: 21, t: "Bodentruppen", en: "Ground Forces", k: "Infanterie Mech",
  x: ["Alle Infanterie- und Mech-Einheiten sind Bodentruppen.",
    ["Sie stehen auf Planeten oder werden von Schiffen mit Kapazität im Weltraumbereich transportiert.",
     "Sie bewegen sich nie selbst. Auch von einem Planeten zum anderen im selben System geht es nur per Schiff.",
     "Auf einem Planeten dürfen beliebig viele stehen.",
     "Effekte für „Bodentruppen“ gelten für Infanterie und Mechs, Effekte für „Infanterie“ nur für Infanterie."]],
  see: ["transportieren", "mechs", "infanteriemarker", "bodenkampf"] },

{ id: "bombardement", nr: 22, t: "Bombardement", en: "Bombardment",
  x: ["Einheitenfähigkeit, z. B. von Schlachtschiffen und Kriegssonnen. Erster Schritt des Einmarsches.",
    ["Format „Bombardement X (Y)“: Treffer ab X, Y Würfel (ohne Y ein Würfel).",
     "Der aktive Spieler wählt für jede bombardierende Einheit einen Planeten im aktiven System und sagt das vor dem Würfeln an.",
     "Der Besitzer des Planeten zerstört pro Treffer einen eigenen Bodentrupp dort. Überzählige Treffer verfallen.",
     "Planeten mit einer Einheit mit „Planetarer Schild“ dürfen nicht bombardiert werden. Kriegssonnen dürfen trotzdem.",
     "Effekte, die Kampfwürfe wiederholen oder verändern, wirken nicht auf Bombardement-Würfe."]],
  see: ["einmarsch", "planetarer-schild"] },

{ id: "diplomatie", nr: 23, t: "Diplomatie (Strategiekarte 2)", en: "Diplomacy", k: "Strategiekarte",
  x: ["Initiative 2. Schützt ein System und macht Planeten wieder spielbereit.",
    ["**Primär** (laut Errata): Wähle ein System mit einem eigenen Planeten, nicht Mecatol Rex. Jeder andere Spieler legt einen Kommandomarker aus seinem Nachschub hinein und kann es diese Runde nicht aktivieren. Dann machst du bis zu 2 eigene erschöpfte Planeten spielbereit.",
     "**Sekundär**: 1 Marker aus dem Strategiepool ausgeben und bis zu 2 eigene erschöpfte Planeten spielbereit machen."]],
  see: ["strategiekarte", "strategieaktion"], topic: "sc" },

{ id: "einfluss", nr: 24, t: "Einfluss", en: "Influence",
  x: ["Der rechte, blau umrandete Wert auf Planetenkarte und Systemtafel.",
    ["Ausgeben durch Erschöpfen der Planetenkarte. Ein Planet liefert entweder Ressourcen oder Einfluss.",
     "Wofür: Kommandomarker über Führungsstärke (je 3 Einfluss 1 Marker), Hütermarker (6 Einfluss), Stimmen in der Agendaphase, Kartenkosten.",
     "1 Handelsware kann wie 1 Einfluss ausgegeben werden, aber nicht für Stimmen."]],
  see: ["ressourcen", "agendaphase", "erschoepft"] },

{ id: "einheiten", nr: 25, t: "Einheiten", en: "Units", k: "Figuren Plastik",
  x: ["Jede Einheit ist eine Plastikfigur. Es gibt drei Typen: Schiffe, Bodentruppen und Gebäude.",
    "Pro Spielerfarbe: 3 Raumwerften, 10 Jäger, 6 PVS, 4 Träger, 8 Zerstörer, 5 Schlachtschiffe, 8 Kreuzer, 1 Flaggschiff, 2 Kriegssonnen, 4 Mechs, 12 Infanterie.",
    "Einheiten sind auf dem Spielplan oder im Nachschub."],
  see: ["schiffe", "bodentruppen", "gebaeude", "materialbeschraenkung"], topic: "limits" },

{ id: "einheiten-produzieren", nr: 26, t: "Einheiten produzieren", en: "Producing Units", k: "bauen kaufen",
  x: ["Meist über die Fähigkeit „Produktion“ im gleichnamigen Schritt einer Taktikaktion.",
    ["Man gibt mindestens so viele Ressourcen aus, wie die Einheiten kosten. Mehrere Einheiten darf man zusammenrechnen. Überbezahltes verfällt.",
     "Zwei Symbole bei den Kosten (Jäger, Infanterie): 2 Einheiten für den Preis. Jede zählt einzeln gegen das Produktionslimit. Man darf auch nur 1 nehmen und zahlt voll.",
     "In Systemen mit Schiffen anderer Spieler keine Schiffe produzieren. Bodentruppen gehen.",
     "Nicht auf Planeten produzieren, die man nicht kontrolliert.",
     "Fehlen Einheiten im Nachschub, darf man gleichartige Einheiten aus Systemen ohne eigenen Kommandomarker zurücknehmen und sofort neu produzieren.",
     "Auch Produktion über andere Fähigkeiten muss bezahlt werden."]],
  see: ["produktion", "kosten", "blockiert", "raumwerft"], topic: "takt" },

{ id: "einmarsch", nr: 27, t: "Einmarsch", en: "Invasion", k: "landen erobern Invasion",
  x: ["Schritt 4 der Taktikaktion. Hier werden Planeten erobert.",
    ["**1 · Bombardement** mit beliebigen eigenen Einheiten im aktiven System.",
     "**2 · Bodentruppen entsenden**: beliebig viele aus dem Weltraumbereich auf beliebige Planeten im System, auch auf Planeten mit fremden Bodentruppen. Wer niemanden entsendet, geht zur Produktion.",
     "**3 · Defensivfeuer der Weltraumkanone**: Einheiten mit Weltraumkanone auf dem Zielplanet schießen auf die gelandeten Truppen. Bei mehreren Planeten bestimmt der aktive Spieler die Reihenfolge.",
     "**4 · Bodenkampf** auf jedem umkämpften Planeten.",
     "**5 · Kontrolle übernehmen**: Jeder Planet, auf dem noch eigene Bodentruppen stehen, gehört dir. Planetenkarte erschöpft nehmen. Gebäude anderer Spieler dort werden zerstört. Wurden alle Einheiten beider Seiten zerstört, behält der Verteidiger den Planeten und legt einen Kontrollmarker."],
    "Mecatol Rex mit Hütermarker: vor dem Entsenden 6 Einfluss zahlen, dann mindestens 1 Bodentrupp hinschicken."],
  see: ["bombardement", "bodenkampf", "kontrolle", "weltraumkanone", "huetermarker", "erkundung"], topic: "kampf" },

{ id: "einsatz", nr: 28, t: "Einsatz", en: "Deploy", pok: true,
  x: ["Einheitenfähigkeit mit dem Stichwort „Einsatz“, meist bei Mechs. Damit kommt eine Einheit aufs Brett, ohne produziert zu werden.",
    ["Nur aus dem eigenen Nachschub. Ist dort keine passende Einheit, geht es nicht.",
     "Kostet nichts, außer die Fähigkeit sagt es.",
     "Pro Zeitfenster nur einmal pro Einsatzfähigkeit."]],
  see: ["mechs", "nachschub"] },

{ id: "erkundung", nr: 29, t: "Erkundung", en: "Exploration", pok: true, k: "erkunden Erkundungskarte Reliktfragment kulturell gefährlich industriell",
  x: ["Übernimmt ein Spieler die Kontrolle über einen Planeten, der vorher nicht unter der Kontrolle eines anderen Spielers war, erkundet er ihn.",
    ["Er zieht eine Karte vom Erkundungsstapel des Planetenmerkmals (kulturell, gefährlich, industriell) und handelt sie ab.",
     "Planeten ohne Merkmal (Mecatol Rex, Heimatplaneten) werden nicht erkundet. Bei mehreren Merkmalen wählt der Spieler den Stapel.",
     "Mehrere Erkundungen gleichzeitig: Reihenfolge selbst wählen, jede Karte vollständig abhandeln.",
     "„Verstärkung“-Karten werden an den Planeten angelegt, Reliktfragmente offen in den Spielbereich gelegt, alle anderen abgelegt.",
     "Leere Stapel: Ablagestapel mischen.",
     "Manche Fähigkeiten erlauben mehrfaches Erkunden."],
    "Wilder-Raum-Marker werden nur mit der Technologie Nullpunktenergie-Reaktor (Dark Energy Tap) oder durch einen Effekt erkundet. Dann zieht man vom Wilder-Raum-Stapel und legt den Marker zurück in den Vorrat."],
  see: ["wilder-raum", "anlegen", "relikte", "kontrolle"], topic: "pok" },

{ id: "erschoepft", nr: 30, t: "Erschöpft", en: "Exhausted",
  x: ["Erschöpfte Karten liegen verdeckt. Ihre Fähigkeiten, Ressourcen und ihr Einfluss sind nicht nutzbar, passive Fähigkeiten wirken aber weiter.",
    ["Planetenkarten erschöpft man, um Ressourcen oder Einfluss auszugeben.",
     "Neu übernommene Planeten kommen erschöpft.",
     "Strategiekarten werden nach der Strategieaktion erschöpft.",
     "Bereits erschöpfte Karten kann man nicht nochmal erschöpfen.",
     "Im Schritt „Spielbereit machen“ der Statusphase wird alles wieder umgedreht."]],
  see: ["spielbereit", "statusphase", "planeten"] },

{ id: "faehigkeiten", nr: 31, t: "Fähigkeiten und Timing", en: "Abilities, Timing", k: "Zeitpunkt sobald bevor nachdem dann dürfen nicht dürfen Reihenfolge gleichzeitig",
  x: ["Grundregeln für alle Kartentexte.",
    ["Die Rules Reference hat Vorrang vor dem Lernheft, Karten haben Vorrang vor beiden. Wenn möglich, gilt beides.",
     "„Nicht dürfen“ ist absolut. Stehen zwei Verbote gegeneinander, gilt Dauerhaftes vor Einmaligem und Erlaubendes vor Negierendem.",
     "Eine Fähigkeit wird vollständig abgehandelt. Teile mit „dürfen“ sind freiwillig. Bei „und“ so viel wie möglich.",
     "Kosten stehen vor „um zu“ oder vor einem Semikolon. Wer sie nicht zahlen kann, darf die Fähigkeit nicht nutzen.",
     "„Aktion“ heißt: kostet eine Materialaktion."],
    "**Zeitpunkte**",
    ["„Sobald“ (when): gleichzeitig mit dem Ereignis. Hat Vorrang vor „nachdem“ und verändert das Ereignis oft.",
     "„Bevor“ / „nachdem“ (before / after): unmittelbar davor bzw. danach, nicht später.",
     "„Dann“: Der Teil danach geht nur, wenn der Teil davor geklappt hat.",
     "Jede Fähigkeit einmal pro Eintreten ihres Zeitpunkts.",
     "Effekte „bis zum Ende des Zuges“ enden vor dem Zug des nächsten Spielers."],
    "**Mehrere Spieler wollen gleichzeitig**",
    ["Aktionsphase: Der aktive Spieler beginnt, dann die anderen in Initiativreihenfolge, jeweils eine Fähigkeit. Reihum, bis keiner mehr will.",
     "Strategie- und Agendaphase: Der Sprecher beginnt, dann im Uhrzeigersinn."]],
  see: ["aktionskarten", "materialaktion"], topic: "timing" },

{ id: "flottenpool", nr: 32, t: "Flottenpool", en: "Fleet Pool", k: "Flottenlimit Schiffe pro System",
  x: ["Die Marker im Flottenpool bestimmen, wie viele Nicht-Jäger-Schiffe ein Spieler höchstens in einem System haben darf.",
    ["Transportierte Einheiten und Einheiten auf Planeten zählen nicht. Durchfliegende Einheiten zählen in Durchflugsystemen nicht.",
     "Hat ein Spieler irgendwann mehr Schiffe in einem System, entfernt er überzählige seiner Wahl in den Nachschub. Das gilt nicht als zerstört.",
     "Marker im Flottenpool liegen mit der Schiffsseite oben und werden nie ausgegeben, außer ein Effekt erlaubt es."]],
  see: ["kommandobogen", "kommandomarker", "schiffe"] },

{ id: "fuehrungsstaerke", nr: 33, t: "Führungsstärke (Strategiekarte 1)", en: "Leadership", k: "Strategiekarte",
  x: ["Initiative 1. Bringt Kommandomarker.",
    ["**Primär**: 3 Kommandomarker erhalten. Dann beliebig viel Einfluss ausgeben, je 3 Einfluss 1 weiterer Marker.",
     "**Sekundär**: Einfluss ausgeben, je 3 Einfluss 1 Marker. **Kostet keinen Marker aus dem Strategiepool.**",
     "Jeden neuen Marker legt man in einen Pool seiner Wahl."]],
  see: ["kommandomarker", "einfluss", "strategiekarte"], topic: "sc" },

{ id: "gebaeude", nr: 34, t: "Gebäude", en: "Structures", k: "PVS Raumwerft",
  x: ["PVS und Raumwerften. Sie stehen immer auf Planeten (Ausnahme: Schwebefabrik des Clans der Zaar im Weltraum).",
    ["Kommen meist über Infrastruktur ins Spiel, haben keine Kosten und werden nicht produziert.",
     "Dürfen weder bewegt noch transportiert werden.",
     "Pro Spieler und Planet höchstens 1 Raumwerft und 2 PVS.",
     "Übernimmt ein anderer Spieler den Planeten, werden sie zerstört."]],
  see: ["pvs", "raumwerft", "infrastruktur"] },

{ id: "gegner", nr: 35, t: "Gegner", en: "Opponent",
  x: ["Im Kampf der andere Spieler, der zu Beginn des Kampfes Schiffe im System bzw. Bodentruppen auf dem Planeten hat. Unbeteiligte Spieler sind keine Gegner und können Fähigkeiten gegen Gegner weder nutzen noch abbekommen."],
  see: ["raumkampf", "bodenkampf"] },

{ id: "geschaefte", nr: 36, t: "Geschäfte (Absprachen)", en: "Deals", k: "Absprache Versprechen bindend verhandeln",
  x: ["Abmachungen zwischen zwei Spielern. Sie sind jederzeit erlaubt, auch zwischen Nicht-Nachbarn. Enthält ein Geschäft eine Transaktion, gelten deren Regeln.",
    ["**Bindend** ist ein Geschäft, das sofort vollständig erfüllt werden kann. Dann muss sich jeder daran halten.",
     "**Nicht bindend** ist alles, was später passieren soll. Daran muss sich niemand halten.",
     "Aktionskarten-Effekte sind nie garantiert und können nicht Teil eines bindenden Geschäfts sein."]],
  see: ["transaktionen", "vertragskarten"], topic: "handel" },

{ id: "gravitationsstrudel", nr: 37, t: "Gravitationsstrudel", en: "Gravity Rift",
  x: ["Anomalie, die Schiffe beschleunigt, aber gefährlich ist.",
    ["Ein Schiff, das einen Gravitationsstrudel verlässt oder durchfliegt, bekommt +1 Bewegung. Das kann bei einer Bewegung mehrfach passieren.",
     "Unmittelbar bevor es das Strudel-System verlässt, wird für das Schiff gewürfelt: Bei 1 bis 3 wird es vom Spielplan entfernt (nicht zerstört), samt allem, was es transportiert.",
     "Für transportierte Einheiten wird nicht gewürfelt.",
     "Ein System mit mehreren Strudeln zählt als einer."]],
  see: ["anomalien", "bewegung"] },

{ id: "handel", nr: 38, t: "Handel (Strategiekarte 5)", en: "Trade", k: "Strategiekarte Massenprodukte auffüllen",
  x: ["Initiative 5. Bringt Handelswaren und füllt Massenprodukte auf.",
    ["**Primär**: 3 Handelswaren erhalten. Massenprodukte auffüllen. Dann beliebig viele andere Spieler auswählen, die die Sekundärfähigkeit ohne Marker nutzen.",
     "**Sekundär**: 1 Marker aus dem Strategiepool ausgeben und Massenprodukte auffüllen.",
     "Ausgewählte Spieler nutzen die Sekundärfähigkeit ganz normal in der Sekundärrunde, nur kostenlos und nur einmal."]],
  see: ["massenprodukte", "handelswaren", "strategiekarte"], topic: "sc" },

{ id: "handelswaren", nr: 39, t: "Handelswaren", en: "Trade Goods", k: "Geld Währung",
  x: ["Wirtschaftskraft unabhängig von Planeten. Handelswaren und Massenprodukte sind zwei Seiten desselben Markers.",
    ["Jederzeit ausgebbar: als 1 Ressource, als 1 Einfluss (nicht für Stimmen) oder für Effekte, die ausdrücklich Handelswaren verlangen.",
     "Lassen sich in Transaktionen tauschen.",
     "Bekommt man Massenprodukte von einem anderen Spieler, werden sie sofort zu Handelswaren.",
     "Marker gibt es zu 1 und 3, beliebig tauschbar."]],
  see: ["massenprodukte", "transaktionen", "ressourcen", "einfluss"] },

{ id: "huetermarker", nr: 40, t: "Hütermarker", en: "Custodians Token", k: "Custodians Mecatol Rex 6 Einfluss",
  x: ["Liegt zu Beginn auf Mecatol Rex. Bewegen ins System ist normal erlaubt, landen nicht.",
    ["Vor dem Schritt „Bodentruppen entsenden“ kann der aktive Spieler 6 Einfluss ausgeben und den Marker entfernen. Dann muss er mindestens 1 Bodentrupp auf Mecatol Rex entsenden. Kann er das nicht, darf er den Marker nicht nehmen.",
     "Wer den Marker nimmt, legt ihn in seinen Spielbereich und erhält 1 Siegpunkt.",
     "Ab dieser Runde gehört die Agendaphase zu jeder Spielrunde."]],
  see: ["mecatol-rex", "agendaphase", "einmarsch"] },

{ id: "hyperrouten", nr: 41, t: "Hyperrouten", en: "Hyperlanes", pok: true,
  x: ["Spezielle Tafeln für manche Spielplan-Varianten (z. B. 5 oder 7 Spieler), die nicht berührende Systeme verbinden.",
    ["Systeme, die über eine Linie auf Hyperrouten verbunden sind, grenzen in jeder Hinsicht aneinander: Bewegung, Nachbarn, Weltraumkanone.",
     "Hyperrouten sind keine Systeme. Dort stehen keine Einheiten und keine Wilder-Raum-Marker, und sie sind kein Ziel für Effekte.",
     "Laufen Linien am Rand einer Tafel in einem Punkt zusammen, sind sie nicht miteinander verbunden."]],
  see: ["angrenzend", "spielplan"] },

{ id: "imperium", nr: 42, t: "Imperium (Strategiekarte 8)", en: "Imperial", k: "Strategiekarte Siegpunkt geheimer Auftrag",
  x: ["Initiative 8. Die einzige Strategiekarte, die direkt Siegpunkte bringt.",
    ["**Primär**: Sofort 1 öffentlichen Auftrag werten, dessen Bedingung du erfüllst. Dann 1 Siegpunkt, wenn du Mecatol Rex kontrollierst, sonst 1 geheimen Auftrag ziehen.",
     "**Sekundär**: 1 Marker aus dem Strategiepool ausgeben und 1 geheimen Auftrag ziehen.",
     "Höchstgrenze 3 geheime Aufträge beachten."]],
  see: ["auftragskarten", "mecatol-rex", "strategiekarte"], topic: "sc" },

{ id: "infanteriemarker", nr: 43, t: "Infanteriemarker", en: "Infantry Tokens",
  x: ["Ersatz für Infanteriefiguren, gelten in jeder Hinsicht wie Plastik-Infanterie.",
    ["Beim Produzieren darf man statt einer Figur einen Marker aus dem Vorrat nehmen. Figuren und Marker sind jederzeit tauschbar.",
     "Ein Marker braucht auf seinem Planeten bzw. im Weltraumbereich eine Infanteriefigur dabei. Sonst wird er durch eine Figur ersetzt, und geht das nicht, ist die Einheit zerstört.",
     "Marker gibt es zu 1 und 3."]],
  see: ["bodentruppen", "materialbeschraenkung"] },

{ id: "infrastruktur", nr: 44, t: "Infrastruktur (Strategiekarte 4)", en: "Construction", k: "Strategiekarte PVS Raumwerft bauen",
  x: ["Initiative 4. Der normale Weg, Gebäude aufs Brett zu bringen.",
    ["**Primär**: 1 PVS oder 1 Raumwerft auf einem eigenen Planeten platzieren. Dann 1 weiteres PVS auf einem eigenen Planeten. Gleiche oder verschiedene Planeten, egal ob dort ein eigener Kommandomarker liegt.",
     "**Sekundär**: 1 Marker aus dem Strategiepool in ein beliebiges System legen (liegt dort schon einer, kommt der Marker in den Nachschub) und dort 1 PVS oder 1 Raumwerft auf einem eigenen Planeten platzieren.",
     "Achtung: Der Marker aus der Sekundärfähigkeit markiert das System für diese Runde. Eigene Schiffe dort können nicht mehr losfliegen, und das System kann man nicht mehr aktivieren.",
     "Gebäude kommen aus dem eigenen Nachschub. Fehlen welche, darf man sie aus Systemen ohne eigenen Kommandomarker zurücknehmen."]],
  see: ["gebaeude", "pvs", "raumwerft", "strategiekarte"], topic: "sc" },

{ id: "initiativreihenfolge", nr: 45, t: "Initiativreihenfolge", en: "Initiative Order", k: "Reihenfolge wer ist dran",
  x: ["Reihenfolge für Aktions- und Statusphase, bestimmt durch die Zahlen der gewählten Strategiekarten. Niedrigste Zahl zuerst.",
    ["Bei 3 oder 4 Spielern zählt die niedrigere der beiden Karten.",
     "Nicht gewählte Karten werden ignoriert.",
     "Wer den „0“-Marker der Naalu hat, hat Initiative 0."]],
  see: ["strategiekarte", "aktionsphase", "statusphase"] },

{ id: "jaegerabwehr", nr: 46, t: "Jägerabwehr", en: "Anti-Fighter Barrage", k: "AFB Zerstörer",
  x: ["Einheitenfähigkeit, z. B. von Zerstörern. Wird nur im Schritt „Jägerabwehr“ der ersten Raumkampfrunde genutzt.",
    ["Format „Jägerabwehr X (Y)“: Treffer ab X, Y Würfel.",
     "Beide Spieler würfeln gleichzeitig. Pro Treffer zerstört der Gegner einen seiner Jäger im aktiven System. Überzählige Treffer verfallen.",
     "Effekte für Kampfwürfe (Wiederholen, Modifikatoren) wirken nicht auf Jägerabwehr.",
     "Darf auch ohne Jäger genutzt werden, weil manche Fähigkeiten an Treffern hängen.",
     "Schadensresistenz von Nicht-Jägern hilft nicht gegen Jägerabwehr, weil diese Einheiten keine gültigen Ziele sind."]],
  see: ["raumkampf", "jaegermarker"] },

{ id: "jaegermarker", nr: 47, t: "Jägermarker", en: "Fighter Tokens", k: "Jäger",
  x: ["Ersatz für Jägerfiguren, gelten in jeder Hinsicht wie Plastik-Jäger.",
    ["Beim Produzieren darf man statt einer Figur einen Marker nehmen. Jederzeit tauschbar.",
     "Ein Marker braucht im selben System eine Jägerfigur. Sonst wird er durch eine Figur ersetzt, und geht das nicht, ist die Einheit zerstört.",
     "Marker gibt es zu 1 und 3."]],
  see: ["schiffe", "materialbeschraenkung"] },

{ id: "kampf", nr: 48, t: "Kampf (Attribut)", en: "Combat (Attribute)", k: "Kampfwert Explosionssymbol Burst würfeln W10",
  x: ["Der Kampfwert ist das Würfelergebnis, das eine Einheit mindestens braucht, um zu treffen. Die „0“ auf dem W10 zählt als 10.",
    ["Stehen 2 oder mehr Explosionssymbole neben dem Wert, wirft man pro Symbol einen Würfel.",
     "Wer Einheiten mit verschiedenen Kampfwerten hat, würfelt getrennt, von niedrigem zu hohem Wert."]],
  see: ["raumkampf", "bodenkampf", "modifikatoren", "wiederholungswuerfe"] },

{ id: "kapazitaet", nr: 49, t: "Kapazität", en: "Capacity",
  x: ["Gibt an, wie viele Jäger und Bodentruppen (beliebig gemischt) ein Schiff transportieren kann.",
    ["Die Summe der Kapazität aller eigenen Schiffe im System begrenzt Jäger und Bodentruppen im Weltraumbereich.",
     "Bodentruppen auf Planeten zählen nicht.",
     "Überschuss entfernt man sofort, nach eigener Wahl.",
     "Im Kampf zählt die Kapazität nicht. Erst am Ende des Kampfes wird Überschuss entfernt.",
     "Jäger und Bodentruppen gehören nicht zu einem bestimmten Schiff, außer während sie transportiert werden.",
     "Raumwerften erlauben meist bis zu 3 Jäger im System ohne Kapazität (siehe Raumwerftkarte)."]],
  see: ["transportieren", "flottenpool", "raumwerft"] },

{ id: "kapern", nr: 50, t: "Kapern", en: "Capture", pok: true, k: "gefangen Vuil'raith",
  x: ["Manche Fähigkeiten kapern Einheiten. Gekaperte Einheiten sind für ihren Besitzer nicht nutzbar.",
    ["Nicht-Jäger-Schiffe und Mechs kommen auf den Fraktionsbogen des Kapernden.",
     "Gekaperte Jäger und Infanterie gehen stattdessen in den Nachschub ihres Besitzers. Der Kapernde legt passende Marker aus dem Vorrat auf seinen Fraktionsbogen. Sie kommen nur durch eine Fähigkeit des Kapernden zurück, nicht per Transaktion.",
     "Schiffe und Mechs gehen zurück, wenn der Kapernde sie per Transaktion zurückgibt, eine Fähigkeit es verlangt oder der Besitzer eine Raumwerft des Kapernden blockiert.",
     "Solange gekapert, kann der Besitzer sie weder produzieren noch platzieren.",
     "Wird eine Raumwerft eines Spielers blockiert, kann er keine Einheiten des Blockierers kapern."]],
  see: ["blockiert", "transaktionen", "ausgeschieden"] }
]);

/* Regelreferenz A–Z, Teil 2 (Nr. 51–101). Format siehe regeln-1.js. */
window.TI4 = window.TI4 || {};
TI4.rules = (TI4.rules || []).concat([
{ id: "kommandobogen", nr: 51, t: "Kommandobogen", en: "Command Sheet", k: "Taktikpool Strategiepool Flottenpool",
  x: ["Jeder Spieler hat einen Kommandobogen mit drei Pools, einem Handelswarenfeld und einer Kurzübersicht.",
    ["**Taktikpool**: Marker für Taktikaktionen.",
     "**Strategiepool**: Marker für Sekundärfähigkeiten und manche Effekte.",
     "**Flottenpool**: bestimmt das Flottenlimit, wird nicht ausgegeben.",
     "Handelswaren liegen auf dem Handelswarenfeld."]],
  see: ["kommandomarker", "flottenpool", "handelswaren"] },

{ id: "kommandomarker", nr: 52, t: "Kommandomarker", en: "Command Tokens", k: "Marker Pool",
  x: ["Die Währung für Aktionen und Flottengröße. Jeder Spieler hat 16.",
    ["Start: 3 im Taktikpool, 3 im Flottenpool, 2 im Strategiepool. Im Flottenpool mit der Schiffsseite oben, sonst mit dem Fraktionssymbol.",
     "Jeden neuen Marker legt man in einen Pool seiner Wahl.",
     "Taktikaktion: 1 Marker aus dem Taktikpool ins aktivierte System. Sekundärfähigkeit: 1 Marker aus dem Strategiepool (Führungsstärke kostet keinen).",
     "Neue Marker kommen aus dem Nachschub. Ist er leer, bekommt man keine.",
     "Muss ein Effekt einen Marker aufs Brett legen und der Nachschub ist leer, nimmt man einen vom Kommandobogen, außer im System liegt schon einer.",
     "Soll ein Marker in ein System, in dem schon einer von dir liegt, kommt er stattdessen in den Nachschub. Ausgelöste Effekte gelten trotzdem."]],
  see: ["kommandobogen", "taktikaktion", "statusphase", "fuehrungsstaerke"] },

{ id: "kontrolle", nr: 53, t: "Kontrolle", en: "Control", k: "Planet gehört Kontrollmarker",
  x: ["Zu Spielbeginn kontrolliert jeder die Planeten seines Heimat-Systems.",
    ["Wer die Kontrolle über einen Planeten erlangt, nimmt die Planetenkarte (aus dem Stapel oder vom Vorbesitzer) und legt sie erschöpft in seinen Spielbereich.",
     "War der Planet vorher nicht unter der Kontrolle eines anderen Spielers, wird er erkundet.",
     "Einen Planeten, den man schon kontrolliert, kann man nicht erneut übernehmen.",
     "Man kann Planeten ohne eigene Einheiten kontrollieren. Dann liegt dort ein Kontrollmarker.",
     "Man verliert die Kontrolle, wenn man keine Einheiten mehr dort hat und ein anderer Spieler Einheiten dort hat. Im Einmarsch entscheidet stattdessen der Schritt „Kontrolle übernehmen“.",
     "Auch Effekte können Kontrolle kosten. Dann wird ein eigener Kontrollmarker entfernt."]],
  see: ["einmarsch", "planeten", "erkundung", "anlegen"] },

{ id: "kosten", nr: 54, t: "Kosten (Attribut)", en: "Cost (Attribute)",
  x: ["Ressourcen, die man für die Produktion einer Einheit mindestens ausgeben muss.",
    ["Zwei Symbole bei den Kosten: 2 Einheiten für diesen Preis.",
     "Einheiten ohne Kosten (Gebäude) dürfen nicht produziert werden."]],
  see: ["einheiten-produzieren", "ressourcen"] },

{ id: "kriegsfuehrung", nr: 55, t: "Kriegsführung (Strategiekarte 6)", en: "Warfare", k: "Strategiekarte Marker zurücknehmen",
  x: ["Initiative 6. Erlaubt, ein System doppelt zu nutzen.",
    ["**Primär**: 1 beliebigen eigenen Kommandomarker vom Spielplan entfernen und in einen Pool legen. Dann alle Marker auf dem Kommandobogen umverteilen.",
     "**Sekundär**: 1 Marker aus dem Strategiepool ausgeben und die Produktion einer Raumwerft im eigenen Heimat-System nutzen. Der Marker kommt nicht ins Heimat-System, es wird also nicht aktiviert.",
     "Die Sekundärfähigkeit funktioniert nur mit Raumwerften, nicht mit anderen Einheiten mit Produktion."]],
  see: ["kommandomarker", "produktion", "strategiekarte"], topic: "sc" },

{ id: "legendaere-planeten", nr: 56, t: "Legendäre Planeten", en: "Legendary Planets", pok: true, k: "Primor Hope's End Mallice Fähigkeitskarte",
  x: ["Planeten mit dem Legendär-Symbol. Zu jedem gehört eine Fähigkeitskarte.",
    ["Wer die Kontrolle über den Planeten erlangt, nimmt auch die Fähigkeitskarte. Aus dem Stapel kommt sie spielbereit, vom Vorbesitzer im aktuellen Zustand.",
     "Die Fähigkeitskarte wird unabhängig von der Planetenkarte erschöpft und spielbereit gemacht. Effekte, die Planeten spielbereit machen, betreffen sie nicht.",
     "Wird die Planetenkarte vernichtet, auch die Fähigkeitskarte.",
     "Mecatol Rex ist kein legendärer Planet. Mallice liegt im Wurmloch-Nexus."]],
  see: ["planeten", "wurmloch-nexus"], topic: "pok" },

{ id: "massenprodukte", nr: 57, t: "Massenprodukte", en: "Commodities", k: "Rohstoffe auffüllen",
  x: ["Waren, die die eigene Fraktion im Überfluss hat. Selbst bringen sie nichts, erst beim Weitergeben werden sie wertvoll.",
    ["Der Massenproduktwert auf dem Fraktionsbogen ist das Maximum.",
     "Auffüllen (z. B. über Handel): Marker aus dem Vorrat nehmen, bis man den Massenproduktwert erreicht.",
     "Man kann sie nicht selbst ausgeben, nur per Transaktion weitergeben.",
     "Bekommt man sie von einem anderen Spieler, werden sie sofort zu Handelswaren.",
     "Wandelt man eigene Massenprodukte per Effekt in Handelswaren um, gilt das nicht als „Handelswaren erhalten“.",
     "Vor dem Auffüllen darf man noch mit vorhandenen Massenprodukten handeln."]],
  see: ["handelswaren", "transaktionen", "handel"], topic: "handel" },

{ id: "materialaktion", nr: 58, t: "Materialaktion", en: "Component Action", k: "Aktion Komponentenaktion",
  x: ["Eine Aktion, die von Spielmaterial kommt: Aktionskarten, Technologien, Anführer, Erkundungskarten, Relikte, Vertragskarten, Fraktionsbögen. Erkennbar am Stichwort „Aktion“.",
    ["Sie ersetzt die Aktion des Zuges.",
     "Nur erlaubt, wenn sie vollständig abgehandelt werden kann.",
     "Wird sie negiert, ist die Aktion des Spielers nicht verbraucht."]],
  see: ["aktionsphase", "aktionskarten"] },

{ id: "materialbeschraenkung", nr: 59, t: "Materialbeschränkung", en: "Component Limitations", k: "Figuren aus",
  x: ["Was gilt, wenn Material ausgeht.",
    ["Würfel: unbegrenzt, notfalls mehrmals würfeln.",
     "Kontroll-, Handelswaren-, Jäger- und Infanteriemarker: unbegrenzt, notfalls Ersatz wie Münzen nehmen.",
     "Einheiten: begrenzt auf das Material der Schachtel. Jäger und Infanterie haben Ersatzmarker, die eine Figur derselben Art dabei brauchen.",
     "Fehlen Einheiten beim Platzieren, darf man gleichartige aus Systemen ohne eigenen Kommandomarker zurücknehmen und sofort platzieren. Fähigkeiten können das nicht erzwingen.",
     "Leere Kartenstapel: Ablagestapel mischen."]],
  see: ["einheiten", "nachschub"] },

{ id: "mecatol-rex", nr: 60, t: "Mecatol Rex", en: "Mecatol Rex",
  x: ["Der Planet in der Mitte der Galaxie (Ressourcen 1, Einfluss 6).",
    ["Zu Beginn liegt der Hütermarker darauf. Landen erst nach Zahlung von 6 Einfluss.",
     "Kein Merkmal, wird nicht erkundet, kein legendärer Planet.",
     "Diplomatie kann das Mecatol-Rex-System nicht wählen.",
     "Imperium gibt 1 Siegpunkt, wenn man Mecatol Rex kontrolliert."]],
  see: ["huetermarker", "imperium"] },

{ id: "mechs", nr: 61, t: "Mechs", en: "Mechs", pok: true,
  x: ["Spezialisierte, fraktionseigene Bodentruppen.",
    ["Sie sind Bodentruppen, werden transportiert und kämpfen im Bodenkampf. Effekte für „Infanterie“ gelten nicht für sie.",
     "Die Mech-Einheitenkarte liegt ab Spielbeginn auf dem Anführerbogen. Mechs werden zu den Kosten auf der Karte produziert.",
     "Manche Mechs haben eine Einsatzfähigkeit und kommen ohne Produktion aufs Brett.",
     "4 Mechs pro Spielerfarbe. Mech-Einheitenkarten sind keine Technologien."]],
  see: ["bodentruppen", "einsatz", "anfuehrerbogen"], topic: "pok" },

{ id: "modifikatoren", nr: 62, t: "Modifikatoren", en: "Modifiers", k: "+1 -1",
  x: ["Ein Plus- oder Minuswert, der auf einen Attributwert oder ein Würfelergebnis angewendet wird, z. B. „wende +1 auf das Ergebnis an“. Plus wird addiert, Minus abgezogen."],
  see: ["kampf", "wiederholungswuerfe"] },

{ id: "nachbarn", nr: 63, t: "Nachbarn", en: "Neighbors",
  x: ["Zwei Spieler sind Nachbarn, wenn beide im selben System oder in angrenzenden Systemen mindestens eine Einheit haben oder einen Planeten kontrollieren.",
    ["Auch über Wurmlöcher (und Hyperrouten).",
     "Nachbarn dürfen in der Aktionsphase Transaktionen machen.",
     "Wer im Lauf eines Zuges Nachbar wird, darf ab dann handeln."]],
  see: ["transaktionen", "angrenzend", "wurmloecher"], topic: "handel" },

{ id: "nachschub", nr: 64, t: "Nachschub", en: "Reinforcements",
  x: ["Der persönliche Vorrat eines Spielers mit allen Einheiten und Kommandomarkern, die gerade nicht im Spiel sind. Er ist auf das vorhandene Material begrenzt.",
    "Zerstörte Einheiten kommen in den Nachschub zurück."],
  see: ["materialbeschraenkung", "kommandomarker", "zerstoert"] },

{ id: "nebel", nr: 65, t: "Nebel", en: "Nebula",
  x: ["Anomalie, die Bewegung und Kampf beeinflusst.",
    ["Ein Schiff darf nur in einen Nebel fliegen, wenn er das aktive System ist. Durchfliegen ist verboten.",
     "Ein Schiff, das zu Beginn der Bewegung in einem Nebel steht, hat für diesen Schritt Bewegungswert 1.",
     "Im Raumkampf im Nebel wendet der Verteidiger +1 auf alle Kampfwürfe seiner Schiffe an.",
     "Rückzug in einen Nebel ist nicht erlaubt (kein zulässiges Rückzugssystem)."]],
  see: ["anomalien", "raumkampf", "bewegung"] },

{ id: "planetarer-schild", nr: 66, t: "Planetarer Schild", en: "Planetary Shield", k: "PVS Bombardement verhindern",
  x: ["Einheitenfähigkeit, z. B. von PVS. Ein Planet mit einer solchen Einheit darf nicht bombardiert werden.",
    ["Schützt nicht gegen Weltraumkanone, Landung oder Effekte, die kein Bombardement sind.",
     "Steht eine Kriegssonne im System, gilt der Schild anderer Spieler dort als nicht vorhanden. Kriegssonnen dürfen also immer bombardieren."]],
  see: ["bombardement", "pvs"] },

{ id: "planeten", nr: 67, t: "Planeten", en: "Planets", k: "Merkmal Technologie-Spezialisierung Planetenkarte",
  x: ["Planeten liefern Ressourcen (linker, gelb umrandeter Wert) und Einfluss (rechter, blau umrandeter Wert).",
    ["Merkmal (kulturell, gefährlich, industriell): wichtig fürs Erkunden und manche Effekte.",
     "Technologie-Spezialisierung: Der Planet kann beim Erforschen erschöpft werden, um 1 Voraussetzung dieser Farbe zu ignorieren.",
     "Legendäre Planeten bringen eine Fähigkeitskarte.",
     "Zu jedem Planeten gibt es eine Planetenkarte. Spielbereit liegt sie offen, erschöpft verdeckt. Nur spielbereite Planeten liefern Ressourcen oder Einfluss."]],
  see: ["kontrolle", "ressourcen", "einfluss", "erkundung", "technologie"] },

{ id: "politik", nr: 68, t: "Politik (Strategiekarte 3)", en: "Politics", k: "Strategiekarte Sprecher Aktionskarten",
  x: ["Initiative 3. Bestimmt den Sprecher und bringt Aktionskarten.",
    ["**Primär**: Einen Spieler ohne Sprechermarker zum Sprecher machen, auch dich selbst, wenn du ihn nicht hast. 2 Aktionskarten ziehen. Die obersten 2 Agendakarten geheim ansehen und jede oben oder unten zurücklegen, Reihenfolge frei.",
     "**Sekundär**: 1 Marker aus dem Strategiepool ausgeben und 2 Aktionskarten ziehen."]],
  see: ["sprecher", "aktionskarten", "strategiekarte"], topic: "sc" },

{ id: "produktion", nr: 69, t: "Produktion (Einheitenfähigkeit)", en: "Production", k: "Produktionslimit",
  x: ["Im Schritt „Produktion“ einer Taktikaktion darf der aktive Spieler die Produktion aller seiner Einheiten im aktiven System nutzen.",
    ["Der Wert hinter „Produktion“ ist die Höchstzahl an Einheiten. Mehrere Einheiten im System werden addiert.",
     "Jeder einzelne Jäger und jede einzelne Infanterie zählt gegen das Limit.",
     "Schiffe werden im aktiven System platziert.",
     "Bodentruppen kommen auf Planeten, auf denen eine Einheit mit Produktion steht, die genutzt wurde. Produktion im Weltraumbereich darf sie auch in den Weltraum oder auf eigene Planeten im System setzen (Kapazität beachten).",
     "Raumwerften des Arborec produzieren keine Infanterie."]],
  see: ["einheiten-produzieren", "raumwerft", "blockiert"], topic: "takt" },

{ id: "pvs", nr: 70, t: "PVS (Planetares Verteidigungssystem)", en: "PDS", k: "PDS Weltraumkanone",
  x: ["Gebäude zur Verteidigung mit den Fähigkeiten Weltraumkanone und Planetarer Schild.",
    ["Kommt meist über Infrastruktur ins Spiel.",
     "Höchstens 2 PVS pro Planet.",
     "Steht auf einem Planeten mit Einheiten eines anderen Spielers kein eigener Bodentrupp mehr neben dem PVS, wird es zerstört.",
     "PVS II (Tiefraumkanone) darf auch auf Schiffe in angrenzenden Systemen schießen, auch durch Wurmlöcher."]],
  see: ["weltraumkanone", "planetarer-schild", "gebaeude", "infrastruktur"] },

{ id: "raumkampf", nr: 71, t: "Raumkampf", en: "Space Combat", k: "Kampf Schiffe Treffer",
  x: ["Haben nach dem Offensivfeuer der Weltraumkanone zwei Spieler Schiffe im aktiven System, kämpfen sie. Sonst geht es direkt zum Einmarsch.",
    ["„Vor dem Kampf“-Effekte direkt vor der Jägerabwehr.",
     "**1 · Jägerabwehr** (nur Runde 1, gleichzeitig). Hat danach eine Seite keine Schiffe mehr, endet der Kampf.",
     "**2 · Rückzug ankündigen**, zuerst der Verteidiger. Kündigt er an, darf der Angreifer diese Runde nicht. Nur möglich, wenn es ein zulässiges Rückzugssystem gibt.",
     "**3 · Kampfwürfe ausführen**: 1 Würfel pro Schiff, mehr bei Explosionssymbolen. Getrennt nach Kampfwert von niedrig nach hoch. Der Angreifer würfelt komplett zuerst. Wiederholungswürfe sofort nach dem jeweiligen Wurf.",
     "**4 · Treffer zuweisen**: Vorher darf Schadensresistenz Treffer negieren. Dann zerstört jeder pro gegnerischem Treffer ein eigenes Schiff.",
     "**5 · Zurückziehen**: Wer angekündigt hat und noch ein zulässiges System hat, muss sich jetzt zurückziehen. Hat der Gegner keine Schiffe mehr, endet der Kampf ohne Rückzug.",
     "Haben beide noch Schiffe: nächste Runde ab Schritt 2."],
    "**Rückzug**: Alle eigenen Schiffe mit Bewegungswert ziehen in ein einziges angrenzendes System. Es muss eigene Einheiten oder einen eigenen Planeten enthalten und darf keine Schiffe anderer Spieler enthalten. Jäger und Bodentruppen, die nicht mitkommen, werden entfernt. Dort einen Kommandomarker aus dem Nachschub legen, falls noch keiner liegt.",
    "**Ende**: Wer noch Schiffe hat, gewinnt. Keiner: Unentschieden. In Runde 1 fallen „zu Beginn des Kampfes“ und „zu Beginn der Kampfrunde“ zusammen, in der letzten Runde die Ende-Effekte. Danach muss der Gewinner überzählige Jäger und Bodentruppen (Kapazität) entfernen.",
    "Kann mathematisch keine Seite gewinnen, muss sich der Angreifer zurückziehen. Geht das nicht, werden seine Einheiten zerstört."],
  see: ["jaegerabwehr", "schadensresistenz", "angreifer", "verteidiger", "kapazitaet", "nebel"], topic: "kampf" },

{ id: "raumwerft", nr: 72, t: "Raumwerft", en: "Space Dock",
  x: ["Gebäude mit der Fähigkeit Produktion.",
    ["Kommt meist über Infrastruktur ins Spiel. Höchstens 1 pro Planet.",
     "Produktionswert und Jäger-Regel stehen auf dem Fraktionsbogen bzw. der Aufwertung (Standard: Ressourcen des Planeten + 2, bis zu 3 Jäger im System brauchen keine Kapazität).",
     "Steht auf einem Planeten mit Einheiten eines anderen Spielers kein eigener Bodentrupp mehr neben der Raumwerft, wird sie zerstört.",
     "Die Schwebefabrik der Zaar wird zerstört, sobald sie blockiert ist."]],
  see: ["produktion", "gebaeude", "blockiert", "infrastruktur"] },

{ id: "relikte", nr: 73, t: "Relikte und Reliktfragmente", en: "Relics, Relic Fragments", pok: true, k: "Reliktfragment Fragment Scherbe des Throns",
  x: ["Mächtige Artefakte vom Reliktstapel.",
    ["Reliktfragmente (gefährlich, kulturell, industriell) findet man beim Erkunden von Planeten und Wilder-Raum-Markern. Sie liegen offen im Spielbereich.",
     "Die Fähigkeit auf den Fragmenten (in der Regel: 3 gleiche vernichten) erlaubt, ein Relikt zu ziehen. Unbekannte Fragmente aus dem Wilder-Raum-Stapel zählen als jeder Typ.",
     "Wer ein Relikt erhält, zieht die oberste Karte und legt sie offen in seinen Spielbereich. Ist der Stapel leer, gibt es keins.",
     "Fragmente dürfen in Transaktionen getauscht werden, Relikte nicht."]],
  see: ["erkundung", "vernichten", "transaktionen"], topic: "pok" },

{ id: "ressourcen", nr: 74, t: "Ressourcen", en: "Resources",
  x: ["Der linke, gelb umrandete Wert auf Planetenkarte und Systemtafel. Damit produziert man Einheiten, erforscht Technologien und bezahlt Kosten.",
    ["Ausgeben durch Erschöpfen der Planetenkarte. Ein Planet liefert entweder Ressourcen oder Einfluss.",
     "1 Handelsware kann wie 1 Ressource ausgegeben werden."]],
  see: ["einfluss", "einheiten-produzieren", "handelswaren"] },

{ id: "schadensresistenz", nr: 75, t: "Schadensresistenz", en: "Sustain Damage", k: "beschädigt reparieren kippen",
  x: ["Einheitenfähigkeit, z. B. von Schlachtschiffen, Kriegssonnen, Flaggschiffen und Mechs.",
    ["Unmittelbar vor dem Zuweisen von Treffern negiert jede genutzte Schadensresistenz 1 Treffer. Die Einheit wird gekippt und ist beschädigt.",
     "Beschädigte Einheiten funktionieren normal, können die Fähigkeit aber erst nach der Reparatur wieder nutzen (Statusphase oder Effekt).",
     "Funktioniert gegen Treffer aus Kampf und aus Einheitenfähigkeiten wie Weltraumkanone, aber nur, wenn die Einheit ein gültiges Ziel für den Treffer ist. Gegen Jägerabwehr hilft sie Nicht-Jägern also nicht.",
     "Gegen Effekte, die direkt zerstören, hilft sie nicht."]],
  see: ["raumkampf", "bodenkampf", "statusphase"] },

{ id: "schiffe", nr: 76, t: "Schiffe", en: "Ships", k: "Träger Kreuzer Zerstörer Schlachtschiff Kriegssonne Flaggschiff Jäger",
  x: ["Träger, Kreuzer, Schlachtschiffe, Zerstörer, Jäger, Kriegssonnen und das Flaggschiff jeder Fraktion.",
    ["Schiffe stehen immer im Weltraumbereich.",
     "Nicht-Jäger-Schiffe pro System höchstens so viele wie Marker im Flottenpool. Jäger zählen stattdessen gegen die Kapazität.",
     "Attribute: Kosten, Kampf, Bewegungswert, Kapazität."]],
  see: ["flottenpool", "kapazitaet", "einheiten"], topic: "limits" },

{ id: "siegpunkte", nr: 77, t: "Siegpunkte und Spielende", en: "Victory Points", k: "gewinnen Sieg 10 14",
  x: ["Wer zuerst 10 Siegpunkte hat (oder 14 mit der langen Leiste), gewinnt sofort.",
    ["Meistens über Aufträge, außerdem Hütermarker, Imperium mit Mecatol Rex, manche Agenden, Vertragskarten und Relikte.",
     "Mehr als 10 (bzw. 14) Punkte gibt es nicht.",
     "Erreichen mehrere gleichzeitig 10, gewinnt, wer in der Initiativreihenfolge weiter vorne steht. Ohne Strategiekarten gewinnt, wer im Uhrzeigersinn am nächsten am Sprecher sitzt (der Sprecher selbst zuerst).",
     "Kann der Sprecher keinen öffentlichen Auftrag mehr aufdecken, endet die Partie. Die meisten Punkte gewinnen, bei Gleichstand die frühere Initiative.",
     "„Meiste“ oder „wenigste“ Punkte bei Gleichstand: Alle Gleichplatzierten sind betroffen.",
     "Punkte aus Gesetzen bleiben, auch wenn das Gesetz später abgelegt wird."]],
  see: ["auftragskarten", "huetermarker", "imperium"] },

{ id: "spielbereit", nr: 78, t: "Spielbereit", en: "Readied",
  x: ["Spielbereite Karten liegen offen und können erschöpft bzw. genutzt werden.",
    ["Spielbereite Planeten erschöpft man für Ressourcen oder Einfluss.",
     "Manche Technologien erschöpft man als Teil der Kosten.",
     "Im Schritt „Spielbereit machen“ der Statusphase wird alles wieder umgedreht."]],
  see: ["erschoepft", "statusphase"] },

{ id: "spielplan", nr: 79, t: "Spielplan", en: "Game Board", k: "Rand",
  x: ["Alle Systemtafeln im Spiel, auch solche, die keine anderen berühren (Heimat-System der Geister von Creuss).",
    "Eine Tafel liegt am Rand, wenn eine ihrer Seiten keine andere Tafel berührt. Das Creuss-Heimat-System und der Wurmloch-Nexus liegen am Rand."],
  see: ["systemtafeln", "hyperrouten"] },

{ id: "spielrunde", nr: 80, t: "Spielrunde", en: "Game Round",
  x: ["Eine Runde hat vier Phasen: Strategiephase, Aktionsphase, Statusphase, Agendaphase. Die Agendaphase gibt es erst, sobald der Hütermarker entfernt wurde. Spielzüge gibt es nur in der Aktionsphase."],
  see: ["strategiephase", "aktionsphase", "statusphase", "agendaphase"] },

{ id: "sprecher", nr: 81, t: "Sprecher", en: "Speaker",
  x: ["Der Spieler mit dem Sprechermarker. Zu Spielbeginn zufällig.",
    ["Wählt in der Strategiephase als Erster eine Strategiekarte.",
     "Legt beim Aufbau die Aufträge aus und deckt in der Statusphase einen neuen auf.",
     "Deckt in der Agendaphase die Agenden auf, stimmt als Letzter ab und entscheidet bei Gleichstand.",
     "Wechselt über Politik. Scheidet er aus, geht der Marker nach links."]],
  see: ["politik", "agendaphase", "strategiephase"] },

{ id: "statusphase", nr: 82, t: "Statusphase", en: "Status Phase",
  x: ["Aufträge werten und die nächste Runde vorbereiten. Acht Schritte:",
    ["**1 · Aufträge werten**: in Initiativreihenfolge je bis zu 1 öffentlicher und 1 geheimer Auftrag.",
     "**2 · Öffentlichen Auftrag aufdecken**: macht der Sprecher. Stufe II erst, wenn alle Stufe-I-Karten offen sind. Ist keiner mehr da, endet das Spiel.",
     "**3 · Aktionskarten ziehen**: je 1, in Initiativreihenfolge.",
     "**4 · Kommandomarker entfernen**: alle eigenen Marker vom Spielplan in den Nachschub.",
     "**5 · Marker erhalten und umverteilen**: je 2 Marker aus dem Nachschub, dann alle Marker auf dem Kommandobogen frei umverteilen. Nach Verkleinern des Flottenpools Schiffe pro System prüfen.",
     "**6 · Spielbereit machen**: alle erschöpften Karten, auch Strategiekarten.",
     "**7 · Einheiten reparieren**: beschädigte Einheiten aufstellen.",
     "**8 · Strategiekarten zurücklegen**: Hütermarker entfernt? Dann Agendaphase, sonst neue Runde."]],
  see: ["auftragskarten", "kommandomarker", "agendaphase"] },

{ id: "strategieaktion", nr: 83, t: "Strategieaktion", en: "Strategic Action", k: "Primärfähigkeit Sekundärfähigkeit",
  x: ["Der aktive Spieler handelt die Primärfähigkeit seiner Strategiekarte von oben nach unten ab.",
    ["Danach darf jeder andere Spieler, ab links vom aktiven Spieler im Uhrzeigersinn, die Sekundärfähigkeit nutzen. Keine Pflicht.",
     "Dann wird die Karte erschöpft. Sie ist für diese Runde verbraucht, und der Spieler darf später passen.",
     "Bei 3 oder 4 Spielern muss man mit beiden Karten eine Strategieaktion gemacht haben, bevor man passen darf."]],
  see: ["strategiekarte", "aktionsphase", "kommandomarker"] },

{ id: "strategiekarte", nr: 84, t: "Strategiekarte", en: "Strategy Card",
  x: ["Acht Karten mit Initiative 1 bis 8, je einer Primär- und einer Sekundärfähigkeit.",
    ["Primärfähigkeit nur auf eigenen Karten, Sekundärfähigkeit nur auf Karten anderer.",
     "Spielbereite Seite: Name, Initiative und Fähigkeiten. Erschöpfte Seite: nur die Initiative.",
     "Eine Karte im Spielbereich eines Spielers gehört ihm bis zur Statusphase."],
    "Die Karten: 1 Führungsstärke, 2 Diplomatie, 3 Politik, 4 Infrastruktur, 5 Handel, 6 Kriegsführung, 7 Technologie, 8 Imperium."],
  see: ["fuehrungsstaerke", "diplomatie", "politik", "infrastruktur", "handel", "kriegsfuehrung", "technologie-karte", "imperium"], topic: "sc" },

{ id: "strategiephase", nr: 85, t: "Strategiephase", en: "Strategy Phase",
  x: ["Jeder wählt die Strategiekarte(n) für die Runde.",
    ["Ab Sprecher im Uhrzeigersinn wählt jeder 1 Karte aus der Mitte. Liegen Handelswaren darauf, bekommt er sie.",
     "Bei 3 oder 4 Spielern folgt eine zweite Runde, wieder ab Sprecher.",
     "Danach legt der Sprecher 1 Handelsware auf jede nicht gewählte Karte. Bei 4 und 8 Spielern bleibt keine übrig."]],
  see: ["strategiekarte", "sprecher", "handelswaren"] },

{ id: "supernova", nr: 86, t: "Supernova", en: "Supernova",
  x: ["Anomalie. Schiffe dürfen sich weder hinein- noch hindurchbewegen. Ausnahmen nur über Fraktionstechnologie (Glut von Muaat)."],
  see: ["anomalien"] },

{ id: "systemtafeln", nr: 87, t: "Systemtafeln", en: "System Tiles", k: "Heimat-System Weltraum",
  x: ["Jede Tafel ist ein Bereich der Galaxie.",
    ["Grüne Rückseite: Heimat-Systeme.",
     "Blaue Rückseite: Systeme mit Planeten.",
     "Rote Rückseite: Anomalien und Systeme ohne Planeten.",
     "Bodentruppen und Gebäude stehen auf Planeten, Schiffe im Weltraum, also außerhalb der Planeten.",
     "Doppelseitige Tafeln mit Linien sind Hyperrouten und keine Systeme."]],
  see: ["spielplan", "anomalien", "hyperrouten"] },

{ id: "taktikaktion", nr: 88, t: "Taktikaktion", en: "Tactical Action",
  x: ["Der wichtigste Weg, um Schiffe zu bewegen, Planeten zu erobern und Einheiten zu produzieren. Alle fünf Schritte finden statt, man muss sich nicht zwischen Kampf und Produktion entscheiden.",
    ["**1 · Aktivierung**: Marker aus dem Taktikpool in ein System ohne eigenen Marker.",
     "**2 · Bewegung**: Schiffe bewegen, dann Offensivfeuer der Weltraumkanone.",
     "**3 · Raumkampf**: wenn zwei Spieler Schiffe im System haben.",
     "**4 · Einmarsch**: Bombardement, Bodentruppen entsenden, Defensivfeuer der Weltraumkanone, Bodenkampf, Kontrolle übernehmen.",
     "**5 · Produktion**: auch ohne vorherige Bewegung oder Landung."]],
  see: ["aktives-system", "bewegung", "raumkampf", "einmarsch", "produktion"], topic: "takt" },

{ id: "technologie", nr: 89, t: "Technologie", en: "Technology", k: "erforschen Voraussetzung Farbe Spezialisierung",
  x: ["Technologien verbessern Einheiten oder geben Fähigkeiten.",
    ["Erforschen über die Strategiekarte Technologie oder andere Effekte. Die Karte kommt aus dem eigenen Technologiestapel offen neben den Fraktionsbogen.",
     "Voraussetzungen: Für jedes farbige Symbol unten links braucht man eine eigene Technologie dieser Farbe.",
     "Farben: Biotechnik (grün), Kybernetik (gelb), Antriebstechnik (blau), Kriegsführung (rot). Aufwertungen für Einheiten haben keine Farbe.",
     "Technologie-Spezialisierung: Beim Erforschen darf man einen spielbereiten eigenen Planeten mit passender Spezialisierung erschöpfen, um 1 Voraussetzung dieser Farbe zu ignorieren.",
     "„Technologie erhalten“ ist kein Erforschen: Die Karte kommt ohne Voraussetzungen ins Spiel.",
     "Fraktionstechnologien anderer Fraktionen sind tabu. Den eigenen Stapel darf man jederzeit durchsehen."]],
  see: ["technologie-karte", "aufwertungen", "planeten"] },

{ id: "technologie-karte", nr: 90, t: "Technologie (Strategiekarte 7)", en: "Technology (Strategy Card)", k: "Strategiekarte erforschen",
  x: ["Initiative 7.",
    ["**Primär**: 1 Technologie erforschen. Dann darf man 6 Ressourcen ausgeben und 1 weitere erforschen.",
     "**Sekundär**: 1 Marker aus dem Strategiepool und 4 Ressourcen ausgeben, 1 Technologie erforschen."]],
  see: ["technologie", "strategiekarte"], topic: "sc" },

{ id: "transaktionen", nr: 91, t: "Transaktionen", en: "Transactions", k: "handeln tauschen Handel",
  x: ["Der Tausch von Spielmaterial zwischen zwei Spielern.",
    ["Der aktive Spieler darf in seinem Zug mit jedem Nachbarn bis zu 1 Transaktion machen, jederzeit im Zug, sogar im Kampf.",
     "Getauscht werden dürfen nur Handelswaren, Massenprodukte, Reliktfragmente und bis zu 1 Vertragskarte pro Seite. Die Hacan dürfen auch Aktionskarten tauschen.",
     "Ungleiche Tausche und Geschenke sind erlaubt. Bedingungen werden vorher vereinbart, danach ist nichts rückgängig zu machen.",
     "In der Agendaphase darf während jeder Agenda jedes Spielerpaar 1 Transaktion machen, Nachbarschaft egal.",
     "Gekaperte Schiffe und Mechs dürfen zurückgegeben werden."]],
  see: ["nachbarn", "massenprodukte", "vertragskarten", "geschaefte"], topic: "handel" },

{ id: "transportieren", nr: 92, t: "Transportieren", en: "Transport",
  x: ["Ein Schiff mit Kapazität darf beim Bewegen Jäger und Bodentruppen bis zu seiner Kapazität mitnehmen.",
    ["Einsammeln darf es im Startsystem, in jedem durchflogenen System und im aktiven System.",
     "Nicht aus Systemen mit eigenem Kommandomarker, außer dem aktiven System.",
     "Die Einheiten bleiben beim Schiff, bis es seine Bewegung beendet.",
     "Wird das Schiff im Gravitationsstrudel entfernt, auch alles, was es transportiert.",
     "Effekte, die Schiffe bewegen, erlauben ebenfalls den Transport aus dem System des Schiffs."]],
  see: ["bewegung", "kapazitaet", "einmarsch"], topic: "takt" },

{ id: "vernichten", nr: 93, t: "Vernichten", en: "Purge", pok: true,
  x: ["Vernichtetes Material kommt dauerhaft aus dem Spiel zurück in die Schachtel und kann nie wieder genutzt werden.",
    ["Vernichten ist oft Teil der Kosten. Eine Fähigkeit, die ihr eigenes Material vernichtet, ist einmal pro Partie nutzbar.",
     "Das Material ist vernichtet, auch wenn die Fähigkeit nur teilweise abgehandelt werden konnte.",
     "Beispiele: Helden nach der Nutzung, Reliktfragmente beim Eintauschen."]],
  see: ["anfuehrer", "relikte"] },

{ id: "verteidiger", nr: 94, t: "Verteidiger", en: "Defender",
  x: ["Im Raum- oder Bodenkampf der Spieler, der nicht der aktive Spieler ist.",
    ["Kündigt den Rückzug zuerst an.", "Bekommt im Nebel +1 auf Kampfwürfe."]],
  see: ["angreifer", "raumkampf", "nebel"] },

{ id: "vertragskarten", nr: 95, t: "Vertragskarten", en: "Promissory Notes", k: "Schuldschein Allianz Handelsabkommen Politisches Geheimnis",
  x: ["Jeder Spieler startet mit 5 allgemeinen und 1 fraktionsspezifischen Vertragskarte, die er an andere Spieler geben kann. Darunter mit PoK die Karte „Allianz“.",
    ["Eigene Vertragskarten kann man nie selbst spielen. Ihr Wert liegt im Verhandeln.",
     "Pro Transaktion höchstens 1 Vertragskarte geben, auch fremde, die man selbst bekommen hat. Karten im Spielbereich darf man nicht tauschen.",
     "Jede Karte nennt ihren Zeitpunkt. Spielen ist freiwillig, außer die Karte sagt etwas anderes.",
     "Muss eine Karte zurück, geschieht das erst nach vollständiger Abhandlung. Danach darf der Besitzer sie erneut weitergeben.",
     "Vertragskarten auf der Hand sind geheim. Verdeckte Karten werden nicht von ihren eigenen Rückgabe-Bedingungen ausgelöst.",
     "Scheidet ein Spieler aus, kommen alle Karten seiner Farbe aus dem Spiel."]],
  see: ["transaktionen", "anfuehrer", "ausgeschieden"], topic: "handel" },

{ id: "weltraumkanone", nr: 96, t: "Weltraumkanone", en: "Space Cannon", k: "PVS PDS Offensivfeuer Defensivfeuer Tiefraumkanone",
  x: ["Einheitenfähigkeit, z. B. von PVS. Format „Weltraumkanone X (Y)“: Treffer ab X, Y Würfel (ohne Y ein Würfel). Man muss nicht aktiver Spieler sein.",
    "**Offensivfeuer** (nach „Schiffe bewegen“)",
    ["Jeder Spieler, beginnend mit dem aktiven Spieler im Uhrzeigersinn, darf mit seinen Einheiten im aktiven System würfeln, auch wenn sich keine Schiffe bewegt haben.",
     "Andere Spieler zielen auf den aktiven Spieler. Der aktive Spieler wählt einen Spieler mit Schiffen im System.",
     "Der Getroffene zerstört pro Treffer eines seiner Schiffe im aktiven System.",
     "Mit Tiefraumkanone (PVS II) darf man auch aus angrenzenden Systemen schießen."],
    "**Defensivfeuer** (im Einmarsch, nach dem Entsenden)",
    ["Alle außer dem aktiven Spieler dürfen mit Einheiten auf dem Zielplaneten würfeln.",
     "Der aktive Spieler zerstört pro Treffer einen seiner Bodentruppen auf diesem Planeten.",
     "Reichweite in angrenzende Systeme gilt hier nicht."],
    "Effekte für Kampfwürfe (Wiederholen, Modifikatoren) wirken nicht auf die Weltraumkanone. Weltraumkanone ist kein Kampf."],
  see: ["pvs", "einmarsch", "bewegung", "schadensresistenz"], topic: "kampf" },

{ id: "wiederholungswuerfe", nr: 97, t: "Wiederholungswürfe", en: "Rerolls", k: "neu würfeln",
  x: ["Manche Effekte erlauben, Würfel neu zu werfen.",
    ["Das neue Ergebnis gilt, auch wenn es schlechter ist.",
     "Eine einzelne Fähigkeit darf denselben Würfel nicht mehrmals neu werfen. Mehrere Fähigkeiten dürfen denselben Wurf wiederholen.",
     "Wiederholt wird direkt nach dem Wurf, bevor andere Fähigkeiten oder Würfe folgen."]],
  see: ["kampf", "raumkampf", "modifikatoren"] },

{ id: "wilder-raum", nr: 98, t: "Wilder Raum", en: "Frontier Tokens", pok: true, k: "Frontier Wilder-Raum-Marker Nullpunktenergie-Reaktor Dark Energy Tap Ionensturm",
  x: ["Wilder-Raum-Marker liegen in Systemen ohne Planeten und können erkundet werden.",
    ["Beim Aufbau bekommt jedes Nicht-Heimat-System ohne Planeten einen Marker, auch planetenlose Anomalien und das Tor von Creuss. Höchstens einer pro System, keiner auf Hyperrouten.",
     "Erkunden nur mit der Technologie Nullpunktenergie-Reaktor oder über einen Effekt. Dann vom Wilder-Raum-Stapel ziehen und den Marker abgeben.",
     "Funde sind z. B. unbekannte Reliktfragmente, Gamma-Wurmlöcher, Ionensturm oder der Planet Mirage."]],
  see: ["erkundung", "relikte", "wurmloecher"], topic: "pok" },

{ id: "wurmloch-nexus", nr: 99, t: "Wurmloch-Nexus", en: "Wormhole Nexus", pok: true, k: "Mallice Gamma",
  x: ["Eine Systemtafel, in der viele Wurmlöcher zusammenlaufen. Sie gehört zum Spielplan und liegt am Rand.",
    ["Zu Beginn liegt die inaktive Seite oben: nur ein Gamma-Wurmloch.",
     "Sobald jemand eine Einheit hineinbewegt oder -platziert oder die Kontrolle über Mallice erlangt, wird er auf die aktive Seite gedreht: Alpha, Beta und Gamma.",
     "Fliegt ein Schiff hinein, wird er erst am Ende des Schritts „Bewegung“ aktiv."]],
  see: ["wurmloecher", "legendaere-planeten"], topic: "pok" },

{ id: "wurmloecher", nr: 100, t: "Wurmlöcher", en: "Wormholes", k: "Alpha Beta Gamma Delta Ionensturm",
  x: ["Systeme mit gleichartigen Wurmlöchern grenzen aneinander.",
    ["Grundarten: Alpha und Beta. Erweiterte Arten: Delta (Geister von Creuss) und Gamma (Wurmloch-Nexus, Erkundung). Für alle gelten dieselben Regeln.",
     "Wurmlöcher können Spieler zu Nachbarn machen.",
     "PVS mit Tiefraumkanone schießen auch durch Wurmlöcher.",
     "Der Ionensturm (Wilder-Raum-Karte) ist ein Alpha- oder Beta-Wurmloch und wird umgedreht, nachdem Schiffe ihn genutzt haben."]],
  see: ["angrenzend", "nachbarn", "wurmloch-nexus"] },

{ id: "zerstoert", nr: 101, t: "Zerstört", en: "Destroyed", k: "entfernt",
  x: ["Eine zerstörte Einheit kommt vom Spielplan zurück in den Nachschub ihres Spielers.",
    ["Beim Zuweisen von Treffern zerstört man pro Treffer eine eigene Einheit seiner Wahl.",
     "Einheiten, die wegen eines verkleinerten Flottenpools entfernt werden, gelten nicht als zerstört. Dasselbe gilt für Schiffe, die im Gravitationsstrudel entfernt werden."]],
  see: ["raumkampf", "flottenpool", "gravitationsstrudel"] }
]);

  function svg(name, size, color) {
    return '<svg width="' + (size || 22) + '" height="' + (size || 22) + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || "currentColor") +
      '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + "</svg>";
  }

  /* ---------- Routing über #anker ---------- */
  function parseHash() {
    var h = "";
    try { h = decodeURIComponent((location.hash || "").slice(1)); } catch (e) {}
    if (!h || h === "ablauf") return { v: "ablauf" };
    if (h === "kampf") return { v: "topic", id: "kampf", tab: "kampf" };
    if (h === "nachschlagen" || h === "regeln" || h === "suche" || h === "credits") return { v: h };
    if (h.indexOf("t-") === 0 && topicById[h.slice(2)]) return { v: "topic", id: h.slice(2) };
    if (h.indexOf("r-") === 0 && ruleById[h.slice(2)]) return { v: "regeln", focus: h.slice(2) };
    return { v: "ablauf" };
  }
  var route = parseHash();
  function go(hash) {
    if (("#" + hash) === location.hash || (!location.hash && hash === "ablauf")) { route = parseHash(); render(true); return; }
    try { location.hash = hash; } catch (e) { route = parseHash(); render(true); }
  }
  window.addEventListener("hashchange", function () { route = parseHash(); render(true); });

  /* ---------- Ablauf-Logik ---------- */
  function locked(i) { return !!PH[i].needsCustodians && !st.cust; }
  function persist() { save("ti4.v2.pos", st); }
  function setPos(p, s) { st.p = p; st.s = s; persist(); }
  function nextPhaseIndex() {
    if (st.p === 2) return st.cust ? 3 : -1;
    if (st.p === 3) return -1;
    return st.p + 1;
  }
  function goNext() {
    var steps = PH[st.p].steps;
    if (st.s < steps.length - 1) { setPos(st.p, st.s + 1); return; }
    var n = nextPhaseIndex();
    if (n === -1) { st.round += 1; setPos(0, 0); clearChecks(["raumkampf", "einmarsch", "taktik", "handel"]); return; }
    setPos(n, 0);
  }
  function goPrev() {
    if (st.s > 0) { setPos(st.p, st.s - 1); return; }
    if (st.p === 0) return;
    var p = st.p - 1;
    setPos(p, PH[p].steps.length - 1);
  }
  function nextLabel() {
    var steps = PH[st.p].steps;
    if (st.s < steps.length - 1) return "Weiter: " + steps[st.s + 1].t;
    if (st.p === 0) return "Weiter zur Aktionsphase";
    if (st.p === 1) return "Alle gepasst";
    if (st.p === 2 && st.cust) return "Weiter zur Agendaphase";
    return "Runde " + (st.round + 1) + " starten";
  }
  function clearChecks(lists) {
    Object.keys(checks).forEach(function (k) {
      lists.forEach(function (l) { if (k.indexOf("chk-" + l + "-") === 0) delete checks[k]; });
    });
    save("ti4.v2.checks", checks);
  }

  /* ---------- Verweise ---------- */
  function refChip(ref) {
    if (ref.indexOf("r:") === 0) {
      var r = ruleById[ref.slice(2)];

    }

    return t ? '<a class="chip" href="#t-' + t.id + '">' + esc(t.name) + " ›</a>" : "";
  }

  /* ---------- Blöcke rendern ---------- */
  function blocks(list) { return list.map(block).join(""); }
  function block(b) {
    if (b.h) return '<h3 class="bh">' + md(b.h) + "</h3>";
    if (b.p) return "<p>" + md(b.p) + "</p>";
    if (b.ul) return '<ul class="plain">' + b.ul.map(function (x) { return "<li>" + md(x) + "</li>"; }).join("") + "</ul>";
    if (b.steps) return '<ol class="steps">' + b.steps.map(function (x) { return "<li><span>" + md(x) + "</span></li>"; }).join("") + "</ol>";

    if (b.table) {

        b.table.rows.map(function (r) {

        }).join("") + "</tbody></table></div>";
    }
    if (b.kv) return '<div class="kv">' + b.kv.map(function (x) { return "<div><b>" + esc(x[0]) + "</b><span>" + md(x[1]) + "</span></div>"; }).join("") + "</div>";
    if (b.sc) {
      return '<div class="sclist">' + b.sc.map(function (c) {

          '<p><span class="l">Primär</span>' + md(c.pri) + '</p><p><span class="l">Sekundär</span>' + md(c.sec) + "</p></div></div>";

    if (b.qa) {

      }).join("") + "</div>";
    }

      return '<div class="cards">' + b.cards.map(function (c) { return '<div class="card"><h3>' + md(c.title) + "</h3>" + blocks(c.blocks) + "</div>"; }).join("") + "</div>";
    }
    if (b.rules) {
      return '<div class="chips"><span class="k">Im Regelheft</span>' + b.rules.map(function (id) { return refChip("r:" + id); }).join("") + "</div>";

  /* ---------- Ansichten ---------- */

    if (step.refs && step.refs.length) h += '<div class="chips"><span class="k">Dazu nachschlagen</span>' + step.refs.map(refChip).join("") + "</div>";
    if (st.p === 2 && st.s === total - 1 && !st.cust) h += '<p class="locked-note">Der Hütermarker liegt noch auf Mecatol Rex, darum folgt keine Agendaphase. Wird er entfernt, oben umschalten.</p>';
    var up = ph.steps.slice(st.s + 1, st.s + 3);

  function letterOf(r) { var c = r.t.charAt(0).toUpperCase(); return ({ "Ä": "A", "Ö": "O", "Ü": "U" })[c] || c; }
  function ruleMatches(r, q) {
    if (!q) return true;
    var hay = norm([r.t, r.en, r.k || "", "nr " + r.nr, JSON.stringify(r.x)].join(" "));
    return q.split(/\s+/).every(function (w) { return hay.indexOf(w) > -1; });
  }
  function viewRegeln() {
    var letters = [];
    RULES.forEach(function (r) { var l = letterOf(r); if (letters.indexOf(l) < 0) letters.push(l); });
    var h = '<a class="back" href="#nachschlagen">' + svg("back", 18) + "Nachschlagen</a><h1>Regelreferenz A–Z</h1>" +
      '<p class="lead">Zusammenfassung der Living Rules Reference 2.0 in eigenen Worten. „Nr.“ ist die Nummer im offiziellen deutschen Regelheft.</p>' +
      '<label class="field" for="rf">' + svg("search", 20) + '<span class="sr">Einträge filtern</span><input id="rf" type="search" placeholder="Einträge filtern, auch englische Begriffe" autocomplete="off" value="' + esc(ruleFilter) + '"></label>' +
      '<nav class="letters" aria-label="Buchstaben">' + letters.map(function (l) { return '<a href="#" data-act="letter" data-l="' + l + '">' + l + "</a>"; }).join("") + "</nav>" +
      '<div class="rules" id="rules">';

      var open = route.focus === r.id;
      h += '<details class="rule' + (open ? " flash" : "") + '" id="r-' + r.id + '" data-letter="' + l + '"' + (open ? " open" : "") + "><summary>" +
        '<span class="nr">Nr. ' + r.nr + '</span><span class="tt">' + esc(r.t) + "</span>" + (r.pok ? ' <span class="tag">PoK</span>' : "") +
        '<span class="en">' + esc(r.en) + "</span></summary>" +
        '<div class="rb">' + r.x.map(function (x) {
          return Array.isArray(x) ? '<ul class="plain">' + x.map(function (li) { return "<li>" + md(li) + "</li>"; }).join("") + "</ul>" : "<p>" + md(x) + "</p>";

  function applyRuleFilter() {
