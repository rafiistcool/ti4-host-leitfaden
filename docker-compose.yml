services:
  ti4-host:
    # Fertiges Image aus der GitHub Container Registry (wird bei jedem Push auf main gebaut).
    # Alternativ lokal bauen: "docker compose up -d --build" nutzt das Dockerfile.
    image: ghcr.io/rafiistcool/ti4-host-leitfaden:latest
    build: .
    container_name: ti4-host
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - ti4-hub-api

  # Gemeinsame Daten für den Hub (Spieler, Sessions, Siegpunkte). nginx leitet /api/ hierher weiter.
  ti4-hub-api:
    image: ghcr.io/rafiistcool/ti4-host-leitfaden-api:latest
    build: ./server
    container_name: ti4-hub-api
    restart: unless-stopped
    volumes:
      - ti4-hub-data:/data

volumes:
  ti4-hub-data:
