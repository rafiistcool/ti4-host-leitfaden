<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Kreuzer II — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#abb3c1" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#abb3c1" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#abb3c1">EINHEITEN-AUFWERTUNG</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Kreuzer II</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#abb3c1" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#abb3c1">VORAUSSETZUNGEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">1× Biotechnik · 1× Kybernetik · 1×</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">Kriegsführung</text><text x="48" y="404" font-size="18" font-weight="700" fill="#abb3c1">EINHEITENWERTE</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Kosten 2 · Kampf 6 · Bewegung 3 ·</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">Kapazität 1</text><text x="48" y="534" font-size="18" font-weight="700" fill="#abb3c1">KURZREFERENZ</text><text x="48" y="568" font-size="26" font-weight="400" fill="#e5ebee">Kreuzer treffen auf 6 statt 7,</text><text x="48" y="604" font-size="26" font-weight="400" fill="#e5ebee">ziehen 3 statt 2 Felder weit und</text><text x="48" y="640" font-size="26" font-weight="400" fill="#e5ebee">erhalten Kapazität 1.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#abb3c1">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
