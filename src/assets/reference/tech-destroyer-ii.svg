<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Zerstörer II — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#abb3c1" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#abb3c1" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#abb3c1">EINHEITEN-AUFWERTUNG</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Zerstörer II</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#abb3c1" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#abb3c1">VORAUSSETZUNGEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">2× Kriegsführung</text><text x="48" y="368" font-size="18" font-weight="700" fill="#abb3c1">EINHEITENWERTE</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Kosten 1 · Kampf 8 · Bewegung 2</text><text x="48" y="462" font-size="18" font-weight="700" fill="#abb3c1">EINHEITENFÄHIGKEITEN</text><text x="48" y="496" font-size="26" font-weight="400" fill="#e5ebee">Jägerabwehr 6 (x3)</text><text x="48" y="556" font-size="18" font-weight="700" fill="#abb3c1">KURZREFERENZ</text><text x="48" y="590" font-size="26" font-weight="400" fill="#e5ebee">Zerstörer treffen auf 8 statt 9,</text><text x="48" y="626" font-size="26" font-weight="400" fill="#e5ebee">ihre Jägerabwehr wird von 9 (x2)</text><text x="48" y="662" font-size="26" font-weight="400" fill="#e5ebee">auf 6 (x3) verbessert.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#abb3c1">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
