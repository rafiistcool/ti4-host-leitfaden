<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Zepter der Herrschaft — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#c09cb2" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#c09cb2" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#c09cb2">VERTRAGSKARTE · DIE MAHACTANISCHEN</text><text x="48" y="103" font-size="18" font-weight="700" fill="#c09cb2">GEN-HEXER</text><text x="48" y="154" font-size="38" font-weight="700" fill="#f6f3ea">Zepter der Herrschaft</text><text x="48" y="216" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 263H632" stroke="#c09cb2" stroke-width="2"/><text x="48" y="299" font-size="18" font-weight="700" fill="#c09cb2">KURZREFERENZ</text><text x="48" y="333" font-size="26" font-weight="400" fill="#e5ebee">Zu Beginn der Strategiephase</text><text x="48" y="369" font-size="26" font-weight="400" fill="#e5ebee">wählst du 1 Nicht-Heimat-System</text><text x="48" y="405" font-size="26" font-weight="400" fill="#e5ebee">mit deinen Einheiten. Jeder andere</text><text x="48" y="441" font-size="26" font-weight="400" fill="#e5ebee">Spieler mit einem Marker im</text><text x="48" y="477" font-size="26" font-weight="400" fill="#e5ebee">Flottenpool des Mahact-Spielers</text><text x="48" y="513" font-size="26" font-weight="400" fill="#e5ebee">legt einen Marker aus seinem</text><text x="48" y="549" font-size="26" font-weight="400" fill="#e5ebee">Nachschub in dieses System, danach</text><text x="48" y="585" font-size="26" font-weight="400" fill="#e5ebee">geht die Karte an den</text><text x="48" y="621" font-size="26" font-weight="400" fill="#e5ebee">Mahact-Spieler zurück.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#c09cb2">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
