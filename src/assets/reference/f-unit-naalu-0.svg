<svg xmlns="http://www.w3.org/2000/svg" width="680" height="994" viewBox="0 0 680 994" role="img" aria-labelledby="title desc"><title id="title">Hybrid-Kristalljäger I — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="994" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="970" rx="18" fill="none" stroke="#a7b4c6" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#a7b4c6" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#a7b4c6">SONDEREINHEIT · DAS NAALU-KOLLEKTIV</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Hybrid-Kristalljäger I</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 238H632" stroke="#a7b4c6" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#a7b4c6">EINHEITENWERTE</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Kosten 1 (×2) · Kampf 8 · Bewegung</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">– · Kapazität –</text><text x="48" y="404" font-size="18" font-weight="700" fill="#a7b4c6">KURZREFERENZ</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Jäger mit Kampfwert 8 statt 9.</text><text x="48" y="498" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · HYBRID-KRISTALLJÄGER II</text><text x="48" y="532" font-size="26" font-weight="400" fill="#e5ebee">Kosten 1 (×2) · Kampf 7 · Bewegung</text><text x="48" y="568" font-size="26" font-weight="400" fill="#e5ebee">2 · Kapazität –</text><text x="48" y="628" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · KURZREFERENZ</text><text x="48" y="662" font-size="26" font-weight="400" fill="#e5ebee">Bewegt sich ohne Transport. Jäger</text><text x="48" y="698" font-size="26" font-weight="400" fill="#e5ebee">über der Kapazität deiner Schiffe</text><text x="48" y="734" font-size="26" font-weight="400" fill="#e5ebee">zählen nur je als halbes Schiff</text><text x="48" y="770" font-size="26" font-weight="400" fill="#e5ebee">gegen deinen Flottenpool.</text><path d="M48 840H632" stroke="#68798a" stroke-width="1"/><text x="48" y="874" font-size="18" font-weight="700" fill="#a7b4c6">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="905" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="928" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
