<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">G&apos;hom Sek&apos;kus — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#8ebbbc" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#8ebbbc" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#8ebbbc">KOMMANDEUR · SARDAKK N&apos;ORR</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">G&apos;hom Sek&apos;kus</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Eigenname unverändert</text><path d="M48 238H632" stroke="#8ebbbc" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#8ebbbc">FREISCHALTEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">5 Planeten außerhalb deines</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">Heimat-Systems kontrollieren.</text><text x="48" y="404" font-size="18" font-weight="700" fill="#8ebbbc">KURZREFERENZ</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Im Schritt Bodentruppen entsenden</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">darfst du von jedem Planeten im</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">aktiven System und in angrenzenden</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">Systemen ohne eigenen</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">Kommandomarker bis zu 1</text><text x="48" y="618" font-size="26" font-weight="400" fill="#e5ebee">Bodentruppe entsenden.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#8ebbbc">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
