<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1301" viewBox="0 0 1120 1301" role="img" aria-labelledby="title desc"><title id="title">Die Titanen des Ul — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1301" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1277" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Die Titanen des Ul</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">TERRAGENESE</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Nachdem du einen Planeten ohne Schläfermarker erkundet hast,</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">darfst du 1 Schläfermarker auf ihn legen oder dorthin</text><text x="64" y="381" font-size="25" font-weight="400" fill="#e5ebee">versetzen.</text><text x="64" y="439" font-size="18" font-weight="700" fill="#d9b46e">ERWECKEN</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">Nachdem du ein System mit mindestens 1 deiner Schläfermarker</text><text x="64" y="507" font-size="25" font-weight="400" fill="#e5ebee">aktiviert hast, darfst du jeden davon durch 1 PVS aus deinem</text><text x="64" y="541" font-size="25" font-weight="400" fill="#e5ebee">Nachschub ersetzen.</text><text x="64" y="599" font-size="18" font-weight="700" fill="#d9b46e">VEREINIGUNG</text><text x="64" y="633" font-size="25" font-weight="400" fill="#e5ebee">Setzen dein Flaggschiff oder Erwecken deine Einheiten in</text><text x="64" y="667" font-size="25" font-weight="400" fill="#e5ebee">denselben Weltraumbereich oder auf denselben Planeten wie</text><text x="64" y="701" font-size="25" font-weight="400" fill="#e5ebee">Einheiten eines anderen Spielers, kämpfen sie in den Schritten</text><text x="64" y="735" font-size="25" font-weight="400" fill="#e5ebee">Raumkampf beziehungsweise Bodenkampf mit.</text><text x="64" y="793" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · OURANOS</text><text x="64" y="827" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 7 (×2) · Bewegung 1 · Kapazität 3</text><text x="64" y="885" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="919" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz. Einsatz: Nachdem du ein System mit</text><text x="64" y="953" font-size="25" font-weight="400" fill="#e5ebee">mindestens 1 deiner PVS aktiviert hast, darfst du 1 dieser PVS</text><text x="64" y="987" font-size="25" font-weight="400" fill="#e5ebee">durch das Flaggschiff ersetzen.</text><text x="64" y="1045" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="1079" font-size="25" font-weight="400" fill="#e5ebee">2</text><path d="M64 1147H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="1181" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="1212" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="64" y="1235" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
