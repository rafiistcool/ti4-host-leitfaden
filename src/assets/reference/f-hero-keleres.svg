<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1486" viewBox="0 0 680 1486" role="img" aria-labelledby="title desc"><title id="title">Harka Leeds / Odlynn Myrr / Kuuasi Aun Jalatai — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1486" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1462" rx="18" fill="none" stroke="#8ebbbc" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#8ebbbc" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#8ebbbc">HELD · DIE KELERES DES RATES</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Harka Leeds / Odlynn</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">Myrr / Kuuasi Aun</text><text x="48" y="233" font-size="38" font-weight="700" fill="#f6f3ea">Jalatai</text><text x="48" y="295" font-size="17" font-weight="400" fill="#b9c6d1">Eigenname unverändert</text><path d="M48 342H632" stroke="#8ebbbc" stroke-width="2"/><text x="48" y="378" font-size="18" font-weight="700" fill="#8ebbbc">FREISCHALTEN</text><text x="48" y="412" font-size="26" font-weight="400" fill="#e5ebee">3 gewertete Aufträge.</text><text x="48" y="472" font-size="18" font-weight="700" fill="#8ebbbc">KURZREFERENZ</text><text x="48" y="506" font-size="26" font-weight="400" fill="#e5ebee">Du nutzt nur den Helden deiner</text><text x="48" y="542" font-size="26" font-weight="400" fill="#e5ebee">gewählten Herkunft, er wird nach</text><text x="48" y="578" font-size="26" font-weight="400" fill="#e5ebee">Gebrauch vernichtet. Harka Leeds</text><text x="48" y="614" font-size="26" font-weight="400" fill="#e5ebee">(Mentak), Materialaktion: Decke</text><text x="48" y="650" font-size="26" font-weight="400" fill="#e5ebee">Aktionskarten auf, bis 3 mit</text><text x="48" y="686" font-size="26" font-weight="400" fill="#e5ebee">Materialaktion dabei sind, nimm</text><text x="48" y="722" font-size="26" font-weight="400" fill="#e5ebee">diese auf die Hand und mische den</text><text x="48" y="758" font-size="26" font-weight="400" fill="#e5ebee">Rest zurück. Odlynn Myrr (Xxcha),</text><text x="48" y="794" font-size="26" font-weight="400" fill="#e5ebee">nach dem Aufdecken einer Agenda:</text><text x="48" y="830" font-size="26" font-weight="400" fill="#e5ebee">Gib bis zu 6 zusätzliche Stimmen ab</text><text x="48" y="866" font-size="26" font-weight="400" fill="#e5ebee">und prognostiziere ein Ergebnis. Für</text><text x="48" y="902" font-size="26" font-weight="400" fill="#e5ebee">jeden Spieler, der für ein anderes</text><text x="48" y="938" font-size="26" font-weight="400" fill="#e5ebee">Ergebnis stimmt, erhältst du 1</text><text x="48" y="974" font-size="26" font-weight="400" fill="#e5ebee">Handelsware und 1</text><text x="48" y="1010" font-size="26" font-weight="400" fill="#e5ebee">Kommandomarker. Kuuasi Aun</text><text x="48" y="1046" font-size="26" font-weight="400" fill="#e5ebee">Jalatai (Silberschwingen), zu Beginn</text><text x="48" y="1082" font-size="26" font-weight="400" fill="#e5ebee">einer Raumkampfrunde in einem</text><text x="48" y="1118" font-size="26" font-weight="400" fill="#e5ebee">System mit einem deiner Planeten:</text><text x="48" y="1154" font-size="26" font-weight="400" fill="#e5ebee">Setze dein Flaggschiff und</text><text x="48" y="1190" font-size="26" font-weight="400" fill="#e5ebee">insgesamt 2 Kreuzer und/oder</text><text x="48" y="1226" font-size="26" font-weight="400" fill="#e5ebee">Zerstörer aus deinem Nachschub ins</text><text x="48" y="1262" font-size="26" font-weight="400" fill="#e5ebee">aktive System.</text><path d="M48 1332H632" stroke="#68798a" stroke-width="1"/><text x="48" y="1366" font-size="18" font-weight="700" fill="#8ebbbc">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="1397" font-size="17" fill="#b9c6d1">Codex III · optional</text><text x="48" y="1420" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
