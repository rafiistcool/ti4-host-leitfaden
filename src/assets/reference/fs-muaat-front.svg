<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1039" viewBox="0 0 1120 1039" role="img" aria-labelledby="title desc"><title id="title">Die Glut von Muaat — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1039" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1015" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Die Glut von Muaat</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">STERNENSCHMIEDE</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Materialaktion: Gib 1 Marker aus deinem Strategiepool aus, um 2</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">Jäger oder 1 Zerstörer aus deinem Nachschub in ein System mit</text><text x="64" y="381" font-size="25" font-weight="400" fill="#e5ebee">mindestens 1 deiner Kriegssonnen zu setzen.</text><text x="64" y="439" font-size="18" font-weight="700" fill="#d9b46e">GASHLAI-PHYSIOLOGIE</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">Deine Schiffe dürfen sich durch Supernovae hindurchbewegen.</text><text x="64" y="531" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · DAS INFERNO</text><text x="64" y="565" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 5 (×2) · Bewegung 1 · Kapazität 3</text><text x="64" y="623" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="657" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz. Materialaktion: Gib 1 Marker aus deinem</text><text x="64" y="691" font-size="25" font-weight="400" fill="#e5ebee">Strategiepool aus, um 1 Kreuzer in das System dieses Schiffs zu</text><text x="64" y="725" font-size="25" font-weight="400" fill="#e5ebee">setzen.</text><text x="64" y="783" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="817" font-size="25" font-weight="400" fill="#e5ebee">4</text><path d="M64 885H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="919" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="950" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="64" y="973" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
