<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1066" viewBox="0 0 680 1066" role="img" aria-labelledby="title desc"><title id="title">Letani-Krieger I — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1066" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1042" rx="18" fill="none" stroke="#a7b4c6" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#a7b4c6" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#a7b4c6">SONDEREINHEIT · DAS ARBOREC</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Letani-Krieger I</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#a7b4c6" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#a7b4c6">EINHEITENWERTE</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Kosten 1 (×2) · Kampf 8 · Bewegung</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">– · Kapazität –</text><text x="48" y="404" font-size="18" font-weight="700" fill="#a7b4c6">KURZREFERENZ</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Infanterie mit Produktion 1.</text><text x="48" y="498" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · LETANI-KRIEGER II</text><text x="48" y="532" font-size="26" font-weight="400" fill="#e5ebee">Kosten 1 (×2) · Kampf 7 · Bewegung</text><text x="48" y="568" font-size="26" font-weight="400" fill="#e5ebee">– · Kapazität –</text><text x="48" y="628" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · KURZREFERENZ</text><text x="48" y="662" font-size="26" font-weight="400" fill="#e5ebee">Produktion 2. Wird die Einheit</text><text x="48" y="698" font-size="26" font-weight="400" fill="#e5ebee">zerstört, wirfst du 1 Würfel. Bei 6</text><text x="48" y="734" font-size="26" font-weight="400" fill="#e5ebee">oder mehr kommt sie auf diese</text><text x="48" y="770" font-size="26" font-weight="400" fill="#e5ebee">Karte und zu Beginn deines nächsten</text><text x="48" y="806" font-size="26" font-weight="400" fill="#e5ebee">Zuges auf einen eigenen Planeten in</text><text x="48" y="842" font-size="26" font-weight="400" fill="#e5ebee">deinem Heimat-System.</text><path d="M48 912H632" stroke="#68798a" stroke-width="1"/><text x="48" y="946" font-size="18" font-weight="700" fill="#a7b4c6">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="977" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="1000" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
