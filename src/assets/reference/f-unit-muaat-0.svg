<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1102" viewBox="0 0 680 1102" role="img" aria-labelledby="title desc"><title id="title">Kriegssonne-Prototyp I — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1102" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1078" rx="18" fill="none" stroke="#a7b4c6" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#a7b4c6" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#a7b4c6">SONDEREINHEIT · DIE GLUT VON MUAAT</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Kriegssonne-Prototyp I</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#a7b4c6" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#a7b4c6">EINHEITENWERTE</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Kosten 12 · Kampf 3 (×3) ·</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">Bewegung 1 · Kapazität 6</text><text x="48" y="404" font-size="18" font-weight="700" fill="#a7b4c6">KURZREFERENZ</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Schadensresistenz, Bombardement 3</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">(×3). Fremde Einheiten in diesem</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">System verlieren Planetarer Schild.</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">Muaat darf Kriegssonnen von Beginn</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">an ohne Technologie produzieren.</text><text x="48" y="642" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · KRIEGSSONNE-PROTOTYP II</text><text x="48" y="676" font-size="26" font-weight="400" fill="#e5ebee">Kosten 10 · Kampf 3 (×3) ·</text><text x="48" y="712" font-size="26" font-weight="400" fill="#e5ebee">Bewegung 3 · Kapazität 6</text><text x="48" y="772" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · KURZREFERENZ</text><text x="48" y="806" font-size="26" font-weight="400" fill="#e5ebee">Schadensresistenz, Bombardement 3</text><text x="48" y="842" font-size="26" font-weight="400" fill="#e5ebee">(×3). Fremde Einheiten in diesem</text><text x="48" y="878" font-size="26" font-weight="400" fill="#e5ebee">System verlieren Planetarer Schild.</text><path d="M48 948H632" stroke="#68798a" stroke-width="1"/><text x="48" y="982" font-size="18" font-weight="700" fill="#a7b4c6">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="1013" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="1036" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
