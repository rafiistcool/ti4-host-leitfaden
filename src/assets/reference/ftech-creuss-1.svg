<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1044" viewBox="0 0 680 1044" role="img" aria-labelledby="title desc"><title id="title">Wurmloch-Generator — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1044" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1020" rx="18" fill="none" stroke="#68add7" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#68add7" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#68add7">FRAKTIONSTECHNOLOGIE · ANTRIEBSTECHNIK</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Wurmloch-Generator</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#68add7" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#68add7">VORAUSSETZUNGEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">2× Antriebstechnik</text><text x="48" y="368" font-size="18" font-weight="700" fill="#68add7">KURZREFERENZ</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Zu Beginn der Statusphase legst du</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">einen Creuss-Wurmlochmarker in ein</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">System mit einem deiner Planeten</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">oder in ein Nicht-Heimat-System</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">ohne fremde Schiffe oder versetzt</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">ihn dorthin.</text><text x="48" y="642" font-size="18" font-weight="700" fill="#68add7">SPÄTERE FASSUNG · OPTIONAL</text><text x="48" y="676" font-size="26" font-weight="400" fill="#e5ebee">Codex I (Ω): Das Versetzen</text><text x="48" y="712" font-size="26" font-weight="400" fill="#e5ebee">geschieht stattdessen per</text><text x="48" y="748" font-size="26" font-weight="400" fill="#e5ebee">Materialaktion, für die du die Karte</text><text x="48" y="784" font-size="26" font-weight="400" fill="#e5ebee">erschöpfst, also jederzeit in der</text><text x="48" y="820" font-size="26" font-weight="400" fill="#e5ebee">Aktionsphase.</text><path d="M48 890H632" stroke="#68798a" stroke-width="1"/><text x="48" y="924" font-size="18" font-weight="700" fill="#68add7">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="955" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="978" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
