<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1174" viewBox="0 0 680 1174" role="img" aria-labelledby="title desc"><title id="title">Dimensionsriss I — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1174" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1150" rx="18" fill="none" stroke="#a7b4c6" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#a7b4c6" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#a7b4c6">SONDEREINHEIT · DIE VUIL&apos;RAITH-VERSCHWÖRUNG</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Dimensionsriss I</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 238H632" stroke="#a7b4c6" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#a7b4c6">EINHEITENWERTE</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Kosten – · Kampf – · Bewegung – ·</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">Kapazität –</text><text x="48" y="404" font-size="18" font-weight="700" fill="#a7b4c6">KURZREFERENZ</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Produktion 5. Ihr System gilt als</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">Gravitationsstrudel, für den deine</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">Schiffe nicht würfeln</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">(Dimensionsriss-Marker</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">darunterlegen). Bis zu 6 Jäger in</text><text x="48" y="618" font-size="26" font-weight="400" fill="#e5ebee">diesem System belegen keine</text><text x="48" y="654" font-size="26" font-weight="400" fill="#e5ebee">Kapazität.</text><text x="48" y="714" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · DIMENSIONSRISS II</text><text x="48" y="748" font-size="26" font-weight="400" fill="#e5ebee">Kosten – · Kampf – · Bewegung – ·</text><text x="48" y="784" font-size="26" font-weight="400" fill="#e5ebee">Kapazität –</text><text x="48" y="844" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · KURZREFERENZ</text><text x="48" y="878" font-size="26" font-weight="400" fill="#e5ebee">Produktion 7. Sonst wie Stufe I,</text><text x="48" y="914" font-size="26" font-weight="400" fill="#e5ebee">aber bis zu 12 Jäger belegen keine</text><text x="48" y="950" font-size="26" font-weight="400" fill="#e5ebee">Kapazität.</text><path d="M48 1020H632" stroke="#68798a" stroke-width="1"/><text x="48" y="1054" font-size="18" font-weight="700" fill="#a7b4c6">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="1085" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="1108" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
