<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1267" viewBox="0 0 1120 1267" role="img" aria-labelledby="title desc"><title id="title">Die mahactanischen Gen-Hexer — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1267" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1243" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Die mahactanischen Gen-Hexer</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">EDIKT</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Gewinnst du einen Kampf, legst du 1 Kommandomarker aus dem</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">Nachschub des Gegners in deinen Flottenpool, falls dort noch</text><text x="64" y="381" font-size="25" font-weight="400" fill="#e5ebee">keiner von ihm liegt. Fremde Marker in deinem Flottenpool</text><text x="64" y="415" font-size="25" font-weight="400" fill="#e5ebee">erhöhen dein Flottenlimit, dürfen aber nicht umverteilt werden.</text><text x="64" y="473" font-size="18" font-weight="700" fill="#d9b46e">IMPERIA</text><text x="64" y="507" font-size="25" font-weight="400" fill="#e5ebee">Liegt ein Kommandomarker eines anderen Spielers in deinem</text><text x="64" y="541" font-size="25" font-weight="400" fill="#e5ebee">Flottenpool, darfst du dessen Kommandeur nutzen, sofern er</text><text x="64" y="575" font-size="25" font-weight="400" fill="#e5ebee">freigeschaltet ist.</text><text x="64" y="633" font-size="18" font-weight="700" fill="#d9b46e">HYBRIS</text><text x="64" y="667" font-size="25" font-weight="400" fill="#e5ebee">Beim Aufbau vernichtest du deine Vertragskarte „Allianz“.</text><text x="64" y="701" font-size="25" font-weight="400" fill="#e5ebee">Andere Spieler dürfen dir ihre „Allianz“ nicht geben.</text><text x="64" y="759" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · ARVICON REX</text><text x="64" y="793" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 5 (×2) · Bewegung 1 · Kapazität 3</text><text x="64" y="851" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="885" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz. Gegen einen Gegner, dessen</text><text x="64" y="919" font-size="25" font-weight="400" fill="#e5ebee">Kommandomarker nicht in deinem Flottenpool liegt, erhält es +2</text><text x="64" y="953" font-size="25" font-weight="400" fill="#e5ebee">auf seine Kampfwürfe.</text><text x="64" y="1011" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="1045" font-size="25" font-weight="400" fill="#e5ebee">3</text><path d="M64 1113H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="1147" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="1178" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="64" y="1201" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
