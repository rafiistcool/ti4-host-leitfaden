<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1141" viewBox="0 0 1120 1141" role="img" aria-labelledby="title desc"><title id="title">Das Naalu-Kollektiv — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1141" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1117" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Das Naalu-Kollektiv</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">TELEPATHISCH</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Am Ende der Strategiephase legst du den „0“-Marker der Naalu</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">auf deine Strategiekarte und bist damit Erster in der</text><text x="64" y="381" font-size="25" font-weight="400" fill="#e5ebee">Initiativreihenfolge.</text><text x="64" y="439" font-size="18" font-weight="700" fill="#d9b46e">HELLSICHT</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">Nachdem ein anderer Spieler Schiffe in ein System mit deinen</text><text x="64" y="507" font-size="25" font-weight="400" fill="#e5ebee">Schiffen bewegt hat, darfst du 1 Marker aus deinem</text><text x="64" y="541" font-size="25" font-weight="400" fill="#e5ebee">Strategiepool in ein angrenzendes System ohne fremde Schiffe</text><text x="64" y="575" font-size="25" font-weight="400" fill="#e5ebee">legen und deine Schiffe aus dem aktiven System dorthin ziehen.</text><text x="64" y="633" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · MATRIARCHIN</text><text x="64" y="667" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 9 (×2) · Bewegung 1 · Kapazität 6</text><text x="64" y="725" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="759" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz. Bei einem Einmarsch in diesem System</text><text x="64" y="793" font-size="25" font-weight="400" fill="#e5ebee">darfst du Jäger wie Bodentruppen auf Planeten entsenden. Nach</text><text x="64" y="827" font-size="25" font-weight="400" fill="#e5ebee">dem Kampf kehren sie in den Weltraumbereich zurück.</text><text x="64" y="885" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="919" font-size="25" font-weight="400" fill="#e5ebee">3</text><path d="M64 987H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="1021" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="1052" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="64" y="1075" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
