<svg xmlns="http://www.w3.org/2000/svg" width="680" height="950" viewBox="0 0 680 950" role="img" aria-labelledby="title desc"><title id="title">Basis-Modernisierung — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="950" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="926" rx="18" fill="none" stroke="#e1c170" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#e1c170" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#e1c170">FRAKTIONSTECHNOLOGIE · KYBERNETIK</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Basis-Modernisierung</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M48 238H632" stroke="#e1c170" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#e1c170">VORAUSSETZUNGEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">1× Kybernetik</text><text x="48" y="368" font-size="18" font-weight="700" fill="#e1c170">KURZREFERENZ</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Du bist Nachbar aller Spieler mit</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Einheiten oder Planeten im oder</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">angrenzend an das</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">Mecatol-Rex-System. Du erhältst</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">die Planetenkarte Custodia Vigilia</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">samt Karte des legendären</text><text x="48" y="618" font-size="26" font-weight="400" fill="#e5ebee">Planeten, kannst beide nicht</text><text x="48" y="654" font-size="26" font-weight="400" fill="#e5ebee">verlieren und auf diese Technologie</text><text x="48" y="690" font-size="26" font-weight="400" fill="#e5ebee">darf kein Assimilatormarker gelegt</text><text x="48" y="726" font-size="26" font-weight="400" fill="#e5ebee">werden.</text><path d="M48 796H632" stroke="#68798a" stroke-width="1"/><text x="48" y="830" font-size="18" font-weight="700" fill="#e1c170">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="861" font-size="17" fill="#b9c6d1">Codex III · optional</text><text x="48" y="884" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
