<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1276" viewBox="0 0 680 1276" role="img" aria-labelledby="title desc"><title id="title">Bakterieller Kampfstoff X-89 — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1276" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1252" rx="18" fill="none" stroke="#75b583" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#75b583" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#75b583">BIOTECHNIK</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Bakterieller Kampfstoff</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">X-89</text><text x="48" y="243" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 290H632" stroke="#75b583" stroke-width="2"/><text x="48" y="326" font-size="18" font-weight="700" fill="#75b583">VORAUSSETZUNGEN</text><text x="48" y="360" font-size="26" font-weight="400" fill="#e5ebee">3× Biotechnik</text><text x="48" y="420" font-size="18" font-weight="700" fill="#75b583">KURZREFERENZ</text><text x="48" y="454" font-size="26" font-weight="400" fill="#e5ebee">Materialaktion: Karte erschöpfen</text><text x="48" y="490" font-size="26" font-weight="400" fill="#e5ebee">und 1 Planeten in einem System</text><text x="48" y="526" font-size="26" font-weight="400" fill="#e5ebee">wählen, in dem mindestens 1 deiner</text><text x="48" y="562" font-size="26" font-weight="400" fill="#e5ebee">Schiffe mit Bombardement steht.</text><text x="48" y="598" font-size="26" font-weight="400" fill="#e5ebee">Alle Infanterie auf diesem Planeten</text><text x="48" y="634" font-size="26" font-weight="400" fill="#e5ebee">wird zerstört.</text><text x="48" y="694" font-size="18" font-weight="700" fill="#75b583">SPÄTERE FASSUNG · OPTIONAL</text><text x="48" y="728" font-size="26" font-weight="400" fill="#e5ebee">Codex I (Ω): Zerstört dein</text><text x="48" y="764" font-size="26" font-weight="400" fill="#e5ebee">Bombardement mindestens 1</text><text x="48" y="800" font-size="26" font-weight="400" fill="#e5ebee">gegnerische Infanterie, darfst du</text><text x="48" y="836" font-size="26" font-weight="400" fill="#e5ebee">alle gegnerische Infanterie auf dem</text><text x="48" y="872" font-size="26" font-weight="400" fill="#e5ebee">Planeten zerstören. Codex 4.5 (ΩΩ,</text><text x="48" y="908" font-size="26" font-weight="400" fill="#e5ebee">englischer Download): Treffer aus</text><text x="48" y="944" font-size="26" font-weight="400" fill="#e5ebee">Bombardement und Bodenkampf</text><text x="48" y="980" font-size="26" font-weight="400" fill="#e5ebee">deiner Einheiten zählen doppelt,</text><text x="48" y="1016" font-size="26" font-weight="400" fill="#e5ebee">jeder bombardierte Planet wird</text><text x="48" y="1052" font-size="26" font-weight="400" fill="#e5ebee">erschöpft.</text><path d="M48 1122H632" stroke="#68798a" stroke-width="1"/><text x="48" y="1156" font-size="18" font-weight="700" fill="#75b583">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="1187" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="1210" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
