<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1165" viewBox="0 0 1120 1165" role="img" aria-labelledby="title desc"><title id="title">Die Emirate von Hacan — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1165" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1141" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Die Emirate von Hacan</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">MEISTER DES HANDELS</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Für die Sekundärfähigkeit der Strategiekarte Handel gibst du</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">keinen Kommandomarker aus.</text><text x="64" y="405" font-size="18" font-weight="700" fill="#d9b46e">GILDENSCHIFFE</text><text x="64" y="439" font-size="25" font-weight="400" fill="#e5ebee">Du darfst Transaktionen auch mit Spielern abhandeln, die nicht</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">deine Nachbarn sind.</text><text x="64" y="531" font-size="18" font-weight="700" fill="#d9b46e">VERMITTLER</text><text x="64" y="565" font-size="25" font-weight="400" fill="#e5ebee">Bei deinen Transaktionen dürfen auch Aktionskarten getauscht</text><text x="64" y="599" font-size="25" font-weight="400" fill="#e5ebee">werden.</text><text x="64" y="657" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · ZORN VON KENARA</text><text x="64" y="691" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 7 (×2) · Bewegung 1 · Kapazität 3</text><text x="64" y="749" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="783" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz. Nachdem du in einem Raumkampf in diesem</text><text x="64" y="817" font-size="25" font-weight="400" fill="#e5ebee">System einen Würfel geworfen hast, darfst du 1 Handelsware</text><text x="64" y="851" font-size="25" font-weight="400" fill="#e5ebee">ausgeben, um sein Ergebnis um 1 zu erhöhen.</text><text x="64" y="909" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="943" font-size="25" font-weight="400" fill="#e5ebee">6</text><path d="M64 1011H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="1045" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="1076" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="64" y="1099" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
