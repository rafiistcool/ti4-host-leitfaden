<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1199" viewBox="0 0 1120 1199" role="img" aria-labelledby="title desc"><title id="title">Die Keleres des Rates — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1199" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1175" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Die Keleres des Rates</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">DIE TRIBUNE</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Beim Aufbau wählst du eine Fraktion, die nicht im Spiel ist, aus</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">Mentak, Xxcha und Silberschwingen. Du nimmst ihr</text><text x="64" y="381" font-size="25" font-weight="400" fill="#e5ebee">Heimat-System, ihre Kommando- und Kontrollmarker sowie den</text><text x="64" y="415" font-size="25" font-weight="400" fill="#e5ebee">passenden Keleres-Helden.</text><text x="64" y="473" font-size="18" font-weight="700" fill="#d9b46e">VOM RAT FINANZIERT</text><text x="64" y="507" font-size="25" font-weight="400" fill="#e5ebee">Zu Beginn der Strategiephase füllst du deine Massenprodukte</text><text x="64" y="541" font-size="25" font-weight="400" fill="#e5ebee">auf und erhältst danach 1 Handelsware.</text><text x="64" y="599" font-size="18" font-weight="700" fill="#d9b46e">ÜBER DEM GESETZ</text><text x="64" y="633" font-size="25" font-weight="400" fill="#e5ebee">Zu Beginn deines Zuges darfst du 1 Einfluss ausgeben. Bis zum</text><text x="64" y="667" font-size="25" font-weight="400" fill="#e5ebee">Ende deines Zuges gelten alle Gesetze als textlos.</text><text x="64" y="725" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · ARTEMIRIS</text><text x="64" y="759" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 7 (×2) · Bewegung 1 · Kapazität 6</text><text x="64" y="817" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="851" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz. Andere Spieler müssen 2 Einfluss ausgeben,</text><text x="64" y="885" font-size="25" font-weight="400" fill="#e5ebee">um das System dieses Schiffs zu aktivieren.</text><text x="64" y="943" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="977" font-size="25" font-weight="400" fill="#e5ebee">2</text><path d="M64 1045H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="1079" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="1110" font-size="17" fill="#b9c6d1">Codex III · optional</text><text x="64" y="1133" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
