<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="971" viewBox="0 0 1120 971" role="img" aria-labelledby="title desc"><title id="title">Der Clan der Zaar — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="971" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="947" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Der Clan der Zaar</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">RESTEVERWERTUNG</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Nachdem du die Kontrolle über einen Planeten übernommen hast,</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">erhältst du 1 Handelsware.</text><text x="64" y="405" font-size="18" font-weight="700" fill="#d9b46e">NOMADISCH</text><text x="64" y="439" font-size="25" font-weight="400" fill="#e5ebee">Du darfst Aufträge auch dann werten, wenn du die Planeten</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">deines Heimat-Systems nicht kontrollierst.</text><text x="64" y="531" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · SOHN VON RAGH</text><text x="64" y="565" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 5 (×2) · Bewegung 1 · Kapazität 3</text><text x="64" y="623" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="657" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz, Jägerabwehr 6 (×4).</text><text x="64" y="715" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="749" font-size="25" font-weight="400" fill="#e5ebee">3</text><path d="M64 817H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="851" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="882" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="64" y="905" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
