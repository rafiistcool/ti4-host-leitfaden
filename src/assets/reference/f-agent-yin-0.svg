<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1022" viewBox="0 0 680 1022" role="img" aria-labelledby="title desc"><title id="title">Bruder Milor — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1022" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="998" rx="18" fill="none" stroke="#8ebbbc" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#8ebbbc" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#8ebbbc">AGENT · DIE YIN-BRUDERSCHAFT</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Bruder Milor</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#8ebbbc" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#8ebbbc">KURZREFERENZ</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Nachdem ein Zerstörer oder</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">Kreuzer eines Spielers zerstört</text><text x="48" y="380" font-size="26" font-weight="400" fill="#e5ebee">wurde, darfst du die Karte</text><text x="48" y="416" font-size="26" font-weight="400" fill="#e5ebee">erschöpfen. Der Spieler darf dann</text><text x="48" y="452" font-size="26" font-weight="400" fill="#e5ebee">bis zu 2 Jäger aus seinem Nachschub</text><text x="48" y="488" font-size="26" font-weight="400" fill="#e5ebee">in das System dieser Einheit setzen.</text><text x="48" y="548" font-size="18" font-weight="700" fill="#8ebbbc">SPÄTERE FASSUNG · OPTIONAL</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">Codex III (Ω): Nachdem eine Einheit</text><text x="48" y="618" font-size="26" font-weight="400" fill="#e5ebee">eines Spielers zerstört wurde,</text><text x="48" y="654" font-size="26" font-weight="400" fill="#e5ebee">darfst du die Karte erschöpfen. War</text><text x="48" y="690" font-size="26" font-weight="400" fill="#e5ebee">es ein Schiff, darf der Spieler 2</text><text x="48" y="726" font-size="26" font-weight="400" fill="#e5ebee">Jäger in dieses System setzen, war</text><text x="48" y="762" font-size="26" font-weight="400" fill="#e5ebee">es eine Bodentruppe, 2 Infanterie</text><text x="48" y="798" font-size="26" font-weight="400" fill="#e5ebee">auf diesen Planeten.</text><path d="M48 868H632" stroke="#68798a" stroke-width="1"/><text x="48" y="902" font-size="18" font-weight="700" fill="#8ebbbc">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="933" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="956" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
