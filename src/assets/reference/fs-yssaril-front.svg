<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1131" viewBox="0 0 1120 1131" role="img" aria-labelledby="title desc"><title id="title">Die Yssaril-Stämme — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1131" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1107" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Die Yssaril-Stämme</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">VERZÖGERUNGSTAKTIK</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Materialaktion: Lege 1 Aktionskarte aus deiner Hand ab. So</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">verbrauchst du einen Zug, ohne zu passen.</text><text x="64" y="405" font-size="18" font-weight="700" fill="#d9b46e">INTRIGANT</text><text x="64" y="439" font-size="25" font-weight="400" fill="#e5ebee">Wenn du Aktionskarten ziehst, ziehst du 1 zusätzliche und legst</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">danach 1 Aktionskarte deiner Wahl aus deiner Hand ab.</text><text x="64" y="531" font-size="18" font-weight="700" fill="#d9b46e">GERISSEN</text><text x="64" y="565" font-size="25" font-weight="400" fill="#e5ebee">Du darfst beliebig viele Aktionskarten auf der Hand haben.</text><text x="64" y="599" font-size="25" font-weight="400" fill="#e5ebee">Spieleffekte können daran nichts ändern.</text><text x="64" y="657" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · Y&apos;SIA Y&apos;SSRILA</text><text x="64" y="691" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 5 (×2) · Bewegung 2 · Kapazität 3</text><text x="64" y="749" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="783" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz. Darf sich durch Systeme mit fremden</text><text x="64" y="817" font-size="25" font-weight="400" fill="#e5ebee">Schiffen hindurchbewegen.</text><text x="64" y="875" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="909" font-size="25" font-weight="400" fill="#e5ebee">3</text><path d="M64 977H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="1011" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="1042" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="64" y="1065" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
