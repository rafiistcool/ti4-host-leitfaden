<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1199" viewBox="0 0 1120 1199" role="img" aria-labelledby="title desc"><title id="title">Die Empyrier — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1199" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1175" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Die Empyrier</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">IN DER LEERE GEBOREN</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Nebel beeinflussen die Bewegung deiner Schiffe nicht.</text><text x="64" y="371" font-size="18" font-weight="700" fill="#d9b46e">ÄTHERPASSAGE</text><text x="64" y="405" font-size="25" font-weight="400" fill="#e5ebee">Nachdem ein Spieler ein System aktiviert hat, darfst du ihm</text><text x="64" y="439" font-size="25" font-weight="400" fill="#e5ebee">erlauben, seine Schiffe durch Systeme mit deinen Schiffen zu</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">bewegen.</text><text x="64" y="531" font-size="18" font-weight="700" fill="#d9b46e">DUNKLES FLÜSTERN</text><text x="64" y="565" font-size="25" font-weight="400" fill="#e5ebee">Beim Aufbau nimmst du die zusätzliche</text><text x="64" y="599" font-size="25" font-weight="400" fill="#e5ebee">Empyrier-Vertragskarte. Du hast also 2 fraktionsspezifische</text><text x="64" y="633" font-size="25" font-weight="400" fill="#e5ebee">Vertragskarten.</text><text x="64" y="691" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · DYNAMO</text><text x="64" y="725" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 5 (×2) · Bewegung 1 · Kapazität 3</text><text x="64" y="783" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="817" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz. Nutzt eine Einheit irgendeines Spielers in</text><text x="64" y="851" font-size="25" font-weight="400" fill="#e5ebee">diesem oder einem angrenzenden System Schadensresistenz,</text><text x="64" y="885" font-size="25" font-weight="400" fill="#e5ebee">darfst du danach 2 Einfluss ausgeben, um sie zu reparieren.</text><text x="64" y="943" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="977" font-size="25" font-weight="400" fill="#e5ebee">4</text><path d="M64 1045H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="1079" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="1110" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="64" y="1133" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
