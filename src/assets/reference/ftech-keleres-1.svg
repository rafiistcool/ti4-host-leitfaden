<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Agenten-Versorgungsnetz — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#e1c170" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#e1c170" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#e1c170">FRAKTIONSTECHNOLOGIE · KYBERNETIK</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Agenten-Versorgungsne</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">tz</text><text x="48" y="243" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M48 290H632" stroke="#e1c170" stroke-width="2"/><text x="48" y="326" font-size="18" font-weight="700" fill="#e1c170">VORAUSSETZUNGEN</text><text x="48" y="360" font-size="26" font-weight="400" fill="#e5ebee">2× Kybernetik</text><text x="48" y="420" font-size="18" font-weight="700" fill="#e1c170">KURZREFERENZ</text><text x="48" y="454" font-size="26" font-weight="400" fill="#e5ebee">Wenn du eine deiner</text><text x="48" y="490" font-size="26" font-weight="400" fill="#e5ebee">Produktion-Fähigkeiten abhandelst,</text><text x="48" y="526" font-size="26" font-weight="400" fill="#e5ebee">darfst du zusätzlich eine deiner</text><text x="48" y="562" font-size="26" font-weight="400" fill="#e5ebee">Produktion-Fähigkeiten in einem</text><text x="48" y="598" font-size="26" font-weight="400" fill="#e5ebee">beliebigen System abhandeln. Diese</text><text x="48" y="634" font-size="26" font-weight="400" fill="#e5ebee">zusätzliche Verwendung löst die</text><text x="48" y="670" font-size="26" font-weight="400" fill="#e5ebee">Technologie nicht erneut aus.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#e1c170">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Codex III · optional</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
