<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Dunkler Pakt / Blutpakt — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#c09cb2" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#c09cb2" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#c09cb2">VERTRAGSKARTE · DIE EMPYRIER</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Dunkler Pakt / Blutpakt</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 238H632" stroke="#c09cb2" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#c09cb2">KURZREFERENZ</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Zwei Vertragskarten, beide per</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">Materialaktion offen ausgelegt und</text><text x="48" y="380" font-size="26" font-weight="400" fill="#e5ebee">zurück an die Empyrier, sobald du ein</text><text x="48" y="416" font-size="26" font-weight="400" fill="#e5ebee">System mit Empyrier-Einheiten</text><text x="48" y="452" font-size="26" font-weight="400" fill="#e5ebee">aktivierst. Dunkler Pakt: Gibst du</text><text x="48" y="488" font-size="26" font-weight="400" fill="#e5ebee">den Empyriern so viele</text><text x="48" y="524" font-size="26" font-weight="400" fill="#e5ebee">Massenprodukte, wie dein Maximum</text><text x="48" y="560" font-size="26" font-weight="400" fill="#e5ebee">beträgt, erhaltet ihr beide 1</text><text x="48" y="596" font-size="26" font-weight="400" fill="#e5ebee">Handelsware. Blutpakt: Stimmt ihr</text><text x="48" y="632" font-size="26" font-weight="400" fill="#e5ebee">beide für dasselbe Ergebnis, kommen</text><text x="48" y="668" font-size="26" font-weight="400" fill="#e5ebee">4 Stimmen dafür hinzu.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#c09cb2">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
