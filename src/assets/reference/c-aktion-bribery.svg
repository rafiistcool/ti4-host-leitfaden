<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Bestechung — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#dc8f78" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#dc8f78" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#dc8f78">AKTIONSKARTE</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Bestechung</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#dc8f78" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#dc8f78">WANN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Nachdem der Sprecher abgestimmt</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">hat</text><text x="48" y="404" font-size="18" font-weight="700" fill="#dc8f78">KURZREFERENZ</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Gib beliebig viele Handelswaren aus</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">und gib pro Handelsware 1</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">zusätzliche Stimme für die</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">Alternative ab, für die du gestimmt</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">hast. Auch spielbar, wenn der</text><text x="48" y="618" font-size="26" font-weight="400" fill="#e5ebee">Sprecher selbst nicht abstimmt.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#dc8f78">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
