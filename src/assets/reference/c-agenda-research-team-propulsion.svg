<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1060" viewBox="0 0 680 1060" role="img" aria-labelledby="title desc"><title id="title">Forschungsteam: Antriebstechnik — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1060" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1036" rx="18" fill="none" stroke="#7cacd0" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#7cacd0" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#7cacd0">AGENDA · GESETZ</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Forschungsteam:</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">Antriebstechnik</text><text x="48" y="243" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 290H632" stroke="#7cacd0" stroke-width="2"/><text x="48" y="326" font-size="18" font-weight="700" fill="#7cacd0">WAHL</text><text x="48" y="360" font-size="26" font-weight="400" fill="#e5ebee">industrieller Planet</text><text x="48" y="420" font-size="18" font-weight="700" fill="#7cacd0">ERGEBNIS</text><text x="48" y="454" font-size="26" font-weight="400" fill="#e5ebee">Die Karte wird an den gewählten</text><text x="48" y="490" font-size="26" font-weight="400" fill="#e5ebee">Planeten angelegt. Erforscht</text><text x="48" y="526" font-size="26" font-weight="400" fill="#e5ebee">dessen Besitzer eine Technologie,</text><text x="48" y="562" font-size="26" font-weight="400" fill="#e5ebee">darf er die Karte erschöpfen, um 1</text><text x="48" y="598" font-size="26" font-weight="400" fill="#e5ebee">blaue Voraussetzung</text><text x="48" y="634" font-size="26" font-weight="400" fill="#e5ebee">(Antriebstechnik) zu ignorieren.</text><text x="48" y="670" font-size="26" font-weight="400" fill="#e5ebee">Der Planet selbst bleibt dabei</text><text x="48" y="706" font-size="26" font-weight="400" fill="#e5ebee">spielbereit.</text><text x="48" y="766" font-size="18" font-weight="700" fill="#7cacd0">MIT POK</text><text x="48" y="800" font-size="26" font-weight="400" fill="#e5ebee">Diese Agenda wird aus dem Stapel</text><text x="48" y="836" font-size="26" font-weight="400" fill="#e5ebee">entfernt.</text><path d="M48 906H632" stroke="#68798a" stroke-width="1"/><text x="48" y="940" font-size="18" font-weight="700" fill="#7cacd0">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="971" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="994" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
