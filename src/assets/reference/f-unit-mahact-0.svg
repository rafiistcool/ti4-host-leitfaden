<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1138" viewBox="0 0 680 1138" role="img" aria-labelledby="title desc"><title id="title">Purpurlegionär I — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1138" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1114" rx="18" fill="none" stroke="#a7b4c6" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#a7b4c6" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#a7b4c6">SONDEREINHEIT · DIE MAHACTANISCHEN GEN-HEXER</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Purpurlegionär I</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 238H632" stroke="#a7b4c6" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#a7b4c6">EINHEITENWERTE</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Kosten 1 (×2) · Kampf 8 · Bewegung</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">– · Kapazität –</text><text x="48" y="404" font-size="18" font-weight="700" fill="#a7b4c6">KURZREFERENZ</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Wird die Einheit zerstört, erhältst</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">du 1 Massenprodukt oder wandelst 1</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">deiner Massenprodukte in eine</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">Handelsware um.</text><text x="48" y="606" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · PURPURLEGIONÄR II</text><text x="48" y="640" font-size="26" font-weight="400" fill="#e5ebee">Kosten 1 (×2) · Kampf 7 · Bewegung</text><text x="48" y="676" font-size="26" font-weight="400" fill="#e5ebee">– · Kapazität –</text><text x="48" y="736" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · KURZREFERENZ</text><text x="48" y="770" font-size="26" font-weight="400" fill="#e5ebee">Wie Stufe I. Zusätzlich kommt die</text><text x="48" y="806" font-size="26" font-weight="400" fill="#e5ebee">zerstörte Einheit auf diese Karte</text><text x="48" y="842" font-size="26" font-weight="400" fill="#e5ebee">und zu Beginn deines nächsten Zuges</text><text x="48" y="878" font-size="26" font-weight="400" fill="#e5ebee">auf einen eigenen Planeten in deinem</text><text x="48" y="914" font-size="26" font-weight="400" fill="#e5ebee">Heimat-System.</text><path d="M48 984H632" stroke="#68798a" stroke-width="1"/><text x="48" y="1018" font-size="18" font-weight="700" fill="#a7b4c6">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="1049" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="1072" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
