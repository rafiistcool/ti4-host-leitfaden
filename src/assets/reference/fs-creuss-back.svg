<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="937" viewBox="0 0 1120 937" role="img" aria-labelledby="title desc"><title id="title">Die Geister von Creuss — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="937" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="913" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · RÜCKSEITE UND START</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Die Geister von Creuss</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">HEIMAT-SYSTEM</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Creuss: 4 Ressourcen · 2 Einfluss</text><text x="64" y="371" font-size="18" font-weight="700" fill="#d9b46e">STARTEINHEITEN</text><text x="64" y="405" font-size="25" font-weight="400" fill="#e5ebee">1 Träger, 2 Zerstörer, 2 Jäger, 4 Infanterie, 1 Raumwerft</text><text x="64" y="463" font-size="18" font-weight="700" fill="#d9b46e">STARTTECHNOLOGIEN</text><text x="64" y="497" font-size="25" font-weight="400" fill="#e5ebee">Gravitationsantrieb</text><text x="64" y="555" font-size="18" font-weight="700" fill="#d9b46e">KOMMANDOMARKER ZUM SPIELBEGINN</text><text x="64" y="589" font-size="25" font-weight="400" fill="#e5ebee">3 im Taktikpool · 3 im Flottenpool · 2 im Strategiepool</text><text x="64" y="647" font-size="18" font-weight="700" fill="#d9b46e">TOR VON CREUSS</text><text x="64" y="681" font-size="25" font-weight="400" fill="#e5ebee">Systemtafel 17 liegt in der Galaxie. Das Heimat-System liegt</text><text x="64" y="715" font-size="25" font-weight="400" fill="#e5ebee">neben dem Spielplan.</text><path d="M64 783H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="817" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="848" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="64" y="871" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
