<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1233" viewBox="0 0 1120 1233" role="img" aria-labelledby="title desc"><title id="title">Das Nekro-Virus — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1233" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1209" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Das Nekro-Virus</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">GALAKTISCHE BEDROHUNG</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Du darfst nicht über Agenden abstimmen. Einmal pro</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">Agendaphase darfst du nach dem Aufdecken einer Agenda eine</text><text x="64" y="381" font-size="25" font-weight="400" fill="#e5ebee">Prognose zum Ergebnis abgeben und erhältst bei einem Treffer 1</text><text x="64" y="415" font-size="25" font-weight="400" fill="#e5ebee">Technologie eines Spielers, der so abgestimmt hat.</text><text x="64" y="473" font-size="18" font-weight="700" fill="#d9b46e">TECHNOLOGISCHE SINGULARITÄT</text><text x="64" y="507" font-size="25" font-weight="400" fill="#e5ebee">Einmal pro Kampf darfst du, nachdem eine gegnerische Einheit</text><text x="64" y="541" font-size="25" font-weight="400" fill="#e5ebee">zerstört wurde, 1 Technologie dieses Gegners erhalten.</text><text x="64" y="599" font-size="18" font-weight="700" fill="#d9b46e">AUSBREITUNG</text><text x="64" y="633" font-size="25" font-weight="400" fill="#e5ebee">Du kannst keine Technologien erforschen. Wann immer du</text><text x="64" y="667" font-size="25" font-weight="400" fill="#e5ebee">forschen würdest, erhältst du stattdessen 3 Kommandomarker.</text><text x="64" y="725" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · ALASTOR</text><text x="64" y="759" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 9 (×2) · Bewegung 1 · Kapazität 3</text><text x="64" y="817" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="851" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz. Zu Beginn eines Raumkampfs wählst du</text><text x="64" y="885" font-size="25" font-weight="400" fill="#e5ebee">beliebig viele deiner Bodentruppen in diesem System, die wie</text><text x="64" y="919" font-size="25" font-weight="400" fill="#e5ebee">Schiffe am Kampf teilnehmen.</text><text x="64" y="977" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="1011" font-size="25" font-weight="400" fill="#e5ebee">3</text><path d="M64 1079H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="1113" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="1144" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="64" y="1167" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
