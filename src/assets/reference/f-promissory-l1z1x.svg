<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1074" viewBox="0 0 680 1074" role="img" aria-labelledby="title desc"><title id="title">Kybernetische Implantate — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1074" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1050" rx="18" fill="none" stroke="#c09cb2" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#c09cb2" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#c09cb2">VERTRAGSKARTE · DAS L1Z1X-GEDANKENNETZ</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Kybernetische</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">Implantate</text><text x="48" y="243" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 290H632" stroke="#c09cb2" stroke-width="2"/><text x="48" y="326" font-size="18" font-weight="700" fill="#c09cb2">KURZREFERENZ</text><text x="48" y="360" font-size="26" font-weight="400" fill="#e5ebee">Zu Beginn deines Zuges legst du 1</text><text x="48" y="396" font-size="26" font-weight="400" fill="#e5ebee">Marker aus dem Strategiepool des</text><text x="48" y="432" font-size="26" font-weight="400" fill="#e5ebee">L1Z1X-Spielers in dessen Nachschub</text><text x="48" y="468" font-size="26" font-weight="400" fill="#e5ebee">zurück und legst anschließend 1</text><text x="48" y="504" font-size="26" font-weight="400" fill="#e5ebee">Kommandomarker aus deinem</text><text x="48" y="540" font-size="26" font-weight="400" fill="#e5ebee">Nachschub in deinen Strategiepool.</text><text x="48" y="576" font-size="26" font-weight="400" fill="#e5ebee">Danach geht die Karte an den</text><text x="48" y="612" font-size="26" font-weight="400" fill="#e5ebee">L1Z1X-Spieler zurück.</text><text x="48" y="672" font-size="18" font-weight="700" fill="#c09cb2">SPÄTERE FASSUNG · OPTIONAL</text><text x="48" y="706" font-size="26" font-weight="400" fill="#e5ebee">Codex I (Ω): Wenn du in der</text><text x="48" y="742" font-size="26" font-weight="400" fill="#e5ebee">Statusphase Kommandomarker</text><text x="48" y="778" font-size="26" font-weight="400" fill="#e5ebee">erhältst, bekommst du 1</text><text x="48" y="814" font-size="26" font-weight="400" fill="#e5ebee">zusätzlichen. Danach geht die Karte</text><text x="48" y="850" font-size="26" font-weight="400" fill="#e5ebee">an den L1Z1X-Spieler zurück.</text><path d="M48 920H632" stroke="#68798a" stroke-width="1"/><text x="48" y="954" font-size="18" font-weight="700" fill="#c09cb2">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="985" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="1008" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
