<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1368" viewBox="0 0 680 1368" role="img" aria-labelledby="title desc"><title id="title">Magen-Abwehrschirm — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1368" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1344" rx="18" fill="none" stroke="#db827b" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#db827b" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#db827b">KRIEGSFÜHRUNG</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Magen-Abwehrschirm</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#db827b" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#db827b">VORAUSSETZUNGEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">1× Kriegsführung</text><text x="48" y="368" font-size="18" font-weight="700" fill="#db827b">KURZREFERENZ</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Zu Beginn einer Bodenkampfrunde</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">auf einem Planeten mit mindestens 1</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">deiner Einheiten mit Planetarem</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">Schild darfst du die Karte</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">erschöpfen. Dein Gegner würfelt in</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">dieser Runde nicht.</text><text x="48" y="642" font-size="18" font-weight="700" fill="#db827b">SPÄTERE FASSUNG · OPTIONAL</text><text x="48" y="676" font-size="26" font-weight="400" fill="#e5ebee">Codex I (Ω): Zu Beginn eines</text><text x="48" y="712" font-size="26" font-weight="400" fill="#e5ebee">Bodenkampfs auf einem Planeten mit</text><text x="48" y="748" font-size="26" font-weight="400" fill="#e5ebee">mindestens 1 deiner Gebäude darfst</text><text x="48" y="784" font-size="26" font-weight="400" fill="#e5ebee">du 1 Treffer erzeugen und einer</text><text x="48" y="820" font-size="26" font-weight="400" fill="#e5ebee">gegnerischen Bodentruppe zuweisen.</text><text x="48" y="856" font-size="26" font-weight="400" fill="#e5ebee">Codex 4.5 (ΩΩ, englischer Download):</text><text x="48" y="892" font-size="26" font-weight="400" fill="#e5ebee">Bei diesem Kampfbeginn erzeugst du</text><text x="48" y="928" font-size="26" font-weight="400" fill="#e5ebee">1 Treffer und weist ihn einer</text><text x="48" y="964" font-size="26" font-weight="400" fill="#e5ebee">gegnerischen Bodentruppe zu.</text><text x="48" y="1000" font-size="26" font-weight="400" fill="#e5ebee">Zusätzlich setzt du 1 Infanterie aus</text><text x="48" y="1036" font-size="26" font-weight="400" fill="#e5ebee">deinem Nachschub zu jedem deiner</text><text x="48" y="1072" font-size="26" font-weight="400" fill="#e5ebee">Gebäude, sobald irgendein Spieler ein</text><text x="48" y="1108" font-size="26" font-weight="400" fill="#e5ebee">System mit deinen Gebäuden</text><text x="48" y="1144" font-size="26" font-weight="400" fill="#e5ebee">aktiviert.</text><path d="M48 1214H632" stroke="#68798a" stroke-width="1"/><text x="48" y="1248" font-size="18" font-weight="700" fill="#db827b">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="1279" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="1302" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
