<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1246" viewBox="0 0 680 1246" role="img" aria-labelledby="title desc"><title id="title">Hel-Titan I — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1246" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1222" rx="18" fill="none" stroke="#a7b4c6" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#a7b4c6" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#a7b4c6">SONDEREINHEIT · DIE TITANEN DES UL</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Hel-Titan I</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 238H632" stroke="#a7b4c6" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#a7b4c6">EINHEITENWERTE</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Kosten – · Kampf 7 · Bewegung – ·</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">Kapazität –</text><text x="48" y="404" font-size="18" font-weight="700" fill="#a7b4c6">KURZREFERENZ</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Planetarer Schild, Weltraumkanone</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">6, Schadensresistenz, Produktion 1.</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">Gilt als Gebäude und als Bodentruppe</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">und kann nicht transportiert</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">werden.</text><text x="48" y="642" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · HEL-TITAN II</text><text x="48" y="676" font-size="26" font-weight="400" fill="#e5ebee">Kosten – · Kampf 6 · Bewegung – ·</text><text x="48" y="712" font-size="26" font-weight="400" fill="#e5ebee">Kapazität –</text><text x="48" y="772" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · KURZREFERENZ</text><text x="48" y="806" font-size="26" font-weight="400" fill="#e5ebee">Planetarer Schild, Weltraumkanone</text><text x="48" y="842" font-size="26" font-weight="400" fill="#e5ebee">5, Schadensresistenz, Produktion 1.</text><text x="48" y="878" font-size="26" font-weight="400" fill="#e5ebee">Gebäude und Bodentruppe zugleich,</text><text x="48" y="914" font-size="26" font-weight="400" fill="#e5ebee">nicht transportierbar. Die</text><text x="48" y="950" font-size="26" font-weight="400" fill="#e5ebee">Weltraumkanone darf auch auf</text><text x="48" y="986" font-size="26" font-weight="400" fill="#e5ebee">Schiffe in angrenzenden Systemen</text><text x="48" y="1022" font-size="26" font-weight="400" fill="#e5ebee">feuern.</text><path d="M48 1092H632" stroke="#68798a" stroke-width="1"/><text x="48" y="1126" font-size="18" font-weight="700" fill="#a7b4c6">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="1157" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="1180" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
