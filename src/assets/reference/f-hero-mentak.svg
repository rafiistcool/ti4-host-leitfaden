<svg xmlns="http://www.w3.org/2000/svg" width="680" height="946" viewBox="0 0 680 946" role="img" aria-labelledby="title desc"><title id="title">Ipswitch, unberechenbarer Draufgänger — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="946" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="922" rx="18" fill="none" stroke="#8ebbbc" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#8ebbbc" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#8ebbbc">HELD · DIE MENTAK-KOALITION</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Ipswitch,</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">unberechenbarer</text><text x="48" y="233" font-size="38" font-weight="700" fill="#f6f3ea">Draufgänger</text><text x="48" y="295" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 342H632" stroke="#8ebbbc" stroke-width="2"/><text x="48" y="378" font-size="18" font-weight="700" fill="#8ebbbc">FREISCHALTEN</text><text x="48" y="412" font-size="26" font-weight="400" fill="#e5ebee">3 gewertete Aufträge.</text><text x="48" y="472" font-size="18" font-weight="700" fill="#8ebbbc">KURZREFERENZ</text><text x="48" y="506" font-size="26" font-weight="400" fill="#e5ebee">Zu Beginn eines Raumkampfs mit</text><text x="48" y="542" font-size="26" font-weight="400" fill="#e5ebee">deiner Beteiligung darfst du die</text><text x="48" y="578" font-size="26" font-weight="400" fill="#e5ebee">Karte vernichten. Für jedes fremde</text><text x="48" y="614" font-size="26" font-weight="400" fill="#e5ebee">Schiff, das in diesem Kampf</text><text x="48" y="650" font-size="26" font-weight="400" fill="#e5ebee">zerstört wird, setzt du dann 1</text><text x="48" y="686" font-size="26" font-weight="400" fill="#e5ebee">Schiff desselben Typs aus deinem</text><text x="48" y="722" font-size="26" font-weight="400" fill="#e5ebee">Nachschub ins aktive System.</text><path d="M48 792H632" stroke="#68798a" stroke-width="1"/><text x="48" y="826" font-size="18" font-weight="700" fill="#8ebbbc">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="857" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="880" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
