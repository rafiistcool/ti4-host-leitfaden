<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1107" viewBox="0 0 1120 1107" role="img" aria-labelledby="title desc"><title id="title">Das L1Z1X-Gedankennetz — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1107" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1083" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Das L1Z1X-Gedankennetz</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">ASSIMILIEREN</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Übernimmst du die Kontrolle über einen Planeten, ersetzt du alle</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">PVS und Raumwerften dort durch gleichartige Einheiten aus</text><text x="64" y="381" font-size="25" font-weight="400" fill="#e5ebee">deinem Nachschub.</text><text x="64" y="439" font-size="18" font-weight="700" fill="#d9b46e">GEISSEL</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">Am Ende jeder Bodenkampfrunde dürfen deine Schiffe im</text><text x="64" y="507" font-size="25" font-weight="400" fill="#e5ebee">aktiven System ihr Bombardement gegen die gegnerischen</text><text x="64" y="541" font-size="25" font-weight="400" fill="#e5ebee">Bodentruppen auf dem Planeten einsetzen.</text><text x="64" y="599" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · [0.0.1]</text><text x="64" y="633" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 5 (×2) · Bewegung 1 · Kapazität 5</text><text x="64" y="691" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="725" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz. Im Raumkampf müssen Treffer dieses</text><text x="64" y="759" font-size="25" font-weight="400" fill="#e5ebee">Schiffs und deiner Schlachtschiffe in diesem System nach</text><text x="64" y="793" font-size="25" font-weight="400" fill="#e5ebee">Möglichkeit Nicht-Jäger-Schiffen zugewiesen werden.</text><text x="64" y="851" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="885" font-size="25" font-weight="400" fill="#e5ebee">2</text><path d="M64 953H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="987" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="1018" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="64" y="1041" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
