<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1074" viewBox="0 0 680 1074" role="img" aria-labelledby="title desc"><title id="title">Zuschuss für die Kriegskasse — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1074" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1050" rx="18" fill="none" stroke="#c09cb2" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#c09cb2" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#c09cb2">VERTRAGSKARTE · DAS BARONAT VON LETNEV</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Zuschuss für die</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">Kriegskasse</text><text x="48" y="243" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 290H632" stroke="#c09cb2" stroke-width="2"/><text x="48" y="326" font-size="18" font-weight="700" fill="#c09cb2">KURZREFERENZ</text><text x="48" y="360" font-size="26" font-weight="400" fill="#e5ebee">Zu Beginn einer Raumkampfrunde</text><text x="48" y="396" font-size="26" font-weight="400" fill="#e5ebee">verliert der Letnev-Spieler 2</text><text x="48" y="432" font-size="26" font-weight="400" fill="#e5ebee">Handelswaren. Während dieser</text><text x="48" y="468" font-size="26" font-weight="400" fill="#e5ebee">Kampfrunde darfst du beliebig viele</text><text x="48" y="504" font-size="26" font-weight="400" fill="#e5ebee">deiner Würfel erneut werfen.</text><text x="48" y="540" font-size="26" font-weight="400" fill="#e5ebee">Danach geht die Karte an den</text><text x="48" y="576" font-size="26" font-weight="400" fill="#e5ebee">Letnev-Spieler zurück.</text><text x="48" y="636" font-size="18" font-weight="700" fill="#c09cb2">SPÄTERE FASSUNG · OPTIONAL</text><text x="48" y="670" font-size="26" font-weight="400" fill="#e5ebee">Codex I (Ω): Nachdem du und dein</text><text x="48" y="706" font-size="26" font-weight="400" fill="#e5ebee">Gegner im Raumkampf gewürfelt</text><text x="48" y="742" font-size="26" font-weight="400" fill="#e5ebee">habt, darfst du alle Würfel des</text><text x="48" y="778" font-size="26" font-weight="400" fill="#e5ebee">Gegners und beliebige eigene Würfel</text><text x="48" y="814" font-size="26" font-weight="400" fill="#e5ebee">erneut werfen. Danach geht die</text><text x="48" y="850" font-size="26" font-weight="400" fill="#e5ebee">Karte an den Letnev-Spieler zurück.</text><path d="M48 920H632" stroke="#68798a" stroke-width="1"/><text x="48" y="954" font-size="18" font-weight="700" fill="#c09cb2">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="985" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="1008" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
