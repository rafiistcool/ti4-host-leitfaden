<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1224" viewBox="0 0 680 1224" role="img" aria-labelledby="title desc"><title id="title">Bruder Omar — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1224" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1200" rx="18" fill="none" stroke="#8ebbbc" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#8ebbbc" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#8ebbbc">KOMMANDEUR · DIE YIN-BRUDERSCHAFT</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Bruder Omar</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#8ebbbc" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#8ebbbc">FREISCHALTEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Die Fraktionsfähigkeit</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">Indoktrination nutzen.</text><text x="48" y="404" font-size="18" font-weight="700" fill="#8ebbbc">KURZREFERENZ</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Die Karte erfüllt eine grüne</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">Technologie-Voraussetzung. Wenn</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">du produzierst, darfst du 1</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">zusätzliche Infanterie zu ihren</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">normalen Kosten produzieren, die</text><text x="48" y="618" font-size="26" font-weight="400" fill="#e5ebee">nicht gegen dein Produktionslimit</text><text x="48" y="654" font-size="26" font-weight="400" fill="#e5ebee">zählt.</text><text x="48" y="714" font-size="18" font-weight="700" fill="#8ebbbc">SPÄTERE FASSUNG · OPTIONAL</text><text x="48" y="748" font-size="26" font-weight="400" fill="#e5ebee">Codex III (Ω): Freischalten durch</text><text x="48" y="784" font-size="26" font-weight="400" fill="#e5ebee">eine beliebige Fraktionsfähigkeit.</text><text x="48" y="820" font-size="26" font-weight="400" fill="#e5ebee">Erfüllt weiter eine grüne</text><text x="48" y="856" font-size="26" font-weight="400" fill="#e5ebee">Voraussetzung, und erforschst du</text><text x="48" y="892" font-size="26" font-weight="400" fill="#e5ebee">eine Technologie, die ein anderer</text><text x="48" y="928" font-size="26" font-weight="400" fill="#e5ebee">Spieler besitzt, darfst du 1</text><text x="48" y="964" font-size="26" font-weight="400" fill="#e5ebee">Infanterie zurücklegen, um ihre</text><text x="48" y="1000" font-size="26" font-weight="400" fill="#e5ebee">Voraussetzungen zu ignorieren.</text><path d="M48 1070H632" stroke="#68798a" stroke-width="1"/><text x="48" y="1104" font-size="18" font-weight="700" fill="#8ebbbc">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="1135" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="1158" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
