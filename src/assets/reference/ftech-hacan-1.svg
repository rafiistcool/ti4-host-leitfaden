<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Produktionsbiome — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#75b583" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#75b583" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#75b583">FRAKTIONSTECHNOLOGIE · BIOTECHNIK</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Produktionsbiome</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 238H632" stroke="#75b583" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#75b583">VORAUSSETZUNGEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">2× Biotechnik</text><text x="48" y="368" font-size="18" font-weight="700" fill="#75b583">KURZREFERENZ</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Materialaktion: Erschöpfe die Karte</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">und gib 1 Marker aus deinem</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">Strategiepool aus. Du erhältst 4</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">Handelswaren und ein anderer</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">Spieler deiner Wahl 2.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#75b583">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
