<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1030" viewBox="0 0 680 1030" role="img" aria-labelledby="title desc"><title id="title">Kriegssonne — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1030" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1006" rx="18" fill="none" stroke="#abb3c1" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#abb3c1" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#abb3c1">EINHEITEN-AUFWERTUNG</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Kriegssonne</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#abb3c1" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#abb3c1">VORAUSSETZUNGEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">1× Kybernetik · 3× Kriegsführung</text><text x="48" y="368" font-size="18" font-weight="700" fill="#abb3c1">EINHEITENWERTE</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Kosten 12 · Kampf 3 (x3) ·</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Bewegung 2 · Kapazität 6</text><text x="48" y="498" font-size="18" font-weight="700" fill="#abb3c1">EINHEITENFÄHIGKEITEN</text><text x="48" y="532" font-size="26" font-weight="400" fill="#e5ebee">Schadensresistenz, Bombardement 3</text><text x="48" y="568" font-size="26" font-weight="400" fill="#e5ebee">(x3)</text><text x="48" y="628" font-size="18" font-weight="700" fill="#abb3c1">KURZREFERENZ</text><text x="48" y="662" font-size="26" font-weight="400" fill="#e5ebee">Schaltet die Kriegssonne frei, die du</text><text x="48" y="698" font-size="26" font-weight="400" fill="#e5ebee">ohne diese Technologie nicht</text><text x="48" y="734" font-size="26" font-weight="400" fill="#e5ebee">produzieren darfst. Einheiten</text><text x="48" y="770" font-size="26" font-weight="400" fill="#e5ebee">anderer Spieler in ihrem System</text><text x="48" y="806" font-size="26" font-weight="400" fill="#e5ebee">verlieren Planetarer Schild.</text><path d="M48 876H632" stroke="#68798a" stroke-width="1"/><text x="48" y="910" font-size="18" font-weight="700" fill="#abb3c1">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="941" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="964" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
