<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Entschädigte Abrüstung — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#7cacd0" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#7cacd0" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#7cacd0">AGENDA · VERORDNUNG</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Entschädigte Abrüstung</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 238H632" stroke="#7cacd0" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#7cacd0">WAHL</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Planet</text><text x="48" y="368" font-size="18" font-weight="700" fill="#7cacd0">ERGEBNIS</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Alle Bodentruppen auf dem</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">gewählten Planeten werden</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">zerstört. Der Spieler, der ihn</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">kontrolliert, erhält 1 Handelsware</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">pro zerstörter Einheit.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#7cacd0">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
