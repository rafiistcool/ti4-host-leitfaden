<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Rückeroberer — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#a7b4c6" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#a7b4c6" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#a7b4c6">MECH · DIE WINNU</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Rückeroberer</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 238H632" stroke="#a7b4c6" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#a7b4c6">EINHEITENWERTE</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Kosten 2 · Kampf 6</text><text x="48" y="368" font-size="18" font-weight="700" fill="#a7b4c6">KURZREFERENZ</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Schadensresistenz. Nachdem du eine</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Taktikaktion abgehandelt hast, in</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">der du die Kontrolle über diesen</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">Planeten übernommen hast, darfst</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">du 1 PVS oder 1 Raumwerft aus</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">deinem Nachschub darauf setzen.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#a7b4c6">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
