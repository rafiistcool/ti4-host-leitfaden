<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1030" viewBox="0 0 680 1030" role="img" aria-labelledby="title desc"><title id="title">Super-Schlachtschiff I — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1030" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1006" rx="18" fill="none" stroke="#a7b4c6" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#a7b4c6" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#a7b4c6">SONDEREINHEIT · DAS L1Z1X-GEDANKENNETZ</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Super-Schlachtschiff I</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 238H632" stroke="#a7b4c6" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#a7b4c6">EINHEITENWERTE</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Kosten 4 · Kampf 5 · Bewegung 1 ·</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">Kapazität 2</text><text x="48" y="404" font-size="18" font-weight="700" fill="#a7b4c6">KURZREFERENZ</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Schadensresistenz, Bombardement</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">5.</text><text x="48" y="534" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · SUPER-SCHLACHTSCHIFF II</text><text x="48" y="568" font-size="26" font-weight="400" fill="#e5ebee">Kosten 4 · Kampf 4 · Bewegung 2 ·</text><text x="48" y="604" font-size="26" font-weight="400" fill="#e5ebee">Kapazität 2</text><text x="48" y="664" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · KURZREFERENZ</text><text x="48" y="698" font-size="26" font-weight="400" fill="#e5ebee">Schadensresistenz, Bombardement</text><text x="48" y="734" font-size="26" font-weight="400" fill="#e5ebee">4. Kann nicht durch die Aktionskarte</text><text x="48" y="770" font-size="26" font-weight="400" fill="#e5ebee">„Direkter Treffer“ zerstört</text><text x="48" y="806" font-size="26" font-weight="400" fill="#e5ebee">werden.</text><path d="M48 876H632" stroke="#68798a" stroke-width="1"/><text x="48" y="910" font-size="18" font-weight="700" fill="#a7b4c6">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="941" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="964" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
