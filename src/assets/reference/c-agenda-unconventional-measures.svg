<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Unkonventionelle Maßnahmen — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#7cacd0" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#7cacd0" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#7cacd0">AGENDA · VERORDNUNG</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Unkonventionelle</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">Maßnahmen</text><text x="48" y="243" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 290H632" stroke="#7cacd0" stroke-width="2"/><text x="48" y="326" font-size="18" font-weight="700" fill="#7cacd0">DAFÜR</text><text x="48" y="360" font-size="26" font-weight="400" fill="#e5ebee">Wer mit „Dafür“ gestimmt hat,</text><text x="48" y="396" font-size="26" font-weight="400" fill="#e5ebee">zieht 2 Aktionskarten.</text><text x="48" y="456" font-size="18" font-weight="700" fill="#7cacd0">DAGEGEN</text><text x="48" y="490" font-size="26" font-weight="400" fill="#e5ebee">Wer mit „Dafür“ gestimmt hat, legt</text><text x="48" y="526" font-size="26" font-weight="400" fill="#e5ebee">alle seine Aktionskarten ab.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#7cacd0">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
