<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1039" viewBox="0 0 1120 1039" role="img" aria-labelledby="title desc"><title id="title">Der Nomade — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1039" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1015" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Der Nomade</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">DIE FIRMA</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Beim Aufbau legst du die 2 zusätzlichen Nomaden-Agenten neben</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">deinen Fraktionsbogen. Du hast also 3 Agenten.</text><text x="64" y="405" font-size="18" font-weight="700" fill="#d9b46e">ZUKUNFTSBLICK</text><text x="64" y="439" font-size="25" font-weight="400" fill="#e5ebee">Nachdem in der Agendaphase ein Ergebnis abgehandelt wurde,</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">für das du gestimmt oder das du prognostiziert hast, erhältst</text><text x="64" y="507" font-size="25" font-weight="400" fill="#e5ebee">du 1 Handelsware.</text><text x="64" y="565" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · MEMORIA I</text><text x="64" y="599" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 7 (×2) · Bewegung 1 · Kapazität 3</text><text x="64" y="657" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="691" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz, Jägerabwehr 8 (×3). Gilt als angrenzend an</text><text x="64" y="725" font-size="25" font-weight="400" fill="#e5ebee">alle Systeme mit mindestens 1 deiner Mechs.</text><text x="64" y="783" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="817" font-size="25" font-weight="400" fill="#e5ebee">4</text><path d="M64 885H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="919" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="950" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="64" y="973" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
