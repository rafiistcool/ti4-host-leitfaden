<svg xmlns="http://www.w3.org/2000/svg" width="680" height="966" viewBox="0 0 680 966" role="img" aria-labelledby="title desc"><title id="title">Eidolon / Z-Gravitations-Eidolon — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="966" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="942" rx="18" fill="none" stroke="#a7b4c6" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#a7b4c6" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#a7b4c6">MECH · DIE NAAZ-ROKHA-ALLIANZ</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Eidolon /</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">Z-Gravitations-Eidolon</text><text x="48" y="243" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 290H632" stroke="#a7b4c6" stroke-width="2"/><text x="48" y="326" font-size="18" font-weight="700" fill="#a7b4c6">EINHEITENWERTE</text><text x="48" y="360" font-size="26" font-weight="400" fill="#e5ebee">Kosten 2 · Kampf 6 (×2)</text><text x="48" y="420" font-size="18" font-weight="700" fill="#a7b4c6">KURZREFERENZ</text><text x="48" y="454" font-size="26" font-weight="400" fill="#e5ebee">Eidolon: Schadensresistenz. Steht</text><text x="48" y="490" font-size="26" font-weight="400" fill="#e5ebee">er zu Beginn eines Raumkampfs im</text><text x="48" y="526" font-size="26" font-weight="400" fill="#e5ebee">Weltraumbereich des aktiven</text><text x="48" y="562" font-size="26" font-weight="400" fill="#e5ebee">Systems, wird die Karte umgedreht.</text><text x="48" y="598" font-size="26" font-weight="400" fill="#e5ebee">Z-Grav Eidolon: Kampf 8 (×2), gilt im</text><text x="48" y="634" font-size="26" font-weight="400" fill="#e5ebee">Weltraumbereich des aktiven</text><text x="48" y="670" font-size="26" font-weight="400" fill="#e5ebee">Systems auch als Schiff und wird am</text><text x="48" y="706" font-size="26" font-weight="400" fill="#e5ebee">Ende des Raumkampfs</text><text x="48" y="742" font-size="26" font-weight="400" fill="#e5ebee">zurückgedreht.</text><path d="M48 812H632" stroke="#68798a" stroke-width="1"/><text x="48" y="846" font-size="18" font-weight="700" fill="#a7b4c6">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="877" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="900" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
