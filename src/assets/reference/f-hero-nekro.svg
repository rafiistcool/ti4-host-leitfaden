<svg xmlns="http://www.w3.org/2000/svg" width="680" height="950" viewBox="0 0 680 950" role="img" aria-labelledby="title desc"><title id="title">UNIT.DSGN.FLAYESH — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="950" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="926" rx="18" fill="none" stroke="#8ebbbc" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#8ebbbc" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#8ebbbc">HELD · DAS NEKRO-VIRUS</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">UNIT.DSGN.FLAYESH</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Eigenname unverändert</text><path d="M48 238H632" stroke="#8ebbbc" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#8ebbbc">FREISCHALTEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">3 gewertete Aufträge.</text><text x="48" y="368" font-size="18" font-weight="700" fill="#8ebbbc">KURZREFERENZ</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Materialaktion: Zerstöre alle</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">fremden Einheiten auf einem</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">Planeten mit</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">Technologie-Spezialisierung in einem</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">System mit deinen Einheiten. Du</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">erhältst Handelswaren in Höhe</text><text x="48" y="618" font-size="26" font-weight="400" fill="#e5ebee">seiner Ressourcen plus Einfluss und</text><text x="48" y="654" font-size="26" font-weight="400" fill="#e5ebee">1 Technologie in der Farbe der</text><text x="48" y="690" font-size="26" font-weight="400" fill="#e5ebee">Spezialisierung, dann wird die Karte</text><text x="48" y="726" font-size="26" font-weight="400" fill="#e5ebee">vernichtet.</text><path d="M48 796H632" stroke="#68798a" stroke-width="1"/><text x="48" y="830" font-size="18" font-weight="700" fill="#8ebbbc">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="861" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="884" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
