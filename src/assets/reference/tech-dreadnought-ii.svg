<svg xmlns="http://www.w3.org/2000/svg" width="680" height="994" viewBox="0 0 680 994" role="img" aria-labelledby="title desc"><title id="title">Schlachtschiff II — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="994" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="970" rx="18" fill="none" stroke="#abb3c1" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#abb3c1" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#abb3c1">EINHEITEN-AUFWERTUNG</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Schlachtschiff II</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#abb3c1" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#abb3c1">VORAUSSETZUNGEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">2× Antriebstechnik · 1× Kybernetik</text><text x="48" y="368" font-size="18" font-weight="700" fill="#abb3c1">EINHEITENWERTE</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Kosten 4 · Kampf 5 · Bewegung 2 ·</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Kapazität 1</text><text x="48" y="498" font-size="18" font-weight="700" fill="#abb3c1">EINHEITENFÄHIGKEITEN</text><text x="48" y="532" font-size="26" font-weight="400" fill="#e5ebee">Schadensresistenz, Bombardement 5</text><text x="48" y="592" font-size="18" font-weight="700" fill="#abb3c1">KURZREFERENZ</text><text x="48" y="626" font-size="26" font-weight="400" fill="#e5ebee">Schlachtschiffe bewegen sich 2</text><text x="48" y="662" font-size="26" font-weight="400" fill="#e5ebee">statt 1 Feld weit und können nicht</text><text x="48" y="698" font-size="26" font-weight="400" fill="#e5ebee">mehr durch die Aktionskarte</text><text x="48" y="734" font-size="26" font-weight="400" fill="#e5ebee">„Direkter Treffer“ zerstört</text><text x="48" y="770" font-size="26" font-weight="400" fill="#e5ebee">werden.</text><path d="M48 840H632" stroke="#68798a" stroke-width="1"/><text x="48" y="874" font-size="18" font-weight="700" fill="#abb3c1">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="905" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="928" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
