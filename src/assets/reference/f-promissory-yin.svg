<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1058" viewBox="0 0 680 1058" role="img" aria-labelledby="title desc"><title id="title">Graubrand-Mutagen — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1058" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1034" rx="18" fill="none" stroke="#c09cb2" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#c09cb2" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#c09cb2">VERTRAGSKARTE · DIE YIN-BRUDERSCHAFT</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Graubrand-Mutagen</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#c09cb2" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#c09cb2">KURZREFERENZ</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Nachdem ein System aktiviert</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">wurde, darf der Yin-Spieler während</text><text x="48" y="380" font-size="26" font-weight="400" fill="#e5ebee">dieser Taktikaktion keine</text><text x="48" y="416" font-size="26" font-weight="400" fill="#e5ebee">Fraktionsfähigkeiten oder</text><text x="48" y="452" font-size="26" font-weight="400" fill="#e5ebee">Fraktionstechnologien verwenden.</text><text x="48" y="488" font-size="26" font-weight="400" fill="#e5ebee">Danach geht die Karte an ihn zurück.</text><text x="48" y="548" font-size="18" font-weight="700" fill="#c09cb2">SPÄTERE FASSUNG · OPTIONAL</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">Codex I (Ω): Zu Beginn eines</text><text x="48" y="618" font-size="26" font-weight="400" fill="#e5ebee">Bodenkampfs gegen 2 oder mehr</text><text x="48" y="654" font-size="26" font-weight="400" fill="#e5ebee">Bodentruppen, die nicht dem</text><text x="48" y="690" font-size="26" font-weight="400" fill="#e5ebee">Yin-Spieler gehören, ersetzt du 1</text><text x="48" y="726" font-size="26" font-weight="400" fill="#e5ebee">gegnerische Infanterie durch 1</text><text x="48" y="762" font-size="26" font-weight="400" fill="#e5ebee">Infanterie aus deinem Nachschub.</text><text x="48" y="798" font-size="26" font-weight="400" fill="#e5ebee">Danach geht die Karte an den</text><text x="48" y="834" font-size="26" font-weight="400" fill="#e5ebee">Yin-Spieler zurück.</text><path d="M48 904H632" stroke="#68798a" stroke-width="1"/><text x="48" y="938" font-size="18" font-weight="700" fill="#c09cb2">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="969" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="992" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
