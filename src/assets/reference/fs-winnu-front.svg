<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1073" viewBox="0 0 1120 1073" role="img" aria-labelledby="title desc"><title id="title">Die Winnu — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1073" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1049" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Die Winnu</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">BLUTSBANDE</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Um den Hütermarker von Mecatol Rex zu entfernen, musst du</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">keinen Einfluss ausgeben.</text><text x="64" y="405" font-size="18" font-weight="700" fill="#d9b46e">RÜCKGEWINNUNG</text><text x="64" y="439" font-size="25" font-weight="400" fill="#e5ebee">Nachdem du eine Taktikaktion abgehandelt hast, in der du die</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">Kontrolle über Mecatol Rex übernommen hast, darfst du 1 PVS</text><text x="64" y="507" font-size="25" font-weight="400" fill="#e5ebee">und 1 Raumwerft aus deinem Nachschub auf Mecatol Rex setzen.</text><text x="64" y="565" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · SALAI SAI CORIAN</text><text x="64" y="599" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 7 (×X) · Bewegung 1 · Kapazität 3</text><text x="64" y="657" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="691" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz. Wirft pro Kampfwurf so viele Würfel</text><text x="64" y="725" font-size="25" font-weight="400" fill="#e5ebee">(Treffer bei 7), wie der Gegner Nicht-Jäger-Schiffe in diesem</text><text x="64" y="759" font-size="25" font-weight="400" fill="#e5ebee">System hat.</text><text x="64" y="817" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="851" font-size="25" font-weight="400" fill="#e5ebee">3</text><path d="M64 919H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="953" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="984" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="64" y="1007" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
