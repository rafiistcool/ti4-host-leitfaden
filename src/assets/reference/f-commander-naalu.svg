<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1080" viewBox="0 0 680 1080" role="img" aria-labelledby="title desc"><title id="title">M&apos;aban — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1080" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1056" rx="18" fill="none" stroke="#8ebbbc" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#8ebbbc" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#8ebbbc">KOMMANDEUR · DAS NAALU-KOLLEKTIV</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">M&apos;aban</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Eigenname unverändert</text><path d="M48 238H632" stroke="#8ebbbc" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#8ebbbc">FREISCHALTEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">12 Jäger auf dem Spielplan.</text><text x="48" y="368" font-size="18" font-weight="700" fill="#8ebbbc">KURZREFERENZ</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Wenn du produzierst, darfst du 1</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">zusätzlichen Jäger zu seinen</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">normalen Kosten produzieren, der</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">nicht gegen dein Produktionslimit</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">zählt.</text><text x="48" y="606" font-size="18" font-weight="700" fill="#8ebbbc">SPÄTERE FASSUNG · OPTIONAL</text><text x="48" y="640" font-size="26" font-weight="400" fill="#e5ebee">Codex III (Ω): Freischalten mit</text><text x="48" y="676" font-size="26" font-weight="400" fill="#e5ebee">Bodentruppen im oder angrenzend an</text><text x="48" y="712" font-size="26" font-weight="400" fill="#e5ebee">das Mecatol-Rex-System. Du darfst</text><text x="48" y="748" font-size="26" font-weight="400" fill="#e5ebee">jederzeit die Vertragskarten</text><text x="48" y="784" font-size="26" font-weight="400" fill="#e5ebee">deiner Nachbarn sowie die oberste</text><text x="48" y="820" font-size="26" font-weight="400" fill="#e5ebee">und unterste Karte des</text><text x="48" y="856" font-size="26" font-weight="400" fill="#e5ebee">Agendastapels ansehen.</text><path d="M48 926H632" stroke="#68798a" stroke-width="1"/><text x="48" y="960" font-size="18" font-weight="700" fill="#8ebbbc">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="991" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="1014" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
