<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1008" viewBox="0 0 680 1008" role="img" aria-labelledby="title desc"><title id="title">Yin-Zentrifuge — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1008" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="984" rx="18" fill="none" stroke="#75b583" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#75b583" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#75b583">FRAKTIONSTECHNOLOGIE · BIOTECHNIK</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Yin-Zentrifuge</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#75b583" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#75b583">VORAUSSETZUNGEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">2× Biotechnik</text><text x="48" y="368" font-size="18" font-weight="700" fill="#75b583">KURZREFERENZ</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Nachdem 1 oder mehrere deiner</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Einheiten Produktion genutzt haben,</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">setzt du 1 Infanterie aus deinem</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">Nachschub auf einen deiner Planeten</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">in diesem System.</text><text x="48" y="606" font-size="18" font-weight="700" fill="#75b583">SPÄTERE FASSUNG · OPTIONAL</text><text x="48" y="640" font-size="26" font-weight="400" fill="#e5ebee">Codex I (Ω): Nach dem Produzieren</text><text x="48" y="676" font-size="26" font-weight="400" fill="#e5ebee">setzt du bis zu 2 Infanterie auf 1</text><text x="48" y="712" font-size="26" font-weight="400" fill="#e5ebee">beliebigen eigenen Planeten oder in 1</text><text x="48" y="748" font-size="26" font-weight="400" fill="#e5ebee">beliebigen Weltraumbereich mit</text><text x="48" y="784" font-size="26" font-weight="400" fill="#e5ebee">mindestens 1 deiner Schiffe.</text><path d="M48 854H632" stroke="#68798a" stroke-width="1"/><text x="48" y="888" font-size="18" font-weight="700" fill="#75b583">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="919" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="942" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
