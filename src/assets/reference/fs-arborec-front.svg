<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="913" viewBox="0 0 1120 913" role="img" aria-labelledby="title desc"><title id="title">Das Arborec — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="913" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="889" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Das Arborec</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">MITOSE</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Deine Raumwerften können keine Infanterie produzieren. Dafür</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">setzt du zu Beginn jeder Statusphase 1 Infanterie aus deinem</text><text x="64" y="381" font-size="25" font-weight="400" fill="#e5ebee">Nachschub auf einen beliebigen Planeten, den du kontrollierst.</text><text x="64" y="439" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · DUHA MENAIMON</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 7 (×2) · Bewegung 1 · Kapazität 5</text><text x="64" y="531" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="565" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz. Aktivierst du das System, in dem es steht,</text><text x="64" y="599" font-size="25" font-weight="400" fill="#e5ebee">darfst du dort anschließend bis zu 5 Einheiten produzieren.</text><text x="64" y="657" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="691" font-size="25" font-weight="400" fill="#e5ebee">3</text><path d="M64 759H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="793" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="824" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="64" y="847" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
