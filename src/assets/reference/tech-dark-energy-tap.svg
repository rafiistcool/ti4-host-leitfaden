<svg xmlns="http://www.w3.org/2000/svg" width="680" height="966" viewBox="0 0 680 966" role="img" aria-labelledby="title desc"><title id="title">Nullpunktenergie-Reaktor — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="966" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="942" rx="18" fill="none" stroke="#68add7" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#68add7" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#68add7">ANTRIEBSTECHNIK</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Nullpunktenergie-Reakto</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">r</text><text x="48" y="243" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 290H632" stroke="#68add7" stroke-width="2"/><text x="48" y="326" font-size="18" font-weight="700" fill="#68add7">VORAUSSETZUNGEN</text><text x="48" y="360" font-size="26" font-weight="400" fill="#e5ebee">Keine</text><text x="48" y="420" font-size="18" font-weight="700" fill="#68add7">KURZREFERENZ</text><text x="48" y="454" font-size="26" font-weight="400" fill="#e5ebee">Hast du nach einer Taktikaktion in</text><text x="48" y="490" font-size="26" font-weight="400" fill="#e5ebee">einem System mit</text><text x="48" y="526" font-size="26" font-weight="400" fill="#e5ebee">Wilder-Raum-Marker mindestens 1</text><text x="48" y="562" font-size="26" font-weight="400" fill="#e5ebee">Schiff dort, erkundest du den</text><text x="48" y="598" font-size="26" font-weight="400" fill="#e5ebee">Marker. Außerdem dürfen sich deine</text><text x="48" y="634" font-size="26" font-weight="400" fill="#e5ebee">Schiffe in angrenzende Systeme</text><text x="48" y="670" font-size="26" font-weight="400" fill="#e5ebee">ohne fremde Einheiten zurückziehen,</text><text x="48" y="706" font-size="26" font-weight="400" fill="#e5ebee">auch wenn du dort weder Einheiten</text><text x="48" y="742" font-size="26" font-weight="400" fill="#e5ebee">noch Planeten hast.</text><path d="M48 812H632" stroke="#68798a" stroke-width="1"/><text x="48" y="846" font-size="18" font-weight="700" fill="#68add7">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="877" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="900" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
