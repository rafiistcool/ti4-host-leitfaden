<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1138" viewBox="0 0 680 1138" role="img" aria-labelledby="title desc"><title id="title">Schwebefabrik I — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1138" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1114" rx="18" fill="none" stroke="#a7b4c6" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#a7b4c6" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#a7b4c6">SONDEREINHEIT · DER CLAN DER ZAAR</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Schwebefabrik I</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#a7b4c6" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#a7b4c6">EINHEITENWERTE</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Kosten – · Kampf – · Bewegung 1 ·</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">Kapazität 4</text><text x="48" y="404" font-size="18" font-weight="700" fill="#a7b4c6">KURZREFERENZ</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Produktion 5. Steht im</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">Weltraumbereich statt auf einem</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">Planeten und bewegt sich und zieht</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">sich zurück wie ein Schiff. Wird sie</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">blockiert, wird sie zerstört.</text><text x="48" y="642" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · SCHWEBEFABRIK II</text><text x="48" y="676" font-size="26" font-weight="400" fill="#e5ebee">Kosten – · Kampf – · Bewegung 2 ·</text><text x="48" y="712" font-size="26" font-weight="400" fill="#e5ebee">Kapazität 5</text><text x="48" y="772" font-size="18" font-weight="700" fill="#a7b4c6">AUFWERTUNG · KURZREFERENZ</text><text x="48" y="806" font-size="26" font-weight="400" fill="#e5ebee">Produktion 7. Sonst wie Stufe I, also</text><text x="48" y="842" font-size="26" font-weight="400" fill="#e5ebee">im Weltraumbereich, beweglich wie</text><text x="48" y="878" font-size="26" font-weight="400" fill="#e5ebee">ein Schiff und bei Blockade</text><text x="48" y="914" font-size="26" font-weight="400" fill="#e5ebee">zerstört.</text><path d="M48 984H632" stroke="#68798a" stroke-width="1"/><text x="48" y="1018" font-size="18" font-weight="700" fill="#a7b4c6">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="1049" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="1072" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
