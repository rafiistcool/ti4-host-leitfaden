<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1188" viewBox="0 0 680 1188" role="img" aria-labelledby="title desc"><title id="title">Dannel von der 10. — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1188" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1164" rx="18" fill="none" stroke="#8ebbbc" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#8ebbbc" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#8ebbbc">HELD · DIE YIN-BRUDERSCHAFT</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Dannel von der 10.</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#8ebbbc" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#8ebbbc">FREISCHALTEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">3 gewertete Aufträge.</text><text x="48" y="368" font-size="18" font-weight="700" fill="#8ebbbc">KURZREFERENZ</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Materialaktion: Für jeden Planeten</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">mit deiner Infanterie machst du ihn</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">entweder spielbereit oder setzt</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">dort so viel Infanterie aus deinem</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">Nachschub hinzu, wie bereits darauf</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">steht. Danach wird die Karte</text><text x="48" y="618" font-size="26" font-weight="400" fill="#e5ebee">vernichtet.</text><text x="48" y="678" font-size="18" font-weight="700" fill="#8ebbbc">SPÄTERE FASSUNG · OPTIONAL</text><text x="48" y="712" font-size="26" font-weight="400" fill="#e5ebee">Codex III (Ω): Materialaktion,</text><text x="48" y="748" font-size="26" font-weight="400" fill="#e5ebee">entsende bis zu 3 Infanterie aus</text><text x="48" y="784" font-size="26" font-weight="400" fill="#e5ebee">deinem Nachschub auf beliebige</text><text x="48" y="820" font-size="26" font-weight="400" fill="#e5ebee">Nicht-Heimat-Planeten und handle</text><text x="48" y="856" font-size="26" font-weight="400" fill="#e5ebee">dort Einmärsche ab.</text><text x="48" y="892" font-size="26" font-weight="400" fill="#e5ebee">Weltraumkanonen dürfen nicht auf</text><text x="48" y="928" font-size="26" font-weight="400" fill="#e5ebee">diese Einheiten feuern. Danach wird</text><text x="48" y="964" font-size="26" font-weight="400" fill="#e5ebee">die Karte vernichtet.</text><path d="M48 1034H632" stroke="#68798a" stroke-width="1"/><text x="48" y="1068" font-size="18" font-weight="700" fill="#8ebbbc">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="1099" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="1122" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
