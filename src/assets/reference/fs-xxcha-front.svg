<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1175" viewBox="0 0 1120 1175" role="img" aria-labelledby="title desc"><title id="title">Das Xxcha-Königreich — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1175" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1151" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Das Xxcha-Königreich</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">FRIEDENSABKOMMEN</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Nachdem du die Primär- oder Sekundärfähigkeit der</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">Strategiekarte Diplomatie abgehandelt hast, darfst du die</text><text x="64" y="381" font-size="25" font-weight="400" fill="#e5ebee">Kontrolle über 1 Planeten ohne Einheiten übernehmen, der in</text><text x="64" y="415" font-size="25" font-weight="400" fill="#e5ebee">einem System angrenzend an einen deiner Planeten liegt. Mecatol</text><text x="64" y="449" font-size="25" font-weight="400" fill="#e5ebee">Rex ist ausgenommen.</text><text x="64" y="507" font-size="18" font-weight="700" fill="#d9b46e">VERWERFEN</text><text x="64" y="541" font-size="25" font-weight="400" fill="#e5ebee">Wird eine Agenda aufgedeckt, darfst du 1 Marker aus deinem</text><text x="64" y="575" font-size="25" font-weight="400" fill="#e5ebee">Strategiepool ausgeben, um sie abzulegen und die nächste</text><text x="64" y="609" font-size="25" font-weight="400" fill="#e5ebee">aufzudecken. Abgestimmt wird dann über die neue Agenda.</text><text x="64" y="667" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · LONCARA SSODU</text><text x="64" y="701" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 7 (×2) · Bewegung 1 · Kapazität 3</text><text x="64" y="759" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="793" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz, Weltraumkanone 5 (×3). Seine</text><text x="64" y="827" font-size="25" font-weight="400" fill="#e5ebee">Weltraumkanone darf auch auf Schiffe in angrenzenden</text><text x="64" y="861" font-size="25" font-weight="400" fill="#e5ebee">Systemen feuern.</text><text x="64" y="919" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="953" font-size="25" font-weight="400" fill="#e5ebee">4</text><path d="M64 1021H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="1055" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="1086" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="64" y="1109" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
