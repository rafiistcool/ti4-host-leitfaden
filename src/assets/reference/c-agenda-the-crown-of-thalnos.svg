<svg xmlns="http://www.w3.org/2000/svg" width="680" height="972" viewBox="0 0 680 972" role="img" aria-labelledby="title desc"><title id="title">Die Krone von Thalnos — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="972" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="948" rx="18" fill="none" stroke="#7cacd0" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#7cacd0" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#7cacd0">AGENDA · GESETZ</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Die Krone von Thalnos</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 238H632" stroke="#7cacd0" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#7cacd0">WAHL</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Spieler</text><text x="48" y="368" font-size="18" font-weight="700" fill="#7cacd0">ERGEBNIS</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Der gewählte Spieler erhält diese</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">Karte. In jeder Kampfrunde darf er</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">beliebig viele seiner Würfel neu</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">werfen, muss aber jede Einheit</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">zerstören, deren</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">Wiederholungswurf keinen Treffer</text><text x="48" y="618" font-size="26" font-weight="400" fill="#e5ebee">erzielt.</text><text x="48" y="678" font-size="18" font-weight="700" fill="#7cacd0">MIT POK</text><text x="48" y="712" font-size="26" font-weight="400" fill="#e5ebee">Diese Agenda wird aus dem Stapel</text><text x="48" y="748" font-size="26" font-weight="400" fill="#e5ebee">entfernt.</text><path d="M48 818H632" stroke="#68798a" stroke-width="1"/><text x="48" y="852" font-size="18" font-weight="700" fill="#7cacd0">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="883" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="906" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
