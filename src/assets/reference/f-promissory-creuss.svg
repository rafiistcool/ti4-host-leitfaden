<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Creuss-Freund-Feind-Kennung — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#c09cb2" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#c09cb2" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#c09cb2">VERTRAGSKARTE · DIE GEISTER VON CREUSS</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Creuss-Freund-Feind-K</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">ennung</text><text x="48" y="243" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 290H632" stroke="#c09cb2" stroke-width="2"/><text x="48" y="326" font-size="18" font-weight="700" fill="#c09cb2">KURZREFERENZ</text><text x="48" y="360" font-size="26" font-weight="400" fill="#e5ebee">Zu Beginn deines Zuges in der</text><text x="48" y="396" font-size="26" font-weight="400" fill="#e5ebee">Aktionsphase legst du einen</text><text x="48" y="432" font-size="26" font-weight="400" fill="#e5ebee">Creuss-Wurmlochmarker in ein</text><text x="48" y="468" font-size="26" font-weight="400" fill="#e5ebee">System mit einem deiner Planeten</text><text x="48" y="504" font-size="26" font-weight="400" fill="#e5ebee">oder in ein Nicht-Heimat-System</text><text x="48" y="540" font-size="26" font-weight="400" fill="#e5ebee">ohne fremde Schiffe oder versetzt</text><text x="48" y="576" font-size="26" font-weight="400" fill="#e5ebee">ihn dorthin. Danach geht die Karte</text><text x="48" y="612" font-size="26" font-weight="400" fill="#e5ebee">an den Creuss-Spieler zurück.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#c09cb2">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
