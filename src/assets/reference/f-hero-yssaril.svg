<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Kyver, Klinge und Schlüssel — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#8ebbbc" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#8ebbbc" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#8ebbbc">HELD · DIE YSSARIL-STÄMME</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Kyver, Klinge und</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">Schlüssel</text><text x="48" y="243" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 290H632" stroke="#8ebbbc" stroke-width="2"/><text x="48" y="326" font-size="18" font-weight="700" fill="#8ebbbc">FREISCHALTEN</text><text x="48" y="360" font-size="26" font-weight="400" fill="#e5ebee">3 gewertete Aufträge.</text><text x="48" y="420" font-size="18" font-weight="700" fill="#8ebbbc">KURZREFERENZ</text><text x="48" y="454" font-size="26" font-weight="400" fill="#e5ebee">Materialaktion: Jeder andere</text><text x="48" y="490" font-size="26" font-weight="400" fill="#e5ebee">Spieler zeigt dir 1 Aktionskarte aus</text><text x="48" y="526" font-size="26" font-weight="400" fill="#e5ebee">seiner Hand. Pro Spieler nimmst du</text><text x="48" y="562" font-size="26" font-weight="400" fill="#e5ebee">sie oder zwingst ihn, 3 zufällige</text><text x="48" y="598" font-size="26" font-weight="400" fill="#e5ebee">Aktionskarten abzulegen, danach</text><text x="48" y="634" font-size="26" font-weight="400" fill="#e5ebee">wird die Karte vernichtet.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#8ebbbc">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
