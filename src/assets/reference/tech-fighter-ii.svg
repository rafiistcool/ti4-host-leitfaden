<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Jäger II — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#abb3c1" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#abb3c1" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#abb3c1">EINHEITEN-AUFWERTUNG</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Jäger II</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#abb3c1" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#abb3c1">VORAUSSETZUNGEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">1× Biotechnik · 1× Antriebstechnik</text><text x="48" y="368" font-size="18" font-weight="700" fill="#abb3c1">EINHEITENWERTE</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Kosten 1 (x2) · Kampf 8 · Bewegung</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">2</text><text x="48" y="498" font-size="18" font-weight="700" fill="#abb3c1">KURZREFERENZ</text><text x="48" y="532" font-size="26" font-weight="400" fill="#e5ebee">Jäger treffen auf 8 statt 9 und</text><text x="48" y="568" font-size="26" font-weight="400" fill="#e5ebee">dürfen sich mit Bewegung 2 ohne</text><text x="48" y="604" font-size="26" font-weight="400" fill="#e5ebee">Transport bewegen. Jäger, die über</text><text x="48" y="640" font-size="26" font-weight="400" fill="#e5ebee">die Kapazität deiner Schiffe</text><text x="48" y="676" font-size="26" font-weight="400" fill="#e5ebee">hinausgehen, belegen dafür Plätze im</text><text x="48" y="712" font-size="26" font-weight="400" fill="#e5ebee">Flottenpool.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#abb3c1">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
