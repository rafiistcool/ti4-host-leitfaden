<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1107" viewBox="0 0 1120 1107" role="img" aria-labelledby="title desc"><title id="title">Die Keleres des Rates — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1107" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1083" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · RÜCKSEITE UND START</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Die Keleres des Rates</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">HEIMAT-SYSTEM</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Moll Primus: 4 Ressourcen · 1 Einfluss · Mentak / Archon Ren: 2</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">Ressourcen · 3 Einfluss · Xxcha / Archon Tau: 1 Ressourcen · 1</text><text x="64" y="381" font-size="25" font-weight="400" fill="#e5ebee">Einfluss · Xxcha / Valk: 2 Ressourcen · 0 Einfluss ·</text><text x="64" y="415" font-size="25" font-weight="400" fill="#e5ebee">Silberschwingen / Avar: 1 Ressourcen · 1 Einfluss ·</text><text x="64" y="449" font-size="25" font-weight="400" fill="#e5ebee">Silberschwingen / Ylir: 0 Ressourcen · 2 Einfluss ·</text><text x="64" y="483" font-size="25" font-weight="400" fill="#e5ebee">Silberschwingen</text><text x="64" y="541" font-size="18" font-weight="700" fill="#d9b46e">STARTEINHEITEN</text><text x="64" y="575" font-size="25" font-weight="400" fill="#e5ebee">2 Träger, 1 Kreuzer, 2 Jäger, 2 Infanterie, 1 Raumwerft</text><text x="64" y="633" font-size="18" font-weight="700" fill="#d9b46e">STARTTECHNOLOGIEN</text><text x="64" y="667" font-size="25" font-weight="400" fill="#e5ebee">Wahl: 2 Nicht-Fraktionstechnologien, die andere Spieler besitzen</text><text x="64" y="725" font-size="18" font-weight="700" fill="#d9b46e">KOMMANDOMARKER ZUM SPIELBEGINN</text><text x="64" y="759" font-size="25" font-weight="400" fill="#e5ebee">3 im Taktikpool · 3 im Flottenpool · 2 im Strategiepool</text><text x="64" y="817" font-size="18" font-weight="700" fill="#d9b46e">HERKUNFT WÄHLEN</text><text x="64" y="851" font-size="25" font-weight="400" fill="#e5ebee">Heimat-System einer nicht gespielten Fraktion: Mentak, Xxcha</text><text x="64" y="885" font-size="25" font-weight="400" fill="#e5ebee">oder Silberschwingen.</text><path d="M64 953H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="987" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="1018" font-size="17" fill="#b9c6d1">Codex III · optional</text><text x="64" y="1041" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
