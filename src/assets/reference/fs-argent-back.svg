<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="913" viewBox="0 0 1120 913" role="img" aria-labelledby="title desc"><title id="title">Die Silberschwingen — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="913" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="889" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · RÜCKSEITE UND START</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Die Silberschwingen</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">HEIMAT-SYSTEM</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Valk: 2 Ressourcen · 0 Einfluss / Avar: 1 Ressourcen · 1 Einfluss</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">/ Ylir: 0 Ressourcen · 2 Einfluss</text><text x="64" y="405" font-size="18" font-weight="700" fill="#d9b46e">STARTEINHEITEN</text><text x="64" y="439" font-size="25" font-weight="400" fill="#e5ebee">1 Träger, 2 Zerstörer, 2 Jäger, 5 Infanterie, 1 PVS, 1</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">Raumwerft</text><text x="64" y="531" font-size="18" font-weight="700" fill="#d9b46e">STARTTECHNOLOGIEN</text><text x="64" y="565" font-size="25" font-weight="400" fill="#e5ebee">Wahl: 2 aus Neurostimulator, Sarween-Werkzeuge,</text><text x="64" y="599" font-size="25" font-weight="400" fill="#e5ebee">Plasmabrenner</text><text x="64" y="657" font-size="18" font-weight="700" fill="#d9b46e">KOMMANDOMARKER ZUM SPIELBEGINN</text><text x="64" y="691" font-size="25" font-weight="400" fill="#e5ebee">3 im Taktikpool · 3 im Flottenpool · 2 im Strategiepool</text><path d="M64 759H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="793" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="824" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="64" y="847" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
