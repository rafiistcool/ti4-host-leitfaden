<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Infanterie II — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#abb3c1" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#abb3c1" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#abb3c1">EINHEITEN-AUFWERTUNG</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Infanterie II</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#abb3c1" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#abb3c1">VORAUSSETZUNGEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">2× Biotechnik</text><text x="48" y="368" font-size="18" font-weight="700" fill="#abb3c1">EINHEITENWERTE</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Kosten 1 (x2) · Kampf 7</text><text x="48" y="462" font-size="18" font-weight="700" fill="#abb3c1">KURZREFERENZ</text><text x="48" y="496" font-size="26" font-weight="400" fill="#e5ebee">Infanterie trifft auf 7 statt 8. Wird</text><text x="48" y="532" font-size="26" font-weight="400" fill="#e5ebee">eine zerstört, würfelst du 1 Würfel,</text><text x="48" y="568" font-size="26" font-weight="400" fill="#e5ebee">bei 6 oder mehr kommt sie auf diese</text><text x="48" y="604" font-size="26" font-weight="400" fill="#e5ebee">Karte und zu Beginn deines nächsten</text><text x="48" y="640" font-size="26" font-weight="400" fill="#e5ebee">Zuges auf einen deiner Planeten im</text><text x="48" y="676" font-size="26" font-weight="400" fill="#e5ebee">Heimat-System.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#abb3c1">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
