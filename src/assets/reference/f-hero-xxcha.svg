<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1188" viewBox="0 0 680 1188" role="img" aria-labelledby="title desc"><title id="title">Xxekir Grom — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1188" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1164" rx="18" fill="none" stroke="#8ebbbc" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#8ebbbc" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#8ebbbc">HELD · DAS XXCHA-KÖNIGREICH</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Xxekir Grom</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Eigenname unverändert</text><path d="M48 238H632" stroke="#8ebbbc" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#8ebbbc">FREISCHALTEN</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">3 gewertete Aufträge.</text><text x="48" y="368" font-size="18" font-weight="700" fill="#8ebbbc">KURZREFERENZ</text><text x="48" y="402" font-size="26" font-weight="400" fill="#e5ebee">Materialaktion: Du darfst 1 Gesetz</text><text x="48" y="438" font-size="26" font-weight="400" fill="#e5ebee">aus dem Spiel ablegen. Sieh dir dann</text><text x="48" y="474" font-size="26" font-weight="400" fill="#e5ebee">die obersten 5 Agenden an, decke 2</text><text x="48" y="510" font-size="26" font-weight="400" fill="#e5ebee">davon auf und handle jede so ab, als</text><text x="48" y="546" font-size="26" font-weight="400" fill="#e5ebee">hättest du 1 Stimme für ein</text><text x="48" y="582" font-size="26" font-weight="400" fill="#e5ebee">Ergebnis deiner Wahl abgegeben, der</text><text x="48" y="618" font-size="26" font-weight="400" fill="#e5ebee">Rest wird abgelegt. Andere Spieler</text><text x="48" y="654" font-size="26" font-weight="400" fill="#e5ebee">dürfen während dieser Aktion keine</text><text x="48" y="690" font-size="26" font-weight="400" fill="#e5ebee">Fähigkeiten abhandeln, danach wird</text><text x="48" y="726" font-size="26" font-weight="400" fill="#e5ebee">die Karte vernichtet.</text><text x="48" y="786" font-size="18" font-weight="700" fill="#8ebbbc">SPÄTERE FASSUNG · OPTIONAL</text><text x="48" y="820" font-size="26" font-weight="400" fill="#e5ebee">Codex III (Ω): Erschöpfst du</text><text x="48" y="856" font-size="26" font-weight="400" fill="#e5ebee">Planeten, addierst du jeweils</text><text x="48" y="892" font-size="26" font-weight="400" fill="#e5ebee">Ressourcen und Einfluss und darfst</text><text x="48" y="928" font-size="26" font-weight="400" fill="#e5ebee">die Summe sowohl als Ressourcen als</text><text x="48" y="964" font-size="26" font-weight="400" fill="#e5ebee">auch als Einfluss verwenden.</text><path d="M48 1034H632" stroke="#68798a" stroke-width="1"/><text x="48" y="1068" font-size="18" font-weight="700" fill="#8ebbbc">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="1099" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="1122" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
