<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Einen galaktischen Expertenrat bilden — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#e3bd72" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#e3bd72" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#e3bd72">ÖFFENTLICHER AUFTRAG · STUFE II</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Einen galaktischen</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">Expertenrat bilden</text><text x="48" y="243" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 290H632" stroke="#e3bd72" stroke-width="2"/><text x="48" y="326" font-size="18" font-weight="700" fill="#e3bd72">WERTUNG</text><text x="48" y="360" font-size="26" font-weight="400" fill="#e5ebee">2 Siegpunkte · Statusphase</text><text x="48" y="420" font-size="18" font-weight="700" fill="#e3bd72">KURZREFERENZ</text><text x="48" y="454" font-size="26" font-weight="400" fill="#e5ebee">5 Planeten mit</text><text x="48" y="490" font-size="26" font-weight="400" fill="#e5ebee">Technologie-Spezialisierung</text><text x="48" y="526" font-size="26" font-weight="400" fill="#e5ebee">kontrollieren.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#e3bd72">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
