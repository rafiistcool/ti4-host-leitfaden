<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1233" viewBox="0 0 1120 1233" role="img" aria-labelledby="title desc"><title id="title">Die Vuil&apos;raith-Verschwörung — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1233" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1209" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Die Vuil&apos;raith-Verschwörung</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">VERSCHLINGEN</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Gegnerische Einheiten, die im Kampf zerstört werden und keine</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">Gebäude sind, kaperst du.</text><text x="64" y="405" font-size="18" font-weight="700" fill="#d9b46e">VERSCHMELZUNG</text><text x="64" y="439" font-size="25" font-weight="400" fill="#e5ebee">Produzierst du eine Einheit, darfst du 1 gekaperte Einheit</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">desselben Typs zurückgeben und deine Einheit dann ohne</text><text x="64" y="507" font-size="25" font-weight="400" fill="#e5ebee">Ressourcen produzieren.</text><text x="64" y="565" font-size="18" font-weight="700" fill="#d9b46e">RISSVERSCHMELZUNG</text><text x="64" y="599" font-size="25" font-weight="400" fill="#e5ebee">Erforschst du eine Aufwertung, darfst du 1 gekaperte Einheit</text><text x="64" y="633" font-size="25" font-weight="400" fill="#e5ebee">dieses Typs zurückgeben, um alle Voraussetzungen zu</text><text x="64" y="667" font-size="25" font-weight="400" fill="#e5ebee">ignorieren.</text><text x="64" y="725" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · DER SCHRECKEN DAZWISCHEN</text><text x="64" y="759" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 5 (×2) · Bewegung 1 · Kapazität 3</text><text x="64" y="817" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="851" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz, Bombardement 5. Alle anderen Einheiten</text><text x="64" y="885" font-size="25" font-weight="400" fill="#e5ebee">außer Gebäuden, die in diesem System zerstört werden, kaperst</text><text x="64" y="919" font-size="25" font-weight="400" fill="#e5ebee">du, auch deine eigenen.</text><text x="64" y="977" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="1011" font-size="25" font-weight="400" fill="#e5ebee">2</text><path d="M64 1079H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="1113" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="1144" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="64" y="1167" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
