<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1024" viewBox="0 0 680 1024" role="img" aria-labelledby="title desc"><title id="title">Repräsentative Regierung — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1024" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1000" rx="18" fill="none" stroke="#7cacd0" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#7cacd0" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#7cacd0">AGENDA · GESETZ</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Repräsentative</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">Regierung</text><text x="48" y="243" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 290H632" stroke="#7cacd0" stroke-width="2"/><text x="48" y="326" font-size="18" font-weight="700" fill="#7cacd0">DAFÜR</text><text x="48" y="360" font-size="26" font-weight="400" fill="#e5ebee">In der Agendaphase darf niemand</text><text x="48" y="396" font-size="26" font-weight="400" fill="#e5ebee">Planeten zum Abstimmen</text><text x="48" y="432" font-size="26" font-weight="400" fill="#e5ebee">erschöpfen. Stattdessen hat jeder</text><text x="48" y="468" font-size="26" font-weight="400" fill="#e5ebee">Spieler 1 Stimme pro Agenda.</text><text x="48" y="528" font-size="18" font-weight="700" fill="#7cacd0">DAGEGEN</text><text x="48" y="562" font-size="26" font-weight="400" fill="#e5ebee">Zu Beginn der nächsten</text><text x="48" y="598" font-size="26" font-weight="400" fill="#e5ebee">Strategiephase erschöpft jeder,</text><text x="48" y="634" font-size="26" font-weight="400" fill="#e5ebee">der mit „Dagegen“ gestimmt hat,</text><text x="48" y="670" font-size="26" font-weight="400" fill="#e5ebee">alle seine kulturellen Planeten.</text><text x="48" y="730" font-size="18" font-weight="700" fill="#7cacd0">MIT POK</text><text x="48" y="764" font-size="26" font-weight="400" fill="#e5ebee">Diese Agenda wird aus dem Stapel</text><text x="48" y="800" font-size="26" font-weight="400" fill="#e5ebee">entfernt.</text><path d="M48 870H632" stroke="#68798a" stroke-width="1"/><text x="48" y="904" font-size="18" font-weight="700" fill="#7cacd0">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="935" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="958" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
