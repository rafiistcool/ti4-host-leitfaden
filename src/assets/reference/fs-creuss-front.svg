<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1301" viewBox="0 0 1120 1301" role="img" aria-labelledby="title desc"><title id="title">Die Geister von Creuss — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1301" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1277" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Die Geister von Creuss</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">QUANTENVERSCHRÄNKUNG</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">Für dich grenzen alle Systeme mit einem Alpha- oder</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">Beta-Wurmloch aneinander an. Kein Spieleffekt kann dir diese</text><text x="64" y="381" font-size="25" font-weight="400" fill="#e5ebee">Fähigkeit nehmen.</text><text x="64" y="439" font-size="18" font-weight="700" fill="#d9b46e">GLEITSTROM</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">Während deiner Taktikaktionen erhält jedes deiner Schiffe +1</text><text x="64" y="507" font-size="25" font-weight="400" fill="#e5ebee">Bewegung, wenn es in deinem Heimat-System oder in einem</text><text x="64" y="541" font-size="25" font-weight="400" fill="#e5ebee">System mit Alpha- oder Beta-Wurmloch losfliegt.</text><text x="64" y="599" font-size="18" font-weight="700" fill="#d9b46e">TOR VON CREUSS</text><text x="64" y="633" font-size="25" font-weight="400" fill="#e5ebee">Beim Aufbau liegt das Tor von Creuss (Systemtafel 17) an der</text><text x="64" y="667" font-size="25" font-weight="400" fill="#e5ebee">Stelle deines Heimat-Systems, zählt aber nicht als</text><text x="64" y="701" font-size="25" font-weight="400" fill="#e5ebee">Heimat-System. Dein eigentliches Heimat-System (Systemtafel</text><text x="64" y="735" font-size="25" font-weight="400" fill="#e5ebee">51) liegt in deinem Spielbereich.</text><text x="64" y="793" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · HIL COLISH</text><text x="64" y="827" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 5 · Bewegung 1 · Kapazität 3</text><text x="64" y="885" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="919" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz. Sein System enthält ein Delta-Wurmloch. Bei</text><text x="64" y="953" font-size="25" font-weight="400" fill="#e5ebee">der Bewegung darf es vor oder nach deinen übrigen Schiffen</text><text x="64" y="987" font-size="25" font-weight="400" fill="#e5ebee">ziehen.</text><text x="64" y="1045" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="1079" font-size="25" font-weight="400" fill="#e5ebee">4</text><path d="M64 1147H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="1181" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="1212" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="64" y="1235" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
