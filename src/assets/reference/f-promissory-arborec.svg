<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1166" viewBox="0 0 680 1166" role="img" aria-labelledby="title desc"><title id="title">Wachstumshemmer — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1166" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="1142" rx="18" fill="none" stroke="#c09cb2" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#c09cb2" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#c09cb2">VERTRAGSKARTE · DAS ARBOREC</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Wachstumshemmer</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 238H632" stroke="#c09cb2" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#c09cb2">KURZREFERENZ</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Materialaktion: Lege die Karte</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">offen in deinen Spielbereich. Der</text><text x="48" y="380" font-size="26" font-weight="400" fill="#e5ebee">Arborec-Spieler darf keine</text><text x="48" y="416" font-size="26" font-weight="400" fill="#e5ebee">Einheiten in oder angrenzend an</text><text x="48" y="452" font-size="26" font-weight="400" fill="#e5ebee">Nicht-Heimat-Systeme produzieren,</text><text x="48" y="488" font-size="26" font-weight="400" fill="#e5ebee">die mindestens 1 deiner Einheiten</text><text x="48" y="524" font-size="26" font-weight="400" fill="#e5ebee">enthalten. Aktivierst du ein System</text><text x="48" y="560" font-size="26" font-weight="400" fill="#e5ebee">mit Arborec-Einheiten, geht die</text><text x="48" y="596" font-size="26" font-weight="400" fill="#e5ebee">Karte an ihn zurück.</text><text x="48" y="656" font-size="18" font-weight="700" fill="#c09cb2">SPÄTERE FASSUNG · OPTIONAL</text><text x="48" y="690" font-size="26" font-weight="400" fill="#e5ebee">Codex I (Ω): Nachdem ein anderer</text><text x="48" y="726" font-size="26" font-weight="400" fill="#e5ebee">Spieler Schiffe in ein System mit</text><text x="48" y="762" font-size="26" font-weight="400" fill="#e5ebee">deinen Einheiten bewegt hat, darfst</text><text x="48" y="798" font-size="26" font-weight="400" fill="#e5ebee">du einen Kommandomarker aus</text><text x="48" y="834" font-size="26" font-weight="400" fill="#e5ebee">seinem Nachschub in ein beliebiges</text><text x="48" y="870" font-size="26" font-weight="400" fill="#e5ebee">Nicht-Heimat-System legen. Danach</text><text x="48" y="906" font-size="26" font-weight="400" fill="#e5ebee">geht die Karte an den</text><text x="48" y="942" font-size="26" font-weight="400" fill="#e5ebee">Arborec-Spieler zurück.</text><path d="M48 1012H632" stroke="#68798a" stroke-width="1"/><text x="48" y="1046" font-size="18" font-weight="700" fill="#c09cb2">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="1077" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="1100" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
