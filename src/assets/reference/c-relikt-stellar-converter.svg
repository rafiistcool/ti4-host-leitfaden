<svg xmlns="http://www.w3.org/2000/svg" width="680" height="944" viewBox="0 0 680 944" role="img" aria-labelledby="title desc"><title id="title">Sternenwandler — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="944" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="920" rx="18" fill="none" stroke="#b39cda" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#b39cda" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#b39cda">RELIKT</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Sternenwandler</text><text x="48" y="191" font-size="17" font-weight="400" fill="#b9c6d1">Name: eigene Übersetzung</text><path d="M48 238H632" stroke="#b39cda" stroke-width="2"/><text x="48" y="274" font-size="18" font-weight="700" fill="#b39cda">KURZREFERENZ</text><text x="48" y="308" font-size="26" font-weight="400" fill="#e5ebee">Materialaktion: Wähle einen Planeten</text><text x="48" y="344" font-size="26" font-weight="400" fill="#e5ebee">(kein Heimatplanet, nicht legendär,</text><text x="48" y="380" font-size="26" font-weight="400" fill="#e5ebee">nicht Mecatol Rex) in einem System,</text><text x="48" y="416" font-size="26" font-weight="400" fill="#e5ebee">das an mindestens 1 deiner Einheiten</text><text x="48" y="452" font-size="26" font-weight="400" fill="#e5ebee">mit Bombardement angrenzt. Alle</text><text x="48" y="488" font-size="26" font-weight="400" fill="#e5ebee">Einheiten dort werden zerstört,</text><text x="48" y="524" font-size="26" font-weight="400" fill="#e5ebee">Planetenkarte und angelegte Karten</text><text x="48" y="560" font-size="26" font-weight="400" fill="#e5ebee">vernichtet, der Planet bekommt den</text><text x="48" y="596" font-size="26" font-weight="400" fill="#e5ebee">Marker für zerstörte Planeten und</text><text x="48" y="632" font-size="26" font-weight="400" fill="#e5ebee">das Relikt wird vernichtet.</text><path d="M48 790H632" stroke="#68798a" stroke-width="1"/><text x="48" y="824" font-size="18" font-weight="700" fill="#b39cda">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="855" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="48" y="878" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
