<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1141" viewBox="0 0 1120 1141" role="img" aria-labelledby="title desc"><title id="title">Die Silberschwingen — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="1120" height="1141" rx="24" fill="#111e2a"/><rect x="12" y="12" width="1096" height="1117" rx="18" fill="none" stroke="#d9b46e" stroke-width="2"/><path d="M1030 31h40m-24 9h24m-10 9h10" stroke="#d9b46e" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="64" y="78" font-size="18" font-weight="700" fill="#d9b46e">FRAKTIONSBOGEN · VORDERSEITE</text><text x="64" y="129" font-size="42" font-weight="700" fill="#f6f3ea">Die Silberschwingen</text><text x="64" y="196" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name belegt</text><path d="M64 243H1056" stroke="#d9b46e" stroke-width="2"/><text x="64" y="279" font-size="18" font-weight="700" fill="#d9b46e">EIFER</text><text x="64" y="313" font-size="25" font-weight="400" fill="#e5ebee">In der Agendaphase stimmst du immer zuerst ab. Gibst du</text><text x="64" y="347" font-size="25" font-weight="400" fill="#e5ebee">mindestens 1 Stimme ab, kommt für jeden Spieler in der Partie,</text><text x="64" y="381" font-size="25" font-weight="400" fill="#e5ebee">dich eingeschlossen, 1 Stimme hinzu.</text><text x="64" y="439" font-size="18" font-weight="700" fill="#d9b46e">ÜBERFALLFORMATION</text><text x="64" y="473" font-size="25" font-weight="400" fill="#e5ebee">Erzielen deine Einheiten mit Jägerabwehr mehr Treffer, als der</text><text x="64" y="507" font-size="25" font-weight="400" fill="#e5ebee">Gegner Jäger hat, wird für jeden überzähligen Treffer 1</text><text x="64" y="541" font-size="25" font-weight="400" fill="#e5ebee">gegnerisches Schiff deiner Wahl mit Schadensresistenz</text><text x="64" y="575" font-size="25" font-weight="400" fill="#e5ebee">beschädigt.</text><text x="64" y="633" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · QUETZECOATL</text><text x="64" y="667" font-size="25" font-weight="400" fill="#e5ebee">Kosten 8 · Kampf 7 (×2) · Bewegung 1 · Kapazität 3</text><text x="64" y="725" font-size="18" font-weight="700" fill="#d9b46e">FLAGGSCHIFF · KURZREFERENZ</text><text x="64" y="759" font-size="25" font-weight="400" fill="#e5ebee">Schadensresistenz. Andere Spieler können keine</text><text x="64" y="793" font-size="25" font-weight="400" fill="#e5ebee">Weltraumkanone gegen deine Schiffe in diesem System</text><text x="64" y="827" font-size="25" font-weight="400" fill="#e5ebee">einsetzen.</text><text x="64" y="885" font-size="18" font-weight="700" fill="#d9b46e">MASSENPRODUKTE</text><text x="64" y="919" font-size="25" font-weight="400" fill="#e5ebee">3</text><path d="M64 987H1056" stroke="#68798a" stroke-width="1"/><text x="64" y="1021" font-size="18" font-weight="700" fill="#d9b46e">REFERENZHILFE · SINNGEMÄSS</text><text x="64" y="1052" font-size="17" fill="#b9c6d1">Prophezeiung der Könige</text><text x="64" y="1075" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
