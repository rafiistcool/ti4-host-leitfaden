<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1002" viewBox="0 0 680 1002" role="img" aria-labelledby="title desc"><title id="title">Experimentelle Kampfstation — deutsche Referenzhilfe</title><desc id="desc">Eigene Vektorgestaltung. Sinngemäße Zusammenfassung aus den Kompendium-Daten, kein Originalscan.</desc><rect width="680" height="1002" rx="24" fill="#111e2a"/><rect x="12" y="12" width="656" height="978" rx="18" fill="none" stroke="#dc8f78" stroke-width="2"/><path d="M590 31h40m-24 9h24m-10 9h10" stroke="#dc8f78" stroke-width="3"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="78" font-size="18" font-weight="700" fill="#dc8f78">AKTIONSKARTE</text><text x="48" y="129" font-size="38" font-weight="700" fill="#f6f3ea">Experimentelle</text><text x="48" y="181" font-size="38" font-weight="700" fill="#f6f3ea">Kampfstation</text><text x="48" y="243" font-size="17" font-weight="400" fill="#b9c6d1">Deutscher Name aus Spieldaten</text><path d="M48 290H632" stroke="#dc8f78" stroke-width="2"/><text x="48" y="326" font-size="18" font-weight="700" fill="#dc8f78">WANN</text><text x="48" y="360" font-size="26" font-weight="400" fill="#e5ebee">Nachdem der aktive Spieler in einer</text><text x="48" y="396" font-size="26" font-weight="400" fill="#e5ebee">Taktikaktion Schiffe ins aktive</text><text x="48" y="432" font-size="26" font-weight="400" fill="#e5ebee">System bewegt hat</text><text x="48" y="492" font-size="18" font-weight="700" fill="#dc8f78">KURZREFERENZ</text><text x="48" y="526" font-size="26" font-weight="400" fill="#e5ebee">Eine deiner Raumwerften im aktiven</text><text x="48" y="562" font-size="26" font-weight="400" fill="#e5ebee">oder einem angrenzenden System</text><text x="48" y="598" font-size="26" font-weight="400" fill="#e5ebee">schießt mit Weltraumkanone 5 (x3)</text><text x="48" y="634" font-size="26" font-weight="400" fill="#e5ebee">auf die Schiffe des aktiven Spielers</text><text x="48" y="670" font-size="26" font-weight="400" fill="#e5ebee">im aktiven System. Gilt im</text><text x="48" y="706" font-size="26" font-weight="400" fill="#e5ebee">Zeitfenster des Offensivfeuers und</text><text x="48" y="742" font-size="26" font-weight="400" fill="#e5ebee">nur, wenn tatsächlich Schiffe</text><text x="48" y="778" font-size="26" font-weight="400" fill="#e5ebee">hineingezogen sind.</text><path d="M48 848H632" stroke="#68798a" stroke-width="1"/><text x="48" y="882" font-size="18" font-weight="700" fill="#dc8f78">REFERENZHILFE · SINNGEMÄSS</text><text x="48" y="913" font-size="17" fill="#b9c6d1">Grundspiel</text><text x="48" y="936" font-size="17" fill="#b9c6d1">Eigene Gestaltung · Kartentexte in eigenen Worten</text></g></svg>
