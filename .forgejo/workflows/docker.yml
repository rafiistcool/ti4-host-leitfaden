# Laeuft auf dem eigenen Forgejo-Runner. Images gehen in die Forgejo-Registry (git.tillhome.de), nur amd64.
name: Docker-Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  # In Pull Requests nur bauen (prüft Dockerfiles und nginx-Konfiguration), nicht veröffentlichen
  pull_request:
    paths: ["Dockerfile", "docker/**", "server/**", ".forgejo/workflows/docker.yml"]
  workflow_dispatch:

jobs:
  image:
    # Nur der Runner mit dem Label docker-host gibt Jobs den Docker-Socket.
    runs-on: docker-host
    strategy:
      # Ein fehlgeschlagenes API-Image soll das Seiten-Image nicht abbrechen
      fail-fast: false
      matrix:
        include:
          - name: Seite (nginx)
            context: .
            image: git.tillhome.de/${{ github.repository }}
          - name: Hub-API (Rust)
            context: ./server
            image: git.tillhome.de/${{ github.repository }}-api
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: git.tillhome.de
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
