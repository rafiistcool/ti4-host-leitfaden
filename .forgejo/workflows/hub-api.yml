# Laeuft auf dem eigenen Forgejo-Runner (git.tillhome.de). Die GitHub-Variante unter .github/workflows ist auf GitHub deaktiviert.
name: Hub-API

on:
  push:
    branches: [main]
    paths: ["server/**", ".forgejo/workflows/hub-api.yml"]
  pull_request:
    paths: ["server/**", ".forgejo/workflows/hub-api.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
