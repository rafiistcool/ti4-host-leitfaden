spring.application.name=ti4-hub

# Daten liegen als H2-Datei im Ordner TI4_DATA_DIR (im Container ein Volume unter /data).
spring.datasource.url=jdbc:h2:file:${TI4_DATA_DIR:./data}/ti4hub;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080
server.forward-headers-strategy=framework

# Healthcheck unter /api/actuator/health, damit er auch hinter dem nginx-Proxy erreichbar ist
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health

# Komma-getrennte Liste, nur wenn Seite und API unter verschiedenen Adressen laufen
# (z. B. https://rafiistcool.github.io). Umgebungsvariable: TI4_CORS_ALLOWED_ORIGINS
ti4.cors.allowed-origins=${TI4_CORS_ALLOWED_ORIGINS:}
